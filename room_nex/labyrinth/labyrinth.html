<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лабиринт Некса</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: radial-gradient(circle at center, rgba(11, 15, 20, 0.7), rgba(0, 0, 0, 0.85)), 
                  url('brtzales.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color:#d9f1ff;
      font-family: Georgia, serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    a{
      text-decoration:none;
      color:#7fdfff;
      font-size:30px;
      letter-spacing:0.12em;
      max-width: 800px;
      transition: text-shadow 0.3s ease;
      line-height: 1.4;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    a:hover{
      text-shadow:0 0 12px #7fdfff, 0 0 30px rgba(127, 223, 255, 0.3);
    }
  </style>
</head>

<body>

  <a href="sharik.html" id="aphorismLink">
    <!-- Сюда будет вставлен афоризм -->
  </a>

  <script>
    const aphorisms = [
      "ЕСЛИ МЕХАНИЗМ УЖЕ ДЫШИТ — НЕ СТОИТ ПРОВЕРЯТЬ, ИЗ ЧЕГО ОН СДЕЛАН",
      "ДОЛГО ВГЛЯДЫВАЯСЬ В НЕБО МОЖНО УВИДЕТЬ МУРАШКИ ВСЕГО МИРА",
      "ЧЕЛОВЕК ПЫТАЕТСЯ СТАТЬ СТЕНОЙ, НО ЖИВЕТ, ПОКА СПОСОБЕН БЫТЬ ТУМАНОМ",
      "СМЫСЛ ФРАЗЫ ЖИВЕТ НЕ В СЛОВАХ, А В МИРЕ, ГДЕ ОНА ПРОИЗНЕСЕНА",
      "КОГДА МЫСЛЬ НЕ ТЕРЯЕТСЯ ПО ДОРОГЕ — ДОРОГА СТАНОВИТСЯ КОРОЧЕ",
      "КОГДА ПУТЕЙ БОЛЬШЕ — ЦЕЛЬ ТЕРЯЕТ ВАЖНОСТЬ",
      "СНАЧАЛА СПРОСИТЬ У ДОМА, А ПОТОМ УЖЕ У ДОРОГИ",
        "ВЕЛИЧИЕ НЕ ЗАВИСИТ ОТ МАСШТАБА",
      "КОГДЛА ПРЕДМЕТЫ СТАНОВЯТСЯ СЛИШКОМ ПРАВИЛЬНЫМИ — ИЗ НИХ УХОДИТ СУДЬБА"
    ];

    function getNextAphorism() {
      let lastIndex = localStorage.getItem('nexAphorismIndex2');
      if (lastIndex === null) {
        lastIndex = -1;
      } else {
        lastIndex = parseInt(lastIndex, 10);
      }
      let nextIndex = (lastIndex + 1) % aphorisms.length;
      localStorage.setItem('nexAphorismIndex2', nextIndex);
      return aphorisms[nextIndex];
    }

    const link = document.getElementById('aphorismLink');
    link.textContent = getNextAphorism();
  </script>

</body>
</html>
