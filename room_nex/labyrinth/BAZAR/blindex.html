<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Добрий базарний день</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    -webkit-tap-highlight-color: transparent; /* убирает серый фон при тапе */
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.wrapper{
    position:relative;
    height:100vh;
}

.wrapper img{
    height:100%;
    display:block;
    pointer-events: none; /* чтобы клик проходил сквозь картинку на монету */
}

/* Кнопка-монета */

.coin{

    position:absolute;

    left:50%;
    top:57.5%;

    width:150px;
    height:150px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    cursor:pointer;

    background:rgba(255,255,255,0);

    /* Мобильные фиксы */
    touch-action: manipulation; /* отключает задержку 300мс */
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
}

.coin:hover{

    background:rgba(255,255,255,.05);

}

/* Добавляем активное состояние для мобильных */
.coin:active {
    background: rgba(255,255,255,.1);
}

</style>
</head>

<body>

<div class="wrapper">

<img src="titylka.png">

<!-- Используем ontouchstart как резерв для мобильных -->
<div class="coin"
     onclick="location.href='Bazarcena.html'"
     ontouchstart="location.href='Bazarcena.html'">
</div>

</div>

</body>
</html>
