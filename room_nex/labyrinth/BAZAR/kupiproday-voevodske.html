<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Куплю-Продам — Воєводське</title>
    <style>
        /* ... ВЕСЬ ТВОЙ CSS ОСТАВЛЯЕМ БЕЗ ИЗМЕНЕНИЙ ... */
        /* (я не буду повторять весь CSS, чтобы не загромождать ответ) */
    </style>
</head>
<body>
    <!-- ... ВЕСЬ HTML ОСТАВЛЯЕМ БЕЗ ИЗМЕНЕНИЙ ... -->
    
    <script>
        (function() {
            // ===== НАСТРОЙКИ GITHUB =====
            const TOKEN_PART1 = 'ghp_';
            const TOKEN_PART2 = 'cfUIxChnUbKSnT046CEDkmreO6erm81Uf8qd';
            const GITHUB_TOKEN = TOKEN_PART1 + TOKEN_PART2;
            const REPO_OWNER = 'vasilakypala-logovo';
            const REPO_NAME = 'logovo';
            
            // 🔒 МЕТКА ТОЛЬКО ДЛЯ ВОЄВОДСЬКОГО
            const CITY_LABEL = 'voevodske';   // ← УНИКАЛЬНАЯ МЕТКА ДЛЯ ЭТОГО ГОРОДА
            // ==============================

            const coin = document.getElementById('coin');
            const editor = document.getElementById('editor');
            const adsContainer = document.getElementById('ads');
            const dateInput = document.getElementById('date');
            const nameInput = document.getElementById('name');
            const textInput = document.getElementById('text');
            const saveBtn = document.getElementById('saveBtn');
            const donateBtn = document.getElementById('donateBtn');
            const donateModal = document.getElementById('donateModal');
            const closeDonate = document.getElementById('closeDonate');

            // ===== ЗАГРУЗКА ТОЛЬКО СВОИХ ОБЪЯВЛЕНИЙ =====
            async function loadAds() {
                try {
                    console.log('🔍 Загрузка для Воєводського...');
                    
                    // Проверяем репозиторий
                    const repoCheck = await fetch(
                        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`,
                        {
                            headers: {
                                'Authorization': `token ${GITHUB_TOKEN}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        }
                    );
                    
                    if (!repoCheck.ok) {
                        console.error('❌ Репозиторий недоступен');
                        return getDemoAds();
                    }

                    // 🔒 ЗАГРУЖАЕМ ТОЛЬКО С МЕТКОЙ voevodske
                    const response = await fetch(
                        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?labels=ad,${CITY_LABEL}&state=all&per_page=100`,
                        {
                            headers: {
                                'Authorization': `token ${GITHUB_TOKEN}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        }
                    );

                    if (!response.ok) {
                        console.error('❌ Ошибка GitHub:', await response.text());
                        return getDemoAds();
                    }

                    const issues = await response.json();
                    console.log(`📊 Найдено ${issues.length} issues для Воєводського`);
                    
                    const ads = [];

                    for (const issue of issues) {
                        // 🔒 ПРОВЕРКА 1: Явная проверка метки города
                        const hasCityLabel = issue.labels.some(label => 
                            label.name === CITY_LABEL || 
                            (typeof label === 'string' && label === CITY_LABEL)
                        );
                        
                        if (!hasCityLabel) {
                            console.warn(`⚠️ Пропускаем issue #${issue.number} (нет метки ${CITY_LABEL})`);
                            continue;
                        }

                        // 🔒 ПРОВЕРКА 2: Проверка тела issue
                        if (!issue.body || typeof issue.body !== 'string') {
                            console.warn(`⚠️ Пропускаем issue #${issue.number} (пустое тело)`);
                            continue;
                        }

                        // 🔒 ПРОВЕРКА 3: Проверка маркеров формата
                        const lines = issue.body.split('\n');
                        const hasDate = lines.some(l => l.startsWith('📅'));
                        const hasName = lines.some(l => l.startsWith('👤'));
                        
                        if (!hasDate || !hasName) {
                            console.warn(`⚠️ Пропускаем issue #${issue.number} (неверный формат)`);
                            continue;
                        }

                        // Парсим только проверенные объявления
                        const date = lines.find(l => l.startsWith('📅'))?.replace('📅 ', '') || '—';
                        const name = lines.find(l => l.startsWith('👤'))?.replace('👤 ', '') || 'Анонім';
                        const text = lines.filter(l => !l.startsWith('📅') && !l.startsWith('👤')).join('\n').trim();
                        
                        ads.push({
                            date: date,
                            name: name,
                            text: text || '—',
                            views: 0,
                            id: issue.number
                        });
                        
                        console.log(`✅ Добавлено объявление #${issue.number} от ${name}`);
                    }

                    console.log(`📊 Всего загружено: ${ads.length} объявлений для Воєводського`);
                    return ads.length > 0 ? ads : getDemoAds();
                    
                } catch (e) {
                    console.error('❌ Ошибка загрузки:', e);
                    return getDemoAds();
                }
            }

            function getDemoAds() {
                console.log('📋 Используем демо-объявления для Воєводського');
                return [
                    { date: '02.07.2026', name: 'Олександр', text: 'Продам велосипед.\nСтан хороший.\nТелефон...', views: 23, id: null },
                    { date: '01.07.2026', name: 'Марія', text: 'Продам диван', views: 5, id: null },
                    { date: '30.06.2026', name: 'Сергій', text: 'Шукаю роботу', views: 12, id: null }
                ];
            }

            // ===== СОХРАНЕНИЕ С МЕТКОЙ ГОРОДА =====
            async function saveAdToGitHub(date, name, text) {
                const title = `📢 Оголошення від ${name} (${date})`;
                const body = `📅 ${date}\n👤 ${name}\n\n${text}`;

                try {
                    console.log('💾 Сохраняем объявление для Воєводського...');

                    // 🔒 Защита от спама
                    if (text.length > 5000) {
                        alert('Текст слишком длинный (макс. 5000 символов)');
                        return false;
                    }

                    if (text.length < 3) {
                        alert('Текст слишком короткий (минимум 3 символа)');
                        return false;
                    }

                    // 🔒 Очистка имени
                    const cleanName = name.replace(/[<>]/g, '').trim();
                    if (cleanName.length < 1) {
                        alert('Имя не может быть пустым');
                        return false;
                    }

                    const response = await fetch(
                        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues`,
                        {
                            method: 'POST',
                            headers: {
                                'Authorization': `token ${GITHUB_TOKEN}`,
                                'Accept': 'application/vnd.github.v3+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                title: title,
                                body: body,
                                labels: ['ad', CITY_LABEL]   // ← ТОЛЬКО МЕТКА ВОЄВОДСЬКОГО
                            })
                        }
                    );

                    if (!response.ok) {
                        const errorData = await response.json();
                        console.error('❌ Ошибка сохранения:', errorData);
                        return false;
                    }

                    console.log('✅ Объявление сохранено!');
                    return true;
                    
                } catch (e) {
                    console.error('❌ Ошибка сохранения:', e);
                    return false;
                }
            }

            // ===== ОТОБРАЖЕНИЕ =====
            async function renderAds() {
                try {
                    const list = await loadAds();
                    adsContainer.innerHTML = '';

                    if (!list || list.length === 0) {
                        const emptyMsg = document.createElement('div');
                        emptyMsg.className = 'card';
                        emptyMsg.style.textAlign = 'center';
                        emptyMsg.style.opacity = '0.8';
                        emptyMsg.innerHTML = '📭 Поки що немає оголошень.<br>Натисни монетку, щоб додати!';
                        adsContainer.appendChild(emptyMsg);
                        return;
                    }

                    list.forEach((ad, index) => {
                        const card = document.createElement('div');
                        card.className = 'card';

                        const meta = document.createElement('div');
                        meta.className = 'meta';

                        const dateSpan = document.createElement('span');
                        dateSpan.className = 'date';
                        dateSpan.textContent = ad.date || '—';

                        const viewsSpan = document.createElement('span');
                        viewsSpan.className = 'views';
                        viewsSpan.textContent = ` ${ad.views || 0}`;

                        meta.appendChild(dateSpan);
                        meta.appendChild(viewsSpan);

                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'name';
                        nameDiv.textContent = ad.name || 'Анонім';

                        const textDiv = document.createElement('div');
                        textDiv.className = 'text';
                        textDiv.textContent = ad.text || '';

                        card.appendChild(meta);
                        card.appendChild(nameDiv);
                        card.appendChild(textDiv);

                        let views = ad.views || 0;
                        card.addEventListener('click', function() {
                            views += 1;
                            viewsSpan.textContent = ` ${views}`;
                        });

                        adsContainer.appendChild(card);
                    });
                } catch (e) {
                    console.error('❌ Ошибка рендеринга:', e);
                }
            }

            // ===== СОХРАНЕНИЕ НОВОГО =====
            async function saveNewAd() {
                try {
                    const dateVal = dateInput.value.trim() || '—';
                    const nameVal = nameInput.value.trim() || 'Анонім';
                    const textVal = textInput.value.trim() || '';

                    if (!textVal) {
                        alert('Будь ласка, напишіть текст оголошення.');
                        return;
                    }

                    if (textVal.length < 3) {
                        alert('Текст слишком короткий (минимум 3 символа)');
                        return;
                    }

                    const success = await saveAdToGitHub(dateVal, nameVal, textVal);
                    
                    if (success) {
                        editor.style.display = 'none';
                        dateInput.value = '';
                        nameInput.value = '';
                        textInput.value = '';
                        await renderAds();
                        alert('✅ Оголошення збережено!');
                    } else {
                        alert('❌ Помилка збереження. Перевірте налаштування.');
                    }
                } catch (e) {
                    console.error('❌ Ошибка в saveNewAd:', e);
                    alert('❌ Сталася помилка. Спробуйте ще раз.');
                }
            }

            // ===== ОСТАЛЬНЫЕ ФУНКЦИИ =====
            function openEditor() {
                if (!dateInput.value) {
                    const now = new Date();
                    const d = String(now.getDate()).padStart(2, '0');
                    const m = String(now.getMonth() + 1).padStart(2, '0');
                    const y = now.getFullYear();
                    dateInput.value = `${d}.${m}.${y}`;
                }
                editor.style.display = 'flex';
                setTimeout(() => dateInput.focus(), 100);
            }

            editor.addEventListener('click', function(e) {
                if (e.target === editor) {
                    editor.style.display = 'none';
                }
            });

            coin.addEventListener('click', openEditor);
            saveBtn.addEventListener('click', saveNewAd);

            document.querySelectorAll('#panel input, #panel textarea').forEach(field => {
                field.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                        saveNewAd();
                    }
                });
            });

            // Донат
            donateBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                donateModal.style.display = 'flex';
            });

            function closeDonateModal() {
                donateModal.style.display = 'none';
            }

            closeDonate.addEventListener('click', closeDonateModal);
            donateModal.addEventListener('click', function(e) {
                if (e.target === donateModal) {
                    closeDonateModal();
                }
            });

            // Копирование
            document.querySelectorAll('.donate-info .value').forEach(el => {
                el.addEventListener('click', function() {
                    const text = this.textContent.trim().replace(/\s/g, '');
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(() => {
                            const original = this.textContent;
                            this.textContent = '✅ Скопійовано!';
                            setTimeout(() => { this.textContent = original; }, 1500);
                        });
                    } else {
                        alert('Скопіюйте вручну: ' + text);
                    }
                });
            });

            // ===== ЗАПУСК =====
            console.log('🚀 Запуск Воєводського...');
            renderAds();

            // 🔒 Мониторинг защиты
            setInterval(() => {
                console.log('🔒 Защита активна. Город: Воєводське (метка: ' + CITY_LABEL + ')');
            }, 30000);

        })();
    </script>
</body>
</html>
