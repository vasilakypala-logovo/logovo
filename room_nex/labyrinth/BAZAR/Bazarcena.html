<script>
// ============================================
//  ОСНОВНОЙ КОД
// ============================================
const REPO_OWNER = "vasilakypala-logovo";
const REPO_NAME = "logovo";
const FILE_PATH = "prices.json";

let GITHUB_TOKEN = localStorage.getItem('github_token');

// Функция сохранения токена
function saveToken() {
    const input = document.getElementById('tokenInput');
    const token = input.value.trim();
    const status = document.getElementById('tokenStatus');
    
    if (!token) {
        status.textContent = '❌ Введите токен';
        status.style.color = '#ff3030';
        return;
    }
    
    localStorage.setItem('github_token', token);
    GITHUB_TOKEN = token;
    
    status.textContent = '✅ Токен сохранен! Загрузка...';
    status.style.color = '#00cc66';
    
    // Скрываем окно токена
    document.getElementById('tokenArea').classList.remove('active');
    
    // Загружаем данные
    loadData();
}

// Функция загрузки данных
async function loadData() {
    const loading = document.getElementById('loading');
    loading.style.display = 'flex';
    
    try {
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        const resp = await fetch(url, {
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });
        
        if (resp.ok) {
            const data = await resp.json();
            fileSha = data.sha;
            const content = base64ToUtf8(data.content);
            const parsed = JSON.parse(content);
            
            if (parsed.products) allProducts = parsed.products;
            if (parsed.prices) pricesData = parsed.prices;
            
            localStorage.setItem('priceCache', JSON.stringify({ products: allProducts, prices: pricesData, time: Date.now() }));
            console.log('✅ Загружено с GitHub');
        } else if (resp.status === 404) {
            if (GITHUB_TOKEN) {
                await saveToGitHub(true);
            }
        } else {
            throw new Error('Ошибка загрузки');
        }
    } catch (e) {
        console.error('❌ Ошибка:', e);
        try {
            const cache = JSON.parse(localStorage.getItem('priceCache'));
            if (cache) {
                allProducts = cache.products || allProducts;
                pricesData = cache.prices || {};
                alert('⚠️ Нет доступа к GitHub. Показываю локальный кэш.');
            }
        } catch(e2) {}
    } finally {
        loading.style.display = 'none';
        // Обновляем интерфейс
        updateDateDisplay();
        buildProductMenu();
        buildCityList();
        renderPrices();
    }
}

async function saveToGitHub(create = false) {
    try {
        const data = {
            products: allProducts,
            prices: pricesData
        };
        const jsonStr = JSON.stringify(data, null, 2);
        const content = utf8ToBase64(jsonStr);
        const payload = {
            message: "Обновление цен",
            content: content,
            branch: "main"
        };
        if (!create && fileSha) {
            payload.sha = fileSha;
        }
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        const resp = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify(payload)
        });
        if (!resp.ok) throw new Error('Ошибка сохранения');
        const result = await resp.json();
        fileSha = result.content.sha;
        localStorage.setItem('priceCache', JSON.stringify({ products: allProducts, prices: pricesData, time: Date.now() }));
        return true;
    } catch (e) {
        console.error('❌ Ошибка сохранения:', e);
        return false;
    }
}

function utf8ToBase64(str) {
    const encoder = new TextEncoder();
    const bytes = encoder.encode(str);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
}

function base64ToUtf8(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    const decoder = new TextDecoder('utf-8');
    return decoder.decode(bytes);
}

    "ЛИПНЯ","СЕРПНЯ","ВЕРЕСНЯ","ЖОВТНЯ","ЛИСТОПАДА","ГРУДНЯ"

function updateDateDisplay() {
    const now = new Date();
    document.getElementById('dayNumber').textContent = now.getDate();
    document.getElementById('monthName').textContent = MONTHS_UA[now.getMonth()];
}

function renderPrices() {
    document.querySelectorAll('.price').forEach(el => el.remove());
    if (!currentProduct) return;
    TOWNS.forEach(town => {
        const price = getPrice(town, currentProduct);
        const coords = TOWN_COORDS[town];
        if (!coords) return;
        const div = document.createElement('div');
        div.className = 'price';
        div.style.left = coords.x + '%';
        div.style.top = coords.y + '%';
        if (price && price > 0) {
            div.innerHTML = price + ' грн.<span class="town">' + town + '</span>';
        } else {
            div.innerHTML = '—<span class="town">' + town + '</span>';
            div.style.color = '#ff6600';
            div.style.textShadow = '0 0 8px #ff6600';
        }
        div.style.display = 'block';
        document.getElementById('wrap').appendChild(div);
    });
}

function buildProductMenu() {
    const menu = document.getElementById('prod');
    menu.innerHTML = '';
    allProducts.forEach(p => {
        const div = document.createElement('div');
        div.className = 'item';
        div.textContent = p;
        div.onclick = (e) => {
            e.stopPropagation();
            selectProduct(p);
        };
        menu.appendChild(div);
    });
}

function selectProduct(product) {
    currentProduct = product;
    document.getElementById('prod').style.display = 'none';
    const sel = document.getElementById('sel');
    sel.style.display = 'block';
    sel.textContent = product;
    renderPrices();
    if (navigator.vibrate) navigator.vibrate(15);
}

function buildCityList() {
    const container = document.getElementById('cityList');
    container.innerHTML = '';
    TOWNS.forEach(town => {
        const div = document.createElement('div');
        div.className = 'city-item';
        if (hasAnyPrices(town)) {
            div.classList.add('has-prices');
            div.innerHTML = town + '<span class="badge">✅ есть цены</span>';
        } else {
            div.innerHTML = town + '<span class="badge">⬜ нет цен</span>';
        }
        div.onclick = () => openPriceEditor(town);
        container.appendChild(div);
    });
}

function openModal(id) {
    document.getElementById(id).classList.add('active');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
    const err = document.getElementById('codeError');
    if (err) err.style.display = 'none';
    const inp = document.getElementById('codeInput');
    if (inp) inp.value = '';
}

function openCitySelector() {
    buildCityList();
    openModal('modalCity');
}

function openPriceEditor(city) {
    editingCity = city;
    closeModal('modalCity');
    document.getElementById('priceEditorTitle').textContent = '📝 ' + city;
    buildProductEditor(city);
    openModal('modalPrices');
}

function buildProductEditor(city) {
    const container = document.getElementById('productList');
    container.innerHTML = '';
    allProducts.forEach(product => {
        const row = document.createElement('div');
        row.className = 'product-row';
        const price = getPrice(city, product);
        const priceValue = (price && price > 0) ? price : '';
        const nameSpan = document.createElement('span');
        nameSpan.className = 'pname';
        nameSpan.textContent = product;
        const input = document.createElement('input');
        input.type = 'number';
        input.min = '0';
        input.step = '1';
        input.value = priceValue;
        input.placeholder = '—';
        input.dataset.product = product;
        const unitSpan = document.createElement('span');
        unitSpan.className = 'unit';
        unitSpan.textContent = 'грн.';
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-product';
        deleteBtn.textContent = '✕';
        deleteBtn.onclick = () => deleteProduct(product);
        row.appendChild(nameSpan);
        row.appendChild(input);
        row.appendChild(unitSpan);
        row.appendChild(deleteBtn);
        container.appendChild(row);
    });
    document.getElementById('newProductName').value = '';
}

function addProduct() {
    const input = document.getElementById('newProductName');
    const name = input.value.trim().toUpperCase();
    if (!name) { alert('Введите название!'); return; }
    if (allProducts.indexOf(name) !== -1) { alert('Уже есть!'); return; }
    allProducts.push(name);
    allProducts.sort();
    buildProductEditor(editingCity);
    buildProductMenu();
    if (navigator.vibrate) navigator.vibrate(10);
    input.value = '';
}

function deleteProduct(product) {
    if (!confirm('Удалить "' + product + '" из всех городов?')) return;
    allProducts = allProducts.filter(p => p !== product);
    TOWNS.forEach(city => {
        if (pricesData[city]) {
            delete pricesData[city][product];
            if (Object.keys(pricesData[city]).length === 0) delete pricesData[city];
        }
    });
    if (currentProduct === product) {
        currentProduct = null;
        document.getElementById('sel').style.display = 'none';
        document.querySelectorAll('.price').forEach(el => el.remove());
    }
    buildProductEditor(editingCity);
    buildProductMenu();
    renderPrices();
}

async function savePrices() {
    if (!GITHUB_TOKEN) {
        alert('❌ Нет токена!');
        document.getElementById('tokenArea').classList.add('active');
        return;
    }
    if (!editingCity) return;
    const inputs = document.querySelectorAll('#productList .product-row input[type="number"]');
    inputs.forEach(input => {
        const product = input.dataset.product;
        const value = parseFloat(input.value.trim());
        if (value && value > 0) {
            if (!pricesData[editingCity]) pricesData[editingCity] = {};
            pricesData[editingCity][product] = value;
        } else {
            if (pricesData[editingCity]) {
                delete pricesData[editingCity][product];
                if (Object.keys(pricesData[editingCity]).length === 0) delete pricesData[editingCity];
            }
        }
    });
    const ok = await saveToGitHub();
    if (!ok) {
        alert('❌ Не удалось сохранить. Проверь токен.');
        return;
    }
    renderPrices();
    closeModal('modalPrices');
    if (navigator.vibrate) navigator.vibrate(15);
    buildCityList();
    alert('✅ Цены сохранены в репозитории!');
}

function checkCode() {
    const input = document.getElementById('codeInput');
    const code = input.value.trim();
    const error = document.getElementById('codeError');
    if (code === '777') {
        error.style.display = 'none';
        closeModal('modalCode');
        openCitySelector();
    } else {
        error.style.display = 'block';
        input.value = '';
        if (navigator.vibrate) navigator.vibrate(50);
    }
}

// Инициализация
async function init() {
    // Проверяем есть ли токен
    if (GITHUB_TOKEN) {
        // Токен есть - скрываем окно и грузим данные
        document.getElementById('tokenArea').classList.remove('active');
        await loadData();
    } else {
        // Токена нет - показываем окно
        document.getElementById('tokenArea').classList.add('active');
        document.getElementById('loading').style.display = 'none';
    }
    
    // Настройка кнопок
    document.getElementById('zoneLeft').onclick = function() {
        const menu = document.getElementById('prod');
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        if (navigator.vibrate) navigator.vibrate(10);
    };

    document.getElementById('zoneRight').onclick = function() {
        if (!GITHUB_TOKEN) {
            document.getElementById('tokenArea').classList.add('active');
            return;
        }
        openModal('modalCode');
        if (navigator.vibrate) navigator.vibrate(10);
        document.getElementById('codeInput').focus();
    };

    document.querySelectorAll('.modal-overlay').forEach(el => {
        el.onclick = function(e) {
            if (e.target === this) this.classList.remove('active');
        };
    });

    document.getElementById('codeInput').onkeydown = function(e) {
        if (e.key === 'Enter') checkCode();
    };

    console.log('✅ Загружено!');
}

// Запускаем
init();
</script>
