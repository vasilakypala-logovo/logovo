<script>
// ============================================
//  ОСНОВНИЙ КОД
// ============================================
const REPO_OWNER = "vasilakypala-logovo";
const REPO_NAME = "logovo";
const FILE_PATH = "prices.json";

let GITHUB_TOKEN = localStorage.getItem('github_token');
let allProducts = ["МЕД", "КАРТОШКА", "САЛО", "МЯКИШ", "КАВУНИ"];
let pricesData = {};
let currentProduct = null;
let editingCity = null;
let fileSha = null;

// ========== ЛІЧИЛЬНИК КЛІКІВ ПО "ЦЕНА" ==========

function updateClickCounter() {
    const today = new Date().toDateString();
    const stored = localStorage.getItem('clickCounter');
    let count = 1;
    
    if (stored) {
        const data = JSON.parse(stored);
        if (data.date === today) {
            count = data.count + 1;
        }
    }
    
    localStorage.setItem('clickCounter', JSON.stringify({ date: today, count: count }));
    updateFogCircle(count);
    return count;
}

function updateFogCircle(count) {
    const el = document.getElementById('fogCircle');
    if (el) {
        el.innerHTML = '🌫️ Сьогодні відвідали <strong>' + count + '</strong>';
    }
}

function getCurrentCount() {
    const today = new Date().toDateString();
    const stored = localStorage.getItem('clickCounter');
    if (stored) {
        const data = JSON.parse(stored);
        if (data.date === today) {
            return data.count;
        }
    }
    return 0;
}

const visitCount = getCurrentCount();

// ========== ТУМАННИЙ КРУЖОК ==========

const fogCircle = document.createElement('div');
fogCircle.id = 'fogCircle';
fogCircle.innerHTML = '🌫️ Сьогодні відвідали <strong>' + visitCount + '</strong>';
fogCircle.style.cssText = `
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 50%;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    padding: 25px;
    z-index: 9999;
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: 0 0 100px rgba(255,204,0,0.02), inset 0 0 80px rgba(255,255,255,0.01);
    pointer-events: none;
    line-height: 1.5;
    text-shadow: 0 0 40px rgba(255,255,255,0.05);
    letter-spacing: 1px;
    user-select: none;
    font-family: 'Arial', sans-serif;
`;
document.body.appendChild(fogCircle);

function hideFogCircle() {
    const el = document.getElementById('fogCircle');
    if (el && el.style.display !== 'none') {
        el.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%, -50%) scale(0.7)';
        setTimeout(() => { el.style.display = 'none'; }, 800);
    }
    document.removeEventListener('click', hideFogCircle);
    document.removeEventListener('touchstart', hideFogCircle);
}

document.addEventListener('click', hideFogCircle);
document.addEventListener('touchstart', hideFogCircle);

document.addEventListener('click', function(e) {
    if (e.target.closest('button') || e.target.closest('.click-zone') || e.target.closest('.item')) {
        hideFogCircle();
    }
});

// ===== ФУНКЦІЇ ДЛЯ ТОКЕНА =====

function showTokenArea() {
    var area = document.getElementById('tokenArea');
    if (area) {
        area.classList.add('active');
        var input = document.getElementById('tokenInput');
        if (input) {
            input.value = '';
            input.focus();
        }
        var status = document.getElementById('tokenStatus');
        if (status) status.textContent = '';
    }
}

function closeTokenArea() {
    var area = document.getElementById('tokenArea');
    if (area) {
        area.classList.remove('active');
        var status = document.getElementById('tokenStatus');
        if (status) status.textContent = '';
    }
    console.log('❌ Окно токена закрыто');
}

function saveToken() {
    var input = document.getElementById('tokenInput');
    var token = input ? input.value.trim() : '';
    var status = document.getElementById('tokenStatus');
    
    if (!token) {
        if (status) {
            status.textContent = '❌ Введите токен';
            status.style.color = '#ff3030';
        }
        return;
    }
    
    localStorage.setItem('github_token', token);
    GITHUB_TOKEN = token;
    
    if (status) {
        status.textContent = '✅ Токен сохранен! Загрузка...';
        status.style.color = '#00cc66';
    }
    
    setTimeout(function() {
        closeTokenArea();
        loadData();
    }, 800);
}

// ===== ЗАВАНТАЖЕННЯ ДАНИХ =====

async function loadData() {
    var loading = document.getElementById('loading');
    if (loading) loading.style.display = 'flex';
    
    try {
        if (GITHUB_TOKEN) {
            var url = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + FILE_PATH;
            var resp = await fetch(url, {
                headers: {
                    'Authorization': 'token ' + GITHUB_TOKEN,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            
            if (resp.ok) {
                var data = await resp.json();
                fileSha = data.sha;
                var content = base64ToUtf8(data.content);
                var parsed = JSON.parse(content);
                
                if (parsed.products) allProducts = parsed.products;
                if (parsed.prices) pricesData = parsed.prices;
                
                localStorage.setItem('priceCache', JSON.stringify({ products: allProducts, prices: pricesData, time: Date.now() }));
                console.log('✅ Загружено с GitHub (с токеном)');
                updateUI();
                if (loading) loading.style.display = 'none';
                return;
            }
        }
        
        var url2 = 'https://raw.githubusercontent.com/' + REPO_OWNER + '/' + REPO_NAME + '/main/' + FILE_PATH;
        var resp2 = await fetch(url2);
        
        if (resp2.ok) {
            var text = await resp2.text();
            var parsed2 = JSON.parse(text);
            
            if (parsed2.products) allProducts = parsed2.products;
            if (parsed2.prices) pricesData = parsed2.prices;
            
            localStorage.setItem('priceCache', JSON.stringify({ products: allProducts, prices: pricesData, time: Date.now() }));
            console.log('✅ Загружено с GitHub (публичный)');
            updateUI();
            if (loading) loading.style.display = 'none';
            return;
        }
        
        var cache = JSON.parse(localStorage.getItem('priceCache'));
        if (cache) {
            allProducts = cache.products || allProducts;
            pricesData = cache.prices || {};
            console.log('⚠️ Использую локальный кэш');
            updateUI();
            if (loading) loading.style.display = 'none';
            return;
        }
        
    } catch (e) {
        console.error('❌ Ошибка загрузки:', e);
        try {
            var cache2 = JSON.parse(localStorage.getItem('priceCache'));
            if (cache2) {
                allProducts = cache2.products || allProducts;
                pricesData = cache2.prices || {};
                console.log('⚠️ Использую локальный кэш (после ошибки)');
                updateUI();
                if (loading) loading.style.display = 'none';
                return;
            }
        } catch(e2) {}
    }
    
    if (loading) loading.style.display = 'none';
}

function updateUI() {
    updateDateDisplay();
    buildProductMenu();
    buildCityList();
    renderPrices();
}

// ===== ДОПОМІЖНІ ФУНКЦІЇ =====

function utf8ToBase64(str) {
    var encoder = new TextEncoder();
    var bytes = encoder.encode(str);
    var binary = '';
    for (var i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
}

function base64ToUtf8(base64) {
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    var decoder = new TextDecoder('utf-8');
    return decoder.decode(bytes);
}

async function saveToGitHub(create) {
    if (create === undefined) create = false;
    if (!GITHUB_TOKEN) {
        alert('❌ Нет токена! Нажми на шестеренку ⚙️ и введи токен.');
        return false;
    }
    
    try {
        var data = {
            products: allProducts,
            prices: pricesData
        };
        var jsonStr = JSON.stringify(data, null, 2);
        var content = utf8ToBase64(jsonStr);
        var payload = {
            message: "Обновление цен",
            content: content,
            branch: "main"
        };
        if (!create && fileSha) {
            payload.sha = fileSha;
        }
        var url = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + FILE_PATH;
        var resp = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': 'token ' + GITHUB_TOKEN,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify(payload)
        });
        if (!resp.ok) throw new Error('Ошибка сохранения');
        var result = await resp.json();
        fileSha = result.content.sha;
        localStorage.setItem('priceCache', JSON.stringify({ products: allProducts, prices: pricesData, time: Date.now() }));
        return true;
    } catch (e) {
        console.error('❌ Ошибка сохранения:', e);
        return false;
    }
}

// ===== ДАНІ =====

var TOWNS = [
    "Первомайск", "Помічна", "Лисогора", "Воєводське",
    "Благодатне", "Семенівка", "Арбузинка", "Братське",
    "Южноукраїнськ", "Вознесенськ"
];

var TOWN_COORDS = {
    "Первомайск": {x:15, y:8}, "Помічна": {x:85, y:8},
    "Лисогора": {x:55, y:15}, "Воєводське": {x:50, y:15},
    "Благодатне": {x:35, y:35}, "Семенівка": {x:15, y:44},
    "Арбузинка": {x:85, y:44}, "Братське": {x:68, y:62},
    "Южноукраїнськ": {x:18, y:62}, "Вознесенськ": {x:50, y:70}
};

var MONTHS_UA = [
    "СІЧНЯ","ЛЮТОГО","БЕРЕЗНЯ","КВІТНЯ","ТРАВНЯ","ЧЕРВНЯ",
    "ЛИПНЯ","СЕРПНЯ","ВЕРЕСНЯ","ЖОВТНЯ","ЛИСТОПАДА","ГРУДНЯ"
];

function getPrice(city, product) {
    return (pricesData[city] && pricesData[city][product]) || null;
}

function hasAnyPrices(city) {
    return pricesData[city] && Object.keys(pricesData[city]).length > 0;
}

function updateDateDisplay() {
    var now = new Date();
    var dayEl = document.getElementById('dayNumber');
    var monthEl = document.getElementById('monthName');
    if (dayEl) dayEl.textContent = now.getDate();
    if (monthEl) monthEl.textContent = MONTHS_UA[now.getMonth()];
}

function renderPrices() {
    var prices = document.querySelectorAll('.price');
    for (var i = 0; i < prices.length; i++) {
        prices[i].remove();
    }
    if (!currentProduct) return;
    
    for (var t = 0; t < TOWNS.length; t++) {
        var town = TOWNS[t];
        var price = getPrice(town, currentProduct);
        var coords = TOWN_COORDS[town];
        if (!coords) continue;
        
        var div = document.createElement('div');
        div.className = 'price';
        div.style.left = coords.x + '%';
        div.style.top = coords.y + '%';
        if (price && price > 0) {
            div.innerHTML = price + ' грн.<span class="town">' + town + '</span>';
        } else {
            div.innerHTML = '—<span class="town">' + town + '</span>';
            div.style.color = '#ff6600';
            div.style.textShadow = '0 0 8px #ff6600';
        }
        div.style.display = 'block';
        document.getElementById('wrap').appendChild(div);
    }
}

function buildProductMenu() {
    var menu = document.getElementById('prod');
    menu.innerHTML = '';
    for (var i = 0; i < allProducts.length; i++) {
        var p = allProducts[i];
        var div = document.createElement('div');
        div.className = 'item';
        div.textContent = p;
        div.onclick = (function(product) {
            return function(e) {
                e.stopPropagation();
                selectProduct(product);
            };
        })(p);
        menu.appendChild(div);
    }
}

function selectProduct(product) {
    updateClickCounter();
    
    currentProduct = product;
    document.getElementById('prod').style.display = 'none';
    var sel = document.getElementById('sel');
    sel.style.display = 'block';
    sel.textContent = product;
    renderPrices();
    if (navigator.vibrate) navigator.vibrate(15);
}

function buildCityList() {
    var container = document.getElementById('cityList');
    container.innerHTML = '';
    for (var i = 0; i < TOWNS.length; i++) {
        var town = TOWNS[i];
        var div = document.createElement('div');
        div.className = 'city-item';
        if (hasAnyPrices(town)) {
            div.classList.add('has-prices');
            div.innerHTML = town + '<span class="badge">✅ есть цены</span>';
        } else {
            div.innerHTML = town + '<span class="badge">⬜ нет цен</span>';
        }
        div.onclick = (function(city) {
            return function() {
                openPriceEditor(city);
            };
        })(town);
        container.appendChild(div);
    }
}

function openModal(id) {
    document.getElementById(id).classList.add('active');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

function openCitySelector() {
    buildCityList();
    openModal('modalCity');
}

function openPriceEditor(city) {
    if (!GITHUB_TOKEN) {
        alert('❌ Нет токена! Нажми на шестеренку ⚙️ и введи токен.');
        return;
    }
    editingCity = city;
    closeModal('modalCity');
    document.getElementById('priceEditorTitle').textContent = '📝 ' + city;
    buildProductEditor(city);
    openModal('modalPrices');
}

function buildProductEditor(city) {
    var container = document.getElementById('productList');
    container.innerHTML = '';
    for (var i = 0; i < allProducts.length; i++) {
        var product = allProducts[i];
        var row = document.createElement('div');
        row.className = 'product-row';
        var price = getPrice(city, product);
        var priceValue = (price && price > 0) ? price : '';
        var nameSpan = document.createElement('span');
        nameSpan.className = 'pname';
        nameSpan.textContent = product;
        var input = document.createElement('input');
        input.type = 'number';
        input.min = '0';
        input.step = '1';
        input.value = priceValue;
        input.placeholder = '—';
        input.dataset.product = product;
        var unitSpan = document.createElement('span');
        unitSpan.className = 'unit';
        unitSpan.textContent = 'грн.';
        var deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-product';
        deleteBtn.textContent = '✕';
        deleteBtn.onclick = (function(prod) {
            return function() {
                deleteProduct(prod);
            };
        })(product);
        row.appendChild(nameSpan);
        row.appendChild(input);
        row.appendChild(unitSpan);
        row.appendChild(deleteBtn);
        container.appendChild(row);
    }
    document.getElementById('newProductName').value = '';
}

function addProduct() {
    var input = document.getElementById('newProductName');
    var name = input.value.trim().toUpperCase();
    if (!name) { alert('Введите название!'); return; }
    if (allProducts.indexOf(name) !== -1) { alert('Уже есть!'); return; }
    allProducts.push(name);
    allProducts.sort();
    buildProductEditor(editingCity);
    buildProductMenu();
    if (navigator.vibrate) navigator.vibrate(10);
    input.value = '';
}

function deleteProduct(product) {
    if (!confirm('Удалить "' + product + '" из всех городов?')) return;
    allProducts = allProducts.filter(function(p) { return p !== product; });
    for (var i = 0; i < TOWNS.length; i++) {
        var city = TOWNS[i];
        if (pricesData[city]) {
            delete pricesData[city][product];
            if (Object.keys(pricesData[city]).length === 0) delete pricesData[city];
        }
    }
    if (currentProduct === product) {
        currentProduct = null;
        document.getElementById('sel').style.display = 'none';
        var prices = document.querySelectorAll('.price');
        for (var j = 0; j < prices.length; j++) {
            prices[j].remove();
        }
    }
    buildProductEditor(editingCity);
    buildProductMenu();
    renderPrices();
}

async function savePrices() {
    if (!GITHUB_TOKEN) {
        alert('❌ Нет токена! Нажми на шестеренку ⚙️ и введи токен.');
        return;
    }
    if (!editingCity) return;
    var inputs = document.querySelectorAll('#productList .product-row input[type="number"]');
    for (var i = 0; i < inputs.length; i++) {
        var input = inputs[i];
        var product = input.dataset.product;
        var value = parseFloat(input.value.trim());
        if (value && value > 0) {
            if (!pricesData[editingCity]) pricesData[editingCity] = {};
            pricesData[editingCity][product] = value;
        } else {
            if (pricesData[editingCity]) {
                delete pricesData[editingCity][product];
                if (Object.keys(pricesData[editingCity]).length === 0) delete pricesData[editingCity];
            }
        }
    }
    var ok = await saveToGitHub();
    if (!ok) {
        alert('❌ Не удалось сохранить. Проверь токен.');
        return;
    }
    renderPrices();
    closeModal('modalPrices');
    if (navigator.vibrate) navigator.vibrate(15);
    buildCityList();
    alert('✅ Цены сохранены в репозитории!');
}

// ===== ІНІЦІАЛІЗАЦІЯ =====

async function init() {
    await loadData();
    
    document.getElementById('zoneLeft').onclick = function() {
        var menu = document.getElementById('prod');
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        if (navigator.vibrate) navigator.vibrate(10);
    };

    document.getElementById('zoneRight').onclick = function() {
        if (!GITHUB_TOKEN) {
            showTokenArea();
            return;
        }
        openCitySelector();
        if (navigator.vibrate) navigator.vibrate(10);
    };

    var overlays = document.querySelectorAll('.modal-overlay');
    for (var i = 0; i < overlays.length; i++) {
        overlays[i].onclick = function(e) {
            if (e.target === this) this.classList.remove('active');
        };
    }

    console.log('✅ Загружено!');
}

init();
