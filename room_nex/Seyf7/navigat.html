<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Навигатор Сейфа</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(180, 210, 190, 0.08), transparent 50%),
        radial-gradient(circle at bottom right, rgba(95, 115, 110, 0.12), transparent 45%),
        linear-gradient(135deg, #030404, #121716 48%, #050606);
    color: #e8e3d6;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.nav-container {
    max-width: 900px;
    width: 100%;
    background:
        linear-gradient(145deg, rgba(30, 38, 36, 0.92), rgba(12, 16, 15, 0.95));
    border: 1px solid rgba(207, 214, 210, 0.35);
    border-radius: 24px;
    padding: 30px 35px 35px;
    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.7),
        inset 0 0 60px rgba(255, 255, 255, 0.03);
    position: relative;
}

.nav-container::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 40px;
    right: 40px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(215, 184, 102, 0.4), transparent);
    border-radius: 2px;
}

h2 {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 6px;
    color: #cfd6d2;
    text-align: center;
    text-shadow: 0 0 30px rgba(207, 214, 210, 0.12);
    margin-bottom: 6px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(207, 214, 210, 0.12);
}

.subtitle {
    text-align: center;
    font-size: 13px;
    color: rgba(207, 214, 210, 0.5);
    letter-spacing: 3px;
    margin-bottom: 25px;
}

.form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    padding: 18px 20px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 16px;
    border: 1px solid rgba(207, 214, 210, 0.08);
}

.form-row label {
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(207, 214, 210, 0.6);
}

.form-row input {
    padding: 8px 14px;
    font-size: 15px;
    font-family: 'Georgia', serif;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(207, 214, 210, 0.2);
    border-radius: 10px;
    color: #e8e3d6;
    outline: none;
    transition: border-color 0.3s;
    min-width: 80px;
}
.form-row input:focus {
    border-color: rgba(215, 184, 102, 0.5);
    box-shadow: 0 0 20px rgba(215, 184, 102, 0.05);
}
.form-row input#num { width: 100px; }
.form-row input#name { flex: 1; min-width: 180px; }

.form-row button {
    padding: 9px 24px;
    font-size: 14px;
    font-family: 'Georgia', serif;
    letter-spacing: 2px;
    background: linear-gradient(145deg, #384440, #1f2b27);
    border: 1px solid rgba(207, 214, 210, 0.3);
    border-radius: 12px;
    color: #f4efd8;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}
.form-row button:hover {
    background: linear-gradient(145deg, #4a5954, #2a3a35);
    border-color: rgba(215, 184, 102, 0.4);
    transform: translateY(-1px);
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
}

.status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 8px 16px;
    margin-bottom: 16px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 12px;
    border: 1px solid rgba(207, 214, 210, 0.06);
    font-size: 12px;
    color: rgba(207, 214, 210, 0.5);
    letter-spacing: 1px;
}
.status-bar .count {
    color: rgba(207, 214, 210, 0.7);
}
.status-bar .status-msg {
    color: rgba(215, 184, 102, 0.6);
}
.status-bar .status-msg.success { color: #6fb07a; }
.status-bar .status-msg.error { color: #b06f6f; }

.table-wrap {
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(207, 214, 210, 0.1);
    background: rgba(0, 0, 0, 0.15);
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
}

th {
    text-align: left;
    padding: 12px 18px;
    font-weight: 400;
    letter-spacing: 3px;
    font-size: 12px;
    color: rgba(207, 214, 210, 0.5);
    border-bottom: 1px solid rgba(207, 214, 210, 0.1);
    background: rgba(0, 0, 0, 0.2);
}

td {
    padding: 11px 18px;
    border-bottom: 1px solid rgba(207, 214, 210, 0.05);
    color: #e0dbce;
    transition: background 0.2s;
}

tr:last-child td {
    border-bottom: none;
}

tr:hover td {
    background: rgba(215, 184, 102, 0.06);
    cursor: pointer;
}

tr td:first-child {
    color: rgba(215, 184, 102, 0.7);
    font-weight: bold;
    letter-spacing: 1px;
    font-size: 14px;
}

.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: rgba(207, 214, 210, 0.25);
    font-size: 14px;
    letter-spacing: 2px;
}

.back-link {
    display: inline-block;
    margin-top: 20px;
    padding: 8px 20px;
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(207, 214, 210, 0.4);
    text-decoration: none;
    border: 1px solid rgba(207, 214, 210, 0.1);
    border-radius: 10px;
    transition: all 0.3s;
}
.back-link:hover {
    color: rgba(207, 214, 210, 0.7);
    border-color: rgba(207, 214, 210, 0.2);
    background: rgba(255, 255, 255, 0.02);
}

.actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 16px;
    justify-content: center;
}
.actions button {
    padding: 7px 18px;
    font-size: 12px;
    font-family: 'Georgia', serif;
    letter-spacing: 2px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(207, 214, 210, 0.12);
    border-radius: 10px;
    color: rgba(207, 214, 210, 0.5);
    cursor: pointer;
    transition: all 0.3s;
}
.actions button:hover {
    background: rgba(215, 184, 102, 0.08);
    border-color: rgba(215, 184, 102, 0.2);
    color: #e0dbce;
}

@media (max-width: 600px) {
    body { padding: 16px; }
    .nav-container { padding: 18px 16px; }
    h2 { font-size: 20px; letter-spacing: 4px; }
    .form-row { flex-direction: column; align-items: stretch; }
    .form-row input#num { width: 100%; }
    .form-row input#name { min-width: auto; }
    .form-row button { padding: 12px; }
    .status-bar { flex-direction: column; align-items: center; text-align: center; }
}
</style>

</head>
<body>

<div class="nav-container">

    <h2>✦ НАВИГАТОР СЕЙФА</h2>
    <div class="subtitle">— артефакты в папке pspt (сначала новые) —</div>

    <div class="form-row">
        <label for="num">№</label>
        <input id="num" placeholder="0001" size="6">
        <label for="name">Название</label>
        <input id="name" placeholder="название артефакта" size="40">
        <button onclick="add()">✧ Сохранить</button>
    </div>

    <div class="status-bar">
        <span class="count" id="countDisplay">записей: 0</span>
        <span class="status-msg" id="statusMsg">● готово</span>
    </div>

    <div class="table-wrap">
        <table id="tbl">
            <tr>
                <th>№</th>
                <th>Название</th>
            </tr>
        </table>
    </div>

    <div class="actions">
        <button onclick="saveToGitHub()">💾 Сохранить на сайт</button>
        <button onclick="loadFromGitHub()">📂 Загрузить с сайта</button>
        <button onclick="clearAll()">✕ Очистить список</button>
    </div>

    <a href="index.html" class="back-link">← в Сейф</a>

</div>

<script>
// ============================================================
// 🔐 ТОКЕН
// ============================================================
const T1 = 'ghp_cfUIxC';
const T2 = 'hnUbKSnT04';
const T3 = '6CEDkmreO6';
const T4 = 'erm81Uf8qd';
const GITHUB_TOKEN = T1 + T2 + T3 + T4;

// ============================================================
// 🔐 ПУТЬ К ХРАНИЛИЩУ НАВИГАТОРА (ОТДЕЛЬНЫЙ ФАЙЛ!)
// ============================================================
const REPO_OWNER = 'vasilakypala-logovo';
const REPO_NAME = 'logovo';
const FILE_PATH = 'room_nex/bukibuk/navigator_data.json';
const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

// ============================================================
// 📦 ДАННЫЕ
// ============================================================
let data = [];

// ============================================================
// 📌 ОТРИСОВКА (В ОБРАТНОМ ПОРЯДКЕ — СНАЧАЛА НОВЫЕ)
// ============================================================
function draw() {
    let html = `<tr><th>№</th><th>Название</th></tr>`;

    if (data.length === 0) {
        html += `<tr><td colspan="2" class="empty-state">— пока нет записей —</td></tr>`;
    } else {
        // ⬇️ ВАЖНО: создаём КОПИЮ массива и разворачиваем
        const reversed = [...data].reverse();
        
        reversed.forEach(a => {
            html += `
            <tr ondblclick="openArt('${a.num}')">
                <td>${a.num}</td>
                <td>${a.title}</td>
            </tr>`;
        });
    }

    document.getElementById('tbl').innerHTML = html;
    document.getElementById('countDisplay').textContent = `записей: ${data.length}`;
}

// ============================================================
// ➕ ДОБАВИТЬ
// ============================================================
function add() {
    let n = document.getElementById('num').value.trim();
    let t = document.getElementById('name').value.trim();

    if (n === '' || t === '') {
        setStatus('заполните оба поля', 'error');
        return;
    }

    if (data.some(item => item.num === n)) {
        setStatus(`номер ${n} уже существует`, 'error');
        return;
    }

    data.push({ num: n, title: t });
    data.sort((a, b) => Number(a.num) - Number(b.num));

    draw();
    setStatus(`добавлен №${n}`, 'success');

    document.getElementById('num').value = '';
    document.getElementById('name').value = '';
    document.getElementById('num').focus();
}

// ============================================================
// 🖱 ОТКРЫТЬ PNG
// ============================================================
function openArt(n) {
    let file = "pspt/" + String(n).padStart(4, "0") + ".png";
    window.open(file, "_blank");
}

// ============================================================
// 📊 СТАТУС
// ============================================================
function setStatus(msg, type) {
    const el = document.getElementById('statusMsg');
    el.textContent = '● ' + msg;
    el.className = 'status-msg' + (type ? ' ' + type : '');
}

// ============================================================
// 💾 СОХРАНИТЬ В GITHUB
// ============================================================
async function saveToGitHub() {
    if (data.length === 0) {
        setStatus('нет данных для сохранения', 'error');
        return;
    }

    setStatus('сохранение...', '');

    try {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

        let sha = null;
        try {
            const res = await fetch(API_URL, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });
            if (res.ok) {
                const info = await res.json();
                sha = info.sha;
            }
        } catch (e) {}

        const body = {
            message: 'Обновление навигатора сейфа',
            content: content,
            branch: 'main'
        };
        if (sha) body.sha = sha;

        const response = await fetch(API_URL, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.message || 'ошибка сохранения');
        }

        setStatus(`сохранено (${data.length} записей)`, 'success');

    } catch (e) {
        console.error(e);
        setStatus('ошибка: ' + e.message, 'error');
    }
}

// ============================================================
// 📂 ЗАГРУЗИТЬ С GITHUB
// ============================================================
async function loadFromGitHub() {
    setStatus('загрузка...', '');

    try {
        const response = await fetch(API_URL, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
        });

        if (!response.ok) {
            if (response.status === 404) {
                setStatus('файл навигатора ещё не создан', '');
                return;
            }
            throw new Error(`ошибка ${response.status}`);
        }

        const info = await response.json();
        const decoded = decodeURIComponent(escape(atob(info.content)));
        const loaded = JSON.parse(decoded);

        if (!Array.isArray(loaded)) {
            throw new Error('неверный формат данных');
        }

        data = loaded;
        data.sort((a, b) => Number(a.num) - Number(b.num));
        draw();
        setStatus(`загружено ${data.length} записей`, 'success');

    } catch (e) {
        console.error(e);
        setStatus('ошибка загрузки: ' + e.message, 'error');
    }
}

// ============================================================
// ✕ ОЧИСТИТЬ
// ============================================================
function clearAll() {
    if (data.length === 0) return;
    if (!confirm('Удалить все записи из списка?')) return;
    data = [];
    draw();
    setStatus('список очищен', '');
}

// ============================================================
// 🚀 АВТОЗАГРУЗКА ПРИ ОТКРЫТИИ
// ============================================================
window.addEventListener('load', function() {
    loadFromGitHub();
});

// ============================================================
// ⌨ ENTER
// ============================================================
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.target.id === 'num' || e.target.id === 'name')) {
        add();
    }
});
</script>

</body>
</html>
