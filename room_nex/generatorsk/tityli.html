<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>СОЗДАТЬ СКАЗКУ</title>

<style>

body{
    margin:0;
    background:black;
    overflow:hidden;
}

#scene{
    position:relative;
    width:1366px;
    height:768px;
    margin:auto;
    overflow:hidden;
}

#bg{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:block;
    z-index:0;
}

.portal{
    position:absolute;
    width:46px;
    height:46px;
    border:none;
    border-radius:50%;
    background:white;
    font-size:24px;
    font-weight:bold;
    color:black;
    cursor:pointer;
    animation:breathe 3s infinite ease-in-out;
    box-shadow:
    0 0 10px white,
    0 0 20px white,
    0 0 40px white,
    0 0 70px white;
    z-index:5;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
}

.p1{ left:110px; top:430px; }
.p2{ left:670px; top:120px; }
.p3{ left:1120px; top:335px; }

@keyframes breathe{
0%{ transform:scale(0.9); opacity:0.7; }
50%{ transform:scale(1.25); opacity:1; }
100%{ transform:scale(0.9); opacity:0.7; }
}

#topTitle{
    position:absolute;
    top:25px;
    width:100%;
    text-align:center;
    font-family:"Trebuchet MS", "Verdana", Arial, sans-serif;
    font-size:34px;
    font-weight:600;
    letter-spacing:4px;
    color:#1f4d2a;
    z-index:9999;
}

#topTitle .box{
    display:inline-block;
    padding:10px 22px;
    border:2px solid #1f4d2a;
    border-radius:10px;
    background:rgba(0, 0, 0, 0.35);
    box-shadow:
        0 0 10px rgba(0,255,120,0.15),
        inset 0 0 10px rgba(0,255,120,0.08);
}

#topTitle span{
    margin-left:14px;
    font-size:28px;
    color:#2e7d4a;
    font-weight:500;
}

#title{
    position:absolute;
    left:0;
    bottom:60px;
    width:100%;
    text-align:center;
    font-family:"Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size:66px;
    font-weight:200;
    letter-spacing:6px;
    color:#2a3f7a;
    z-index:9999;
    text-shadow:
        0 0 2px #ffffff,
        0 0 6px #ffffff,
        0 0 12px rgba(255,255,255,0.9),
        0 0 20px rgba(40,70,160,0.6),
        0 0 40px rgba(30,60,150,0.5),
        0 0 80px rgba(20,40,120,0.4);
    animation:neonPulse 1.8s infinite ease-in-out;
}

@keyframes neonPulse{
0%{
    filter: brightness(1);
    text-shadow:
        0 0 2px #ffffff,
        0 0 6px #ffffff,
        0 0 12px rgba(255,255,255,0.8),
        0 0 20px rgba(40,70,160,0.5),
        0 0 40px rgba(30,60,150,0.4);
}
50%{
    filter: brightness(1.25);
    text-shadow:
        0 0 2px #ffffff,
        0 0 8px #ffffff,
        0 0 16px rgba(255,255,255,0.9),
        0 0 30px rgba(80,120,220,0.7),
        0 0 60px rgba(50,90,200,0.6),
        0 0 120px rgba(30,60,160,0.4);
}
100%{
    filter: brightness(1);
    text-shadow:
        0 0 2px #ffffff,
        0 0 6px #ffffff,
        0 0 12px rgba(255,255,255,0.8),
        0 0 20px rgba(40,70,160,0.5),
        0 0 40px rgba(30,60,150,0.4);
}
}

/* Стилі для посилань-кнопок */
a.portal {
    text-decoration: none;
    color: black;
}

a.portal:hover {
    transform: scale(1.3);
    transition: transform 0.2s;
}

</style>

</head>

<body>

<div id="scene">

<img src="TITYLI.png" id="bg">

<div id="topTitle">
    <div class="box">
        СОЗДАТЬ <span>СКАЗКУ</span>
    </div>
</div>

<a href="SKAZKIKNIGAS07.html" class="portal p3">3</a>

<div id="title">
ГЕНЕРАТОР СКАЗОК НЕКСА
</div>

</div>

</body>
</html>
