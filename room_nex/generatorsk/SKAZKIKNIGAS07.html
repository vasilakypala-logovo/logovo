<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>генератор — BOOK ENGINE NEX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Georgia', 'Times New Roman', serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #cover-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a0e08;
            position: absolute;
            z-index: 10;
            transition: opacity 0.8s ease;
            cursor: pointer;
        }
        #cover-container.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #cover-content {
            text-align: center;
            color: #f0e6d8;
            max-width: 650px;
            padding: 40px;
            pointer-events: none;
        }
        #cover-image {
            max-width: 100%;
            max-height: 55vh;
            object-fit: contain;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
        }
        .editable-label {
            cursor: pointer;
            position: relative;
            display: inline-block;
            padding: 2px 12px;
            margin: 0 -12px;
            border-radius: 4px;
            transition: background 0.2s;
            pointer-events: auto;
        }
        .editable-label:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .editable-label::after {
            content: '✎';
            position: absolute;
            right: -22px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.6em;
            opacity: 0;
            transition: opacity 0.3s;
            color: #b8a48e;
        }
        .editable-label:hover::after {
            opacity: 0.6;
        }
        #cover-title {
            font-size: 2.8em;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #e8d5b8;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        #cover-subtitle {
            font-size: 1.3em;
            opacity: 0.7;
            margin-bottom: 5px;
            font-style: italic;
            color: #c4b09a;
        }
        #cover-author {
            font-size: 1.1em;
            opacity: 0.6;
            margin-bottom: 30px;
            color: #b8a48e;
        }
        .edit-hint {
            font-size: 0.7em;
            opacity: 0.4;
            margin-top: 12px;
            color: #b8a48e;
            font-style: italic;
            letter-spacing: 1px;
            pointer-events: auto;
        }
        #edit-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }
        #edit-modal.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #edit-modal .edit-box {
            background: #f5efe6;
            padding: 35px 45px;
            border-radius: 14px;
            max-width: 450px;
            width: 92%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        #edit-modal.visible .edit-box {
            transform: scale(1);
        }
        #edit-modal .edit-box h3 {
            color: #2c1810;
            margin-bottom: 18px;
            font-size: 1.3em;
            text-align: center;
            letter-spacing: 1px;
        }
        #edit-modal .edit-box label {
            display: block;
            color: #5a3f2e;
            font-size: 0.85em;
            margin-top: 14px;
            margin-bottom: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        #edit-modal .edit-box input {
            width: 100%;
            padding: 10px 14px;
            font-size: 1.05em;
            border: 2px solid #d5c8b8;
            border-radius: 6px;
            background: #fffdfa;
            color: #2c1810;
            font-family: 'Georgia', serif;
            transition: border-color 0.3s;
        }
        #edit-modal .edit-box input:focus {
            border-color: #8b6b4d;
            outline: none;
        }
        #edit-modal .edit-box .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 22px;
            justify-content: center;
        }
        #edit-modal .edit-box .btn-row button {
            padding: 10px 35px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.3s, transform 0.15s;
        }
        #edit-modal .edit-box .btn-row button:active {
            transform: scale(0.95);
        }
        #edit-modal .edit-box .btn-save {
            background: #8b6b4d;
            color: #fff;
        }
        #edit-modal .edit-box .btn-save:hover {
            background: #a88463;
        }
        #edit-modal .edit-box .btn-cancel {
            background: #d5c8b8;
            color: #2c1810;
        }
        #edit-modal .edit-box .btn-cancel:hover {
            background: #c4b09a;
        }
        #book-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2d1a0e;
            position: relative;
        }
        #pages-wrapper {
            width: 92%;
            max-width: 1100px;
            height: 88vh;
            background: #f5efe6;
            border-radius: 8px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            position: relative;
        }
        .page-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #f5efe6;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .page-iframe.active {
            opacity: 1;
            pointer-events: auto;
        }
        @keyframes flipIn {
            0% { transform: perspective(900px) rotateY(-12deg) scale(0.96); opacity: 0.4; }
            100% { transform: perspective(900px) rotateY(0deg) scale(1); opacity: 1; }
        }
        @keyframes flipOut {
            0% { transform: perspective(900px) rotateY(0deg) scale(1); opacity: 1; }
            100% { transform: perspective(900px) rotateY(12deg) scale(0.96); opacity: 0.4; }
        }
        .page-flip-in {
            animation: flipIn 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .page-flip-out {
            animation: flipOut 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        #navigation {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(26, 14, 8, 0.88);
            padding: 8px 16px;
            border-radius: 40px;
            backdrop-filter: blur(12px);
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
            justify-content: center;
        }
        #navigation button {
            background: transparent;
            border: none;
            color: #e8ddd0;
            font-size: 1.05em;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 6px;
            transition: background 0.2s, transform 0.15s;
            font-family: inherit;
            min-width: 32px;
            white-space: nowrap;
        }
        #navigation button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }
        #navigation button:active {
            transform: scale(0.92);
        }
        #navigation button.danger:hover {
            background: rgba(192, 57, 43, 0.3);
            color: #e74c3c;
        }
        #navigation button.success:hover {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }
        #page-indicator {
            color: #c4b09a;
            font-size: 0.8em;
            min-width: 60px;
            text-align: center;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .modal.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #f5efe6;
            padding: 40px 50px;
            border-radius: 14px;
            max-width: 480px;
            width: 92%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .modal-content h2 {
            text-align: center;
            margin-bottom: 22px;
            color: #2c1810;
            font-size: 1.5em;
            letter-spacing: 1px;
        }
        .modal-content ul {
            list-style: none;
            padding: 0;
        }
        .modal-content ul li {
            padding: 12px 18px;
            border-bottom: 1px solid #e0d5c8;
            cursor: pointer;
            transition: background 0.2s, padding-left 0.2s;
            color: #2c1810;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .modal-content ul li:hover {
            background: #e8ddd0;
            padding-left: 26px;
        }
        .modal-content ul li:last-child {
            border-bottom: none;
        }
        .modal-content ul li .page-num {
            font-size: 0.7em;
            color: #8b6b4d;
            background: #e8ddd0;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
            min-width: 28px;
            text-align: center;
        }
        .modal-content ul li .page-title {
            flex: 1;
        }
        .modal-content .close-btn {
            display: block;
            margin: 22px auto 0;
            padding: 10px 40px;
            background: #8b6b4d;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1em;
            transition: background 0.3s;
        }
        .modal-content .close-btn:hover {
            background: #a88463;
        }
        @media (max-width: 820px) {
            #pages-wrapper { width: 98%; height: 90vh; border-radius: 4px; }
            #cover-title { font-size: 2em; }
            #cover-subtitle { font-size: 1em; }
            #navigation { bottom: 12px; padding: 6px 10px; gap: 4px; }
            #navigation button { font-size: 0.9em; padding: 4px 7px; min-width: 26px; }
            #edit-modal .edit-box { padding: 25px 20px; }
        }
        @media (max-width: 480px) {
            #cover-title { font-size: 1.5em; }
            #cover-author { font-size: 0.9em; }
            .modal-content { padding: 25px 20px; }
            #page-indicator { min-width: 40px; font-size: 0.7em; }
            .edit-hint { font-size: 0.6em; }
            #navigation button { font-size: 0.8em; padding: 3px 5px; min-width: 22px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="cover-container">
            <div id="cover-content">
                <img id="cover-image" src="" alt="Обложка" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22500%22%3E%3Crect fill=%22%232c1810%22 width=%22400%22 height=%22500%22/%3E%3Ctext x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 fill=%22%23b8a48e%22 font-size=%2230%22 font-family=%22Georgia%22 dy=%22.3em%22%3E🦌%3C/text%3E%3C/svg%3E'">
                <h1 id="cover-title"><span class="editable-label" data-field="title">ГЕНЕРАТОР КНИГИ</span></h1>
                <p id="cover-subtitle"><span class="editable-label" data-field="subtitle">СБОРНИК СКАЗОК</span></p>
                <p id="cover-author"><span class="editable-label" data-field="author">ВАСИЛИЙ ЮДОВ</span></p>
                <div class="edit-hint">💡 Нажмите на название, автора или подзаголовок, чтобы изменить</div>
            </div>
        </div>
        <div id="edit-modal">
            <div class="edit-box">
                <h3 id="edit-title">Редактировать</h3>
                <label for="edit-input">Введите новое значение:</label>
                <input type="text" id="edit-input" autofocus>
                <div class="btn-row">
                    <button class="btn-cancel" id="edit-cancel">Отмена</button>
                    <button class="btn-save" id="edit-save">Сохранить</button>
                </div>
            </div>
        </div>
        <div id="book-container">
            <div id="pages-wrapper"></div>
        </div>
        <div id="navigation">
            <button id="prev-btn" title="Предыдущая">◀</button>
            <span id="page-indicator">0 / 0</span>
            <button id="next-btn" title="Следующая">▶</button>
            <button id="home-btn" title="На обложку">🏠</button>
            <button id="toc-btn" title="Оглавление">📑</button>
            <button id="refresh-toc-btn" title="Обновить оглавление">🔄</button>
            <button id="bookmark-btn" title="Закладка">☆</button>
            <button id="save-btn" title="Сохранить книгу">💾</button>
            <button id="add-page-btn" class="success" title="Добавить страницу">➕</button>
            <button id="delete-page-btn" class="danger" title="Удалить текущую страницу">🗑</button>
        </div>
        <div id="toc-modal" class="modal">
            <div class="modal-content">
                <h2>📑 Оглавление</h2>
                <ul id="toc-list"></ul>
                <button class="close-btn" id="close-toc-btn">Закрыть</button>
            </div>
        </div>
    </div>
    <script>
        const CONFIG = {
            title: "РЕДАКТОР КНИГИ",
            subtitle: "СБОРНИК СКАЗОК",
            author: "ВАСИЛИЙ ЮДОВ",
            bookDir: "skazki/",
            readOnly: false
        };

        // ============================================================
        // 📝 РУЧНОЕ ОГЛАВЛЕНИЕ — впишите сюда названия ваших страниц
        // ============================================================
        const TOC_TITLES = [
            '📖 Обложка',
            'НОВАЯ',
            'НОВАЯ',
            'НОВАЯ',
            'НОВАЯ'
,
            'НОВАЯ'
        ];
        // ============================================================

        class BookEngine {
            constructor() {
                this.config = CONFIG;
                this.totalPages = 0;
                this.currentIndex = 0;
                this.bookmark = null;
                this.isTransitioning = false;
                this.coverVisible = true;
                this.iframes = {};
                this.pageList = [];
                this.readOnly = this.config.readOnly || false;
                this.els = {
                    cover: document.getElementById('cover-container'),
                    coverImage: document.getElementById('cover-image'),
                    coverTitle: document.getElementById('cover-title'),
                    coverSubtitle: document.getElementById('cover-subtitle'),
                    coverAuthor: document.getElementById('cover-author'),
                    wrapper: document.getElementById('pages-wrapper'),
                    indicator: document.getElementById('page-indicator'),
                    prev: document.getElementById('prev-btn'),
                    next: document.getElementById('next-btn'),
                    home: document.getElementById('home-btn'),
                    toc: document.getElementById('toc-btn'),
                    refreshToc: document.getElementById('refresh-toc-btn'),
                    bookmark: document.getElementById('bookmark-btn'),
                    save: document.getElementById('save-btn'),
                    addPage: document.getElementById('add-page-btn'),
                    deletePage: document.getElementById('delete-page-btn'),
                    tocModal: document.getElementById('toc-modal'),
                    tocList: document.getElementById('toc-list'),
                    closeToc: document.getElementById('close-toc-btn'),
                    editModal: document.getElementById('edit-modal'),
                    editInput: document.getElementById('edit-input'),
                    editTitle: document.getElementById('edit-title'),
                    editSave: document.getElementById('edit-save'),
                    editCancel: document.getElementById('edit-cancel')
                };
                this.init();
            }
            init() {
                this.loadBookmark();
                this.setupCover();
                this.setupNav();
                this.setupKeyboard();
                this.setupTouch();
                this.setupTOC();
                this.setupEditModal();
                this.setupSave();
                this.setupPageManagement();
                this.loadMeta();
                this.detectPages();
                if (this.readOnly) {
                    this.applyReadOnly();
                }
            }
            detectPages() {
                this.pageList = ['cover'];
                this.iframes = {};
                this.els.wrapper.innerHTML = '';
                this.loadPageWithCheck(1);
            }
            
            loadPageWithCheck(index) {
                if (index > 10) {
                    this.finishDetection();
                    return;
                }
                
                const pageName = 'page' + String(index).padStart(2, '0');
                const iframe = document.createElement('iframe');
                iframe.className = 'page-iframe';
                iframe.dataset.page = pageName;
                iframe.src = this.config.bookDir + pageName + '.html';
                iframe.style.display = 'none';
                
                let loaded = false;
                let timeoutId = null;
                
                const onLoad = () => {
                    if (loaded) return;
                    loaded = true;
                    clearTimeout(timeoutId);
                    
                    this.pageList.push(pageName);
                    this.iframes[pageName] = iframe;
                    this.els.wrapper.appendChild(iframe);
                    iframe.style.display = '';
                    if (this.pageList.length - 1 === this.currentIndex) {
                        this.activateIframe(pageName);
                    }
                    this.loadPageWithCheck(index + 1);
                };
                
                const onError = () => {
                    if (loaded) return;
                    loaded = true;
                    clearTimeout(timeoutId);
                    iframe.remove();
                    this.finishDetection();
                };
                
                iframe.addEventListener('load', onLoad);
                iframe.addEventListener('error', onError);
                
                timeoutId = setTimeout(() => {
                    if (!loaded) {
                        loaded = true;
                        iframe.remove();
                        this.finishDetection();
                    }
                }, 2000);
                
                this.els.wrapper.appendChild(iframe);
            }
            
            finishDetection() {
                const iframes = this.els.wrapper.querySelectorAll('.page-iframe');
                const validPages = new Set(this.pageList);
                iframes.forEach(iframe => {
                    const page = iframe.dataset.page;
                    if (!validPages.has(page) || !this.iframes[page]) {
                        iframe.remove();
                    }
                });
                
                this.totalPages = this.pageList.length;
                if (this.totalPages < 1) {
                    this.createNewPage(1);
                }
                
                if (this.currentIndex >= this.totalPages) {
                    this.currentIndex = this.totalPages - 1;
                }
                
                this.updateNav();
                this.updateTOC();
                this.els.indicator.textContent = this.currentIndex + ' / ' + (this.totalPages - 1);
                
                if (this.bookmark !== null && this.bookmark > 0 && this.bookmark < this.totalPages) {
                    this.openBook();
                    this.goTo(this.bookmark);
                }
            }
            
            getPageTitle(index) {
                if (TOC_TITLES && TOC_TITLES[index]) {
                    return TOC_TITLES[index];
                }
                return 'Страница ' + index;
            }
            
            createNewPage(index) {
                const pageName = 'page' + String(index).padStart(2, '0');
                const iframe = document.createElement('iframe');
                iframe.className = 'page-iframe';
                iframe.dataset.page = pageName;
                iframe.src = this.config.bookDir + pageName + '.html';
                iframe.style.display = '';
                this.els.wrapper.appendChild(iframe);
                this.iframes[pageName] = iframe;
                this.pageList.push(pageName);
                this.totalPages = this.pageList.length;
                
                const title = 'Страница ' + index;
                
                iframe.onload = () => {
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        if (!doc.body || doc.body.innerHTML.trim() === '') {
                            doc.write(`
                                <!DOCTYPE html>
                                <html>
                                <head><meta charset="UTF-8"><title>${title}</title></head>
                                <body style="font-family:Georgia;padding:40px;line-height:1.8;">
                                    <h1 style="text-align:center;color:#2c1810;">${title}</h1>
                                    <p style="color:#5a3f2e;">Напишите здесь свой текст...</p>
                                </body>
                                </html>
                            `);
                            doc.close();
                        }
                    } catch(e) {}
                };
                iframe.src = this.config.bookDir + pageName + '.html';
                
                this.goTo(this.totalPages - 1);
                this.updateNav();
                this.updateTOC();
                this.els.indicator.textContent = this.currentIndex + ' / ' + (this.totalPages - 1);
                return pageName;
            }
            
            applyReadOnly() {
                document.querySelectorAll('.editable-label').forEach(el => {
                    el.className = 'fixed-label';
                });
                var hint = document.querySelector('.edit-hint');
                if (hint) hint.style.display = 'none';
                if (this.els.save) this.els.save.style.display = 'none';
                if (this.els.editModal) this.els.editModal.style.display = 'none';
                if (this.els.addPage) this.els.addPage.style.display = 'none';
                if (this.els.deletePage) this.els.deletePage.style.display = 'none';
            }
            setupCover() {
                this.updateCoverDisplay();
                var coverPath = this.config.bookDir + 'cover.jpg';
                this.els.coverImage.src = coverPath;
                this.els.coverImage.alt = this.config.title;
                this.els.cover.addEventListener('click', (e) => {
                    if (e.target.closest('.editable-label')) return;
                    if (e.target.closest('.edit-hint')) return;
                    this.openBook();
                });
                document.querySelectorAll('.editable-label').forEach(label => {
                    label.addEventListener('click', (e) => {
                        e.stopPropagation();
                        var field = label.dataset.field;
                        var currentValue = label.textContent;
                        this.openEditModal(field, currentValue);
                    });
                });
            }
            updateCoverDisplay() {
                this.els.coverTitle.querySelector('.editable-label').textContent = this.config.title;
                this.els.coverSubtitle.querySelector('.editable-label').textContent = this.config.subtitle;
                this.els.coverAuthor.querySelector('.editable-label').textContent = this.config.author;
                document.title = this.config.title + ' — BOOK ENGINE NEX';
                this.els.coverImage.alt = this.config.title;
            }
            openBook() {
                if (!this.coverVisible) return;
                this.coverVisible = false;
                this.els.cover.classList.add('hidden');
                this.loadPage(0);
                this.updateNav();
            }
            loadPage(index) {
                if (this.isTransitioning) return;
                if (index < 0 || index >= this.totalPages) return;
                this.isTransitioning = true;
                this.currentIndex = index;
                var pageName = this.pageList[index];
                if (index === 0 && pageName === 'cover') {
                    this.coverVisible = true;
                    this.els.cover.classList.remove('hidden');
                    this.isTransitioning = false;
                    this.updateNav();
                    return;
                }
                if (this.coverVisible) {
                    this.coverVisible = false;
                    this.els.cover.classList.add('hidden');
                }
                this.activateIframe(pageName);
                this.saveBookmark(index);
                this.isTransitioning = false;
                this.updateNav();
            }
            activateIframe(pageName) {
                document.querySelectorAll('.page-iframe').forEach(el => {
                    el.classList.remove('active', 'page-flip-in');
                });
                var target = this.iframes[pageName];
                if (target) {
                    target.style.display = '';
                    target.classList.add('active', 'page-flip-in');
                    setTimeout(() => target.classList.remove('page-flip-in'), 500);
                    this.updateTOC();
                }
            }
            next() {
                if (this.currentIndex < this.totalPages - 1) this.loadPage(this.currentIndex + 1);
            }
            prev() {
                if (this.currentIndex > 0) this.loadPage(this.currentIndex - 1);
            }
            goTo(index) {
                if (index >= 0 && index < this.totalPages) this.loadPage(index);
            }
            goHome() {
                this.coverVisible = true;
                this.els.cover.classList.remove('hidden');
                this.currentIndex = 0;
                this.updateNav();
            }
            updateNav() {
                var total = this.totalPages - 1;
                this.els.indicator.textContent = this.currentIndex + ' / ' + total;
                this.els.prev.style.opacity = this.currentIndex > 0 ? '1' : '0.3';
                this.els.next.style.opacity = this.currentIndex < total ? '1' : '0.3';
                var marked = this.bookmark === this.currentIndex;
                this.els.bookmark.textContent = marked ? '⭐' : '☆';
                if (this.els.deletePage) {
                    this.els.deletePage.style.opacity = this.totalPages > 2 ? '1' : '0.3';
                }
            }
            setupNav() {
                this.els.prev.addEventListener('click', () => this.prev());
                this.els.next.addEventListener('click', () => this.next());
                this.els.home.addEventListener('click', () => this.goHome());
                this.els.bookmark.addEventListener('click', () => this.toggleBookmark());
                
                if (this.els.refreshToc) {
                    this.els.refreshToc.addEventListener('click', () => {
                        this.showTOC();
                    });
                }
            }
            setupKeyboard() {
                document.addEventListener('keydown', (e) => {
                    if (this.els.editModal.classList.contains('visible')) {
                        if (e.key === 'Escape') this.closeEditModal();
                        if (e.key === 'Enter') this.saveEdit();
                        return;
                    }
                    if (this.els.tocModal.classList.contains('visible')) {
                        if (e.key === 'Escape') this.closeTOC();
                        return;
                    }
                    switch (e.key) {
                        case 'ArrowRight': case 'ArrowDown': case ' ':
                            e.preventDefault();
                            this.next();
                            break;
                        case 'ArrowLeft': case 'ArrowUp':
                            e.preventDefault();
                            this.prev();
                            break;
                        case 'Home':
                            e.preventDefault();
                            this.goHome();
                            break;
                        case 'Escape':
                            if (!this.els.cover.classList.contains('hidden')) this.openBook();
                            break;
                    }
                });
            }
            setupTouch() {
                var sx = 0, sy = 0, swipe = false;
                this.els.wrapper.addEventListener('touchstart', (e) => {
                    var t = e.touches[0];
                    sx = t.clientX;
                    sy = t.clientY;
                    swipe = true;
                }, { passive: true });
                this.els.wrapper.addEventListener('touchmove', (e) => {
                    if (!swipe) return;
                    e.preventDefault();
                }, { passive: false });
                this.els.wrapper.addEventListener('touchend', (e) => {
                    if (!swipe) return;
                    swipe = false;
                    var t = e.changedTouches[0];
                    var dx = t.clientX - sx;
                    var dy = t.clientY - sy;
                    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                        if (dx < 0) this.next();
                        else this.prev();
                    }
                }, { passive: true });
            }
            setupTOC() {
                this.els.toc.addEventListener('click', () => this.showTOC());
                this.els.closeToc.addEventListener('click', () => this.closeTOC());
                this.els.tocModal.addEventListener('click', (e) => {
                    if (e.target === this.els.tocModal) this.closeTOC();
                });
            }
            updateTOC() {
                this.tocDirty = true;
            }
            showTOC() {
                var list = this.els.tocList;
                list.innerHTML = '';
                
                this.pageList.forEach((page, i) => {
                    var li = document.createElement('li');
                    var numSpan = document.createElement('span');
                    numSpan.className = 'page-num';
                    numSpan.textContent = i;
                    
                    var titleSpan = document.createElement('span');
                    titleSpan.className = 'page-title';
                    titleSpan.textContent = this.getPageTitle(i);
                    
                    li.appendChild(numSpan);
                    li.appendChild(titleSpan);
                    li.addEventListener('click', () => {
                        this.closeTOC();
                        this.goTo(i);
                    });
                    list.appendChild(li);
                });
                
                this.els.tocModal.classList.add('visible');
                this.tocDirty = false;
            }
            closeTOC() {
                this.els.tocModal.classList.remove('visible');
            }
            toggleBookmark() {
                if (this.bookmark === this.currentIndex) {
                    this.bookmark = null;
                } else {
                    this.bookmark = this.currentIndex;
                }
                this.saveBookmark(this.bookmark);
                this.updateNav();
            }
            saveBookmark(index) {
                if (index === null || index === undefined) {
                    localStorage.removeItem('bookmark_svist');
                    this.bookmark = null;
                } else {
                    localStorage.setItem('bookmark_svist', index.toString());
                    this.bookmark = index;
                }
            }
            loadBookmark() {
                var saved = localStorage.getItem('bookmark_svist');
                if (saved !== null) this.bookmark = parseInt(saved);
            }
            setupEditModal() {
                this.els.editSave.addEventListener('click', () => this.saveEdit());
                this.els.editCancel.addEventListener('click', () => this.closeEditModal());
                this.els.editModal.addEventListener('click', (e) => {
                    if (e.target === this.els.editModal) this.closeEditModal();
                });
                this.els.editInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.saveEdit();
                    if (e.key === 'Escape') this.closeEditModal();
                });
            }
            openEditModal(field, currentValue) {
                this.editField = field;
                this.els.editInput.value = currentValue;
                var labels = { title: 'Редактировать название книги', subtitle: 'Редактировать подзаголовок', author: 'Редактировать автора' };
                this.els.editTitle.textContent = labels[field] || 'Редактировать';
                this.els.editModal.classList.add('visible');
                setTimeout(() => {
                    this.els.editInput.focus();
                    this.els.editInput.select();
                }, 100);
            }
            closeEditModal() {
                this.els.editModal.classList.remove('visible');
                this.editField = null;
            }
            saveEdit() {
                if (!this.editField) return;
                var newValue = this.els.editInput.value.trim();
                if (!newValue) { this.closeEditModal(); return; }
                if (this.editField === 'title') this.config.title = newValue;
                else if (this.editField === 'subtitle') this.config.subtitle = newValue;
                else if (this.editField === 'author') this.config.author = newValue;
                this.updateCoverDisplay();
                try { localStorage.setItem('book_meta_' + this.editField, newValue); } catch(e) {}
                this.closeEditModal();
            }
            loadMeta() {
                try {
                    var title = localStorage.getItem('book_meta_title');
                    var subtitle = localStorage.getItem('book_meta_subtitle');
                    var author = localStorage.getItem('book_meta_author');
                    if (title) { this.config.title = title; document.title = title + ' — BOOK ENGINE NEX'; }
                    if (subtitle) this.config.subtitle = subtitle;
                    if (author) this.config.author = author;
                    this.updateCoverDisplay();
                } catch(e) {}
            }
            setupSave() {
                this.els.save.addEventListener('click', () => this.saveBook());
            }
            saveBook() {
                var html = document.documentElement.outerHTML;
                
                html = html.replace(/(title:\s*)"[^"]*"/, '$1"' + this.escapeJS(this.config.title) + '"');
                html = html.replace(/(subtitle:\s*)"[^"]*"/, '$1"' + this.escapeJS(this.config.subtitle) + '"');
                html = html.replace(/(author:\s*)"[^"]*"/, '$1"' + this.escapeJS(this.config.author) + '"');
                html = html.replace(/<title>.*?<\/title>/, '<title>' + this.escapeHTML(this.config.title) + ' — BOOK ENGINE NEX</title>');
                html = html.replace(/(<span class="editable-label" data-field="title">).*?(<\/span>)/, '$1' + this.escapeHTML(this.config.title) + '$2');
                html = html.replace(/(<span class="editable-label" data-field="subtitle">).*?(<\/span>)/, '$1' + this.escapeHTML(this.config.subtitle) + '$2');
                html = html.replace(/(<span class="editable-label" data-field="author">).*?(<\/span>)/, '$1' + this.escapeHTML(this.config.author) + '$2');
                html = html.replace(/(alt=")[^"]*(")/, '$1' + this.escapeHTML(this.config.title) + '$2');
                
                html = html.replace(/(readOnly:\s*)false/, '$1true');
                
                var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                var fileName = this.config.title.replace(/[<>:"/\\|?*]/g, '_').trim() || 'book';
                a.download = fileName + '.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            escapeJS(str) {
                return str.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
            }
            escapeHTML(str) {
                var div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            
            setupPageManagement() {
                this.els.addPage.addEventListener('click', () => this.addNewPage());
                this.els.deletePage.addEventListener('click', () => this.deleteCurrentPage());
            }
            
            addNewPage() {
                let maxNum = 0;
                for (const page of this.pageList) {
                    if (page.startsWith('page')) {
                        const num = parseInt(page.replace('page', ''));
                        if (num > maxNum) maxNum = num;
                    }
                }
                const newNum = maxNum + 1;
                const pageName = 'page' + String(newNum).padStart(2, '0');
                
                const iframe = document.createElement('iframe');
                iframe.className = 'page-iframe';
                iframe.dataset.page = pageName;
                iframe.src = this.config.bookDir + pageName + '.html';
                iframe.style.display = '';
                this.els.wrapper.appendChild(iframe);
                this.iframes[pageName] = iframe;
                this.pageList.push(pageName);
                this.totalPages = this.pageList.length;
                
                const title = 'Страница ' + newNum;
                
                iframe.onload = () => {
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        if (!doc.body || doc.body.innerHTML.trim() === '') {
                            doc.write(`
                                <!DOCTYPE html>
                                <html>
                                <head><meta charset="UTF-8"><title>${title}</title></head>
                                <body style="font-family:Georgia;padding:40px;line-height:1.8;">
                                    <h1 style="text-align:center;color:#2c1810;">${title}</h1>
                                    <p style="color:#5a3f2e;">Напишите здесь свой текст...</p>
                                </body>
                                </html>
                            `);
                            doc.close();
                        }
                    } catch(e) {}
                };
                iframe.src = this.config.bookDir + pageName + '.html';
                
                this.goTo(this.totalPages - 1);
                this.updateNav();
                this.updateTOC();
                this.els.indicator.textContent = this.currentIndex + ' / ' + (this.totalPages - 1);
            }
            
            deleteCurrentPage() {
                if (this.totalPages <= 2) {
                    alert('❌ Нельзя удалить последнюю страницу. Должно оставаться минимум 2 страницы.');
                    return;
                }
                if (this.currentIndex === 0) {
                    alert('❌ Нельзя удалить обложку.');
                    return;
                }
                if (!confirm(`🗑 Удалить "${this.getPageTitle(this.currentIndex)}"?`)) return;
                
                const pageName = this.pageList[this.currentIndex];
                const iframe = this.iframes[pageName];
                if (iframe) {
                    iframe.remove();
                    delete this.iframes[pageName];
                }
                
                this.pageList.splice(this.currentIndex, 1);
                this.totalPages = this.pageList.length;
                
                if (this.currentIndex >= this.totalPages) {
                    this.currentIndex = this.totalPages - 1;
                }
                
                this.loadPage(this.currentIndex);
                this.updateNav();
                this.updateTOC();
                this.els.indicator.textContent = this.currentIndex + ' / ' + (this.totalPages - 1);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            window.book = new BookEngine();
        });
    </script>
</body>
