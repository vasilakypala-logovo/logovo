<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Полка Орденов НЕКСА</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020503;
  font-family: Georgia, "Times New Roman", serif;
  color:#f5e9c8;
}
body{
  background:
    radial-gradient(circle at center, rgba(42,100,53,.28), transparent 55%),
    linear-gradient(180deg,#030604,#020302 70%,#000);
}
.stage{
  position:relative;
  width:100vw;
  height:100vh;
  background-image:url("vitrina_bg.png");
  background-size:100% 100%;
  background-position:center;
  background-repeat:no-repeat;
}
.velvetField{
  position:absolute;
  left:6.5%;
  right:6.5%;
  top:11.5%;
  bottom:15.5%;
  overflow:hidden;
}
.ordersGrid{
  position:absolute;
  inset:0;
  padding:24px 34px;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(92px, 92px));
  grid-auto-rows:116px;
  gap:14px 18px;
  align-content:start;
}
.orderItem{
  position:relative;
  width:92px;
  height:108px;
  animation:appear .55s ease-out both;
  filter:drop-shadow(0 9px 10px rgba(0,0,0,.65));
}
.orderItem img{
  width:86px;
  height:86px;
  object-fit:contain;
  display:block;
  margin:0 auto;
}
.orderNum{
  position:absolute;
  right:2px;
  bottom:2px;
  min-width:26px;
  height:22px;
  padding:1px 6px;
  border-radius:10px;
  background:rgba(6,8,4,.78);
  border:1px solid rgba(239,211,139,.72);
  color:#f6df9b;
  font:bold 15px/20px Georgia, serif;
  text-align:center;
  box-shadow:0 0 10px rgba(255,216,118,.25);
}
.typeMark{
  position:absolute;
  left:2px;
  bottom:2px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:rgba(0,0,0,.62);
  border:1px solid rgba(255,255,255,.25);
  color:#fff6cf;
  font:bold 12px/20px Georgia, serif;
  text-align:center;
}
.controls{
  position:absolute;
  left:8%;
  right:8%;
  bottom:2.6%;
  height:9%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  pointer-events:none;
}
.ordenBtn{
  pointer-events:auto;
  width:30%;
  height:68%;
  min-height:44px;
  border:1px solid rgba(220,195,133,.7);
  border-radius:12px;
  color:#f8e6b2;
  font:bold clamp(16px,2vw,28px)/1 Georgia, serif;
  letter-spacing:.04em;
  text-shadow:0 2px 2px #000,0 0 12px rgba(255,230,160,.25);
  cursor:pointer;
  box-shadow:
    inset 0 0 18px rgba(255,255,255,.08),
    0 7px 20px rgba(0,0,0,.5);
  transition:transform .15s, filter .15s, box-shadow .15s;
}
.ordenBtn:hover{
  transform:translateY(-2px);
  filter:brightness(1.18);
  box-shadow:
    inset 0 0 22px rgba(255,255,255,.1),
    0 0 24px rgba(255,225,150,.16),
    0 9px 24px rgba(0,0,0,.58);
}
.ordenBtn:active{transform:translateY(1px)}
.btn-strazh{background:linear-gradient(180deg,#263421,#11170f 45%,#2d3b25)}
.btn-blik{background:linear-gradient(180deg,#612016,#210807 45%,#6e241a)}
.btn-svet{background:linear-gradient(180deg,#143b3f,#071416 45%,#16464a)}
.topTitle{
  position:absolute;
  top:3.2%;
  left:0;
  width:100%;
  text-align:center;
  color:rgba(247,230,178,.75);
  font:normal clamp(16px,2vw,30px) Georgia, serif;
  letter-spacing:.16em;
  text-shadow:0 2px 7px #000;
  pointer-events:none;
}
.counterPanel{
  position:absolute;
  top:7.7%;
  right:7.7%;
  color:rgba(250,232,179,.88);
  background:rgba(0,0,0,.26);
  border:1px solid rgba(227,202,139,.22);
  border-radius:12px;
  padding:7px 14px;
  font-size:14px;
  letter-spacing:.05em;
  backdrop-filter:blur(2px);
}
.confirmLayer{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.42);
  z-index:20;
}
.confirmBox{
  width:min(560px,88vw);
  border:2px solid rgba(237,214,147,.75);
  border-radius:22px;
  background:
    radial-gradient(circle at top,rgba(84,116,70,.35),transparent 45%),
    linear-gradient(180deg,rgba(24,29,22,.96),rgba(7,8,6,.98));
  box-shadow:0 20px 70px rgba(0,0,0,.75), inset 0 0 26px rgba(255,255,255,.06);
  padding:28px 30px;
  text-align:center;
}
.confirmTitle{
  font-size:28px;
  color:#f8e5ad;
  margin-bottom:10px;
}
.confirmText{
  color:#d7c99f;
  font-size:17px;
  line-height:1.45;
  margin-bottom:22px;
}
.confirmBtn{
  width:100%;
  padding:16px 12px;
  border-radius:14px;
  border:1px solid rgba(255,225,150,.8);
  background:linear-gradient(180deg,#5c2a18,#230d08);
  color:#ffe5a0;
  font:bold 28px Georgia, serif;
  letter-spacing:.08em;
  cursor:pointer;
  text-shadow:0 2px 2px #000;
}
.cancelBtn{
  margin-top:14px;
  background:transparent;
  border:0;
  color:#b9ad8b;
  font:15px Georgia, serif;
  cursor:pointer;
}
.flash{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:15;
  opacity:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,239,178,.22) 45%,transparent 70%);
  transform:translateX(-100%);
}
.flash.run{animation:flashRun .95s ease-out}
@keyframes flashRun{
  0%{opacity:0;transform:translateX(-100%)}
  25%{opacity:1}
  100%{opacity:0;transform:translateX(100%)}
}
@keyframes appear{
  from{opacity:0;transform:scale(.45) rotate(-8deg)}
  to{opacity:1;transform:scale(1) rotate(0)}
}
@media(max-width:800px){
  .ordersGrid{
    padding:18px 24px;
    grid-template-columns:repeat(auto-fill, minmax(72px,72px));
    grid-auto-rows:94px;
    gap:10px 12px;
  }
  .orderItem{width:72px;height:90px}
  .orderItem img{width:68px;height:68px}
  .controls{gap:8px;left:5%;right:5%;bottom:2%}
  .ordenBtn{font-size:13px}
}
</style>
</head>
<body>
<div class="stage">
  <div class="topTitle">ПОЛКА ОРДЕНОВ НЕКСА</div>

  <div class="counterPanel" id="counterPanel">Всего: 0</div>

  <div class="velvetField">
    <div class="ordersGrid" id="ordersGrid"></div>
  </div>

  <div class="controls">
    <button class="ordenBtn btn-strazh" onclick="startAward('strazh')">СТРАЖ</button>
    <button class="ordenBtn btn-blik" onclick="startAward('blik')">БЛИК</button>
    <button class="ordenBtn btn-svet" onclick="startAward('svet')">УДЕРЖАННЫЙ СВЕТ</button>
  </div>

  <div class="flash" id="flash"></div>

  <div class="confirmLayer" id="confirmLayer">
    <div class="confirmBox">
      <div class="confirmTitle" id="confirmTitle">Подтверждение</div>
      <div class="confirmText" id="confirmText"></div>
      <button class="confirmBtn" id="confirmBtn" onclick="confirmAward()">ЗАСЛУЖЕНО</button>
      <button class="cancelBtn" onclick="cancelAward()">Отмена</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "NEX_ORDEN_VITRINA_v1";

const TYPES = {
  strazh: {
    title:"ОБИТЕЛЬ",
    img:"orden_strazh.png",
    mark:"С",
    meaning:"Орден чистого намерения — за идеи сохранения мира, узелка, тумана, человечества."
  },
  blik: {
    title:"САД",
    img:"orden_blik.png",
    mark:"Б",
    meaning:"Орден первого удара — за мгновенное попадание образа."
  },
  svet: {
    title:"КУРИЛКА",
    img:"orden_svet.png",
    mark:"У",
    meaning:"Художественный орден — за потрясающую цветовую гамму или восхитительную композицию."
  }
};

let orders = loadOrders();
let pendingType = null;
let confirmStep = 0;

function loadOrders(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }catch(e){
    return [];
  }
}

function saveOrders(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
}

function render(){
  const grid = document.getElementById("ordersGrid");
  grid.innerHTML = "";

  orders.forEach((item, index)=>{
    const type = TYPES[item.type] || TYPES.blik;
    const div = document.createElement("div");
    div.className = "orderItem";
    div.title = (index+1) + ". " + type.title + "\n" + type.meaning;

    const img = document.createElement("img");
    img.src = type.img;
    img.onerror = function(){
      this.style.display = "none";
      div.style.border = "1px solid rgba(255,220,140,.45)";
      div.style.borderRadius = "50%";
      div.style.background = "radial-gradient(circle,#b27b25,#301008)";
    };

    const mark = document.createElement("div");
    mark.className = "typeMark";
    mark.textContent = type.mark;

    const num = document.createElement("div");
    num.className = "orderNum";
    num.textContent = index + 1;

    div.appendChild(img);
    div.appendChild(mark);
    div.appendChild(num);
    grid.appendChild(div);
  });

  document.getElementById("counterPanel").textContent = "Всего: " + orders.length;
}

function startAward(type){
  pendingType = type;
  confirmStep = 1;
  showConfirm();
}

function showConfirm(){
  const type = TYPES[pendingType];
  document.getElementById("confirmLayer").style.display = "flex";
  document.getElementById("confirmTitle").textContent = "Орден «" + type.title + "»";
  document.getElementById("confirmText").innerHTML =
    type.meaning + "<br><br>Подтверждение " + confirmStep + " из 3.";
}

function confirmAward(){
  if(!pendingType) return;

  if(confirmStep < 1){
    confirmStep++;
    showConfirm();
    return;
  }

  orders.push({
    type: pendingType,
    time: new Date().toISOString()
  });

  saveOrders();
  pendingType = null;
  confirmStep = 0;
  document.getElementById("confirmLayer").style.display = "none";
  render();

  const flash = document.getElementById("flash");
  flash.classList.remove("run");
  void flash.offsetWidth;
  flash.classList.add("run");
}

function cancelAward(){
  pendingType = null;
  confirmStep = 0;
  document.getElementById("confirmLayer").style.display = "none";
}

render();
</script>
</body>
</html>
