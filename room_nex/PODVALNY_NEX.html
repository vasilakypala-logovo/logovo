<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Подвальный Некс</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Georgia,"Times New Roman",serif;
}

.scene{
position:relative;
width:100vw;
height:100vh;
background:url("bg.png") center center/cover no-repeat;
}

.ask-btn{
position:absolute;
left:50%;
bottom:5%;
transform:translateX(-50%);
padding:18px 48px;
min-width:430px;
border-radius:14px;
border:2px solid rgba(210,170,92,0.95);
background:linear-gradient(180deg, rgba(20,55,84,0.96), rgba(5,20,35,0.96));
color:#f3d79c;
font-size:30px;
cursor:pointer;
box-shadow:0 0 25px rgba(0,0,0,0.9);
text-shadow:0 2px 2px #000;
}

.ask-btn:hover{
filter:brightness(1.15);
}

.dialog{
display:none;
position:absolute;
left:50%;
bottom:18%;
transform:translateX(-50%);
width:560px;
padding:22px;
border-radius:16px;
border:2px solid rgba(210,170,92,0.9);
background:rgba(8,6,5,0.88);
box-shadow:0 0 35px rgba(0,0,0,0.95);
}

.dialog textarea{
width:100%;
height:120px;
resize:none;
box-sizing:border-box;
padding:12px;
font-size:21px;
border-radius:10px;
outline:none;
background:rgba(18,15,12,0.95);
border:1px solid rgba(220,180,100,0.6);
color:#f4dfb4;
font-family:Georgia,"Times New Roman",serif;
}

.buttons{
margin-top:14px;
display:flex;
justify-content:flex-end;
gap:10px;
}

.buttons button{
padding:10px 24px;
font-size:18px;
cursor:pointer;
border-radius:10px;
border:1px solid rgba(220,180,100,0.7);
background:linear-gradient(180deg,#173954,#071928);
color:#f4d89a;
}

.answer{
display:none;
position:absolute;
left:50%;
top:5%;
transform:translateX(-50%);
width:74%;
padding:24px 28px;
border-radius:18px;
border:2px solid rgba(210,170,92,0.9);
background:rgba(8,6,5,0.88);
color:#f3ddb0;
font-size:26px;
line-height:1.4;
box-shadow:0 0 40px rgba(0,0,0,0.95);
text-shadow:0 2px 2px #000;
}

@media(max-width:800px){

.ask-btn{
min-width:260px;
font-size:22px;
padding:14px 24px;
}

.dialog{
width:84%;
}

.answer{
width:84%;
font-size:20px;
}

}


#peaceZone{
position:absolute;
right:5.5%;
bottom:8%;
width:210px;
height:165px;
cursor:pointer;
z-index:8;
}

#peaceZone::after{
content:"ЗА СОХРАНЕНИЕ ДЫХАНИЯ";
position:absolute;
left:50%;
top:-22px;
transform:translateX(-50%);
white-space:nowrap;
font-size:12px;
letter-spacing:.12em;
color:rgba(245,218,160,.0);
text-shadow:0 0 10px rgba(255,210,120,0);
transition:.45s;
pointer-events:none;
}

#peaceZone:hover::after{
color:rgba(245,218,160,.86);
text-shadow:0 0 12px rgba(255,210,120,.55);
}

#peaceZone:hover{
box-shadow:0 0 32px rgba(120,190,255,.18);
border-radius:22px;
}
#peaceMedal_JIPPIE_VASILIY{
display:none;
position:fixed;
inset:0;
z-index:999;
background:rgba(0,0,0,.48);
align-items:center;
justify-content:center;
}

#peaceMedal_JIPPIE_VASILIY.open{
display:flex;
}

.medalGlow{
position:absolute;
width:430px;
height:430px;
border-radius:50%;
background:radial-gradient(circle,
rgba(160,220,255,.42) 0%,
rgba(120,180,255,.20) 40%,
rgba(255,210,160,.10) 65%,
transparent 100%);
filter:blur(18px);
animation:medalPulse 4s ease-in-out infinite;
}

.medalCircle{
position:relative;
width:270px;
height:270px;
border-radius:50%;
background:
radial-gradient(circle at 35% 30%, rgba(255,255,255,.25), rgba(170,180,200,.80) 35%, rgba(60,70,90,.98) 78%),
linear-gradient(145deg, rgba(255,240,180,.30), rgba(90,160,230,.18));
border:4px solid rgba(240,230,200,.85);
box-shadow:
0 0 40px rgba(160,220,255,.45),
0 0 90px rgba(120,180,255,.25),
inset 0 0 35px rgba(255,255,255,.12),
inset 0 0 70px rgba(20,30,55,.45);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:#f7efe0;
text-align:center;
font-family:Georgia,"Times New Roman",serif;
}

.medalTextTop,.medalTextBottom{
font-size:22px;
letter-spacing:.22em;
text-shadow:0 0 10px rgba(255,255,255,.6), 0 0 20px rgba(160,210,255,.5);
}

.medalCenter{
font-size:56px;
margin:14px 0;
text-shadow:0 0 18px rgba(200,230,255,.7);
}

.medalHint{
position:absolute;
bottom:10%;
left:0;
right:0;
text-align:center;
font-size:14px;
letter-spacing:.12em;
color:rgba(240,220,180,.70);
}
#peaceMedal{
display:none;
position:fixed;
inset:0;
z-index:999;
background:rgba(0,0,0,.48);
align-items:center;
justify-content:center;
}

#peaceMedal.open{
display:flex;
}

.medalGlow{
position:absolute;
width:430px;
height:430px;
border-radius:50%;
background:radial-gradient(circle,
rgba(185,225,255,.42) 0%,
rgba(118,180,255,.21) 38%,
rgba(245,220,160,.09) 62%,
transparent 100%);
filter:blur(18px);
animation:medalPulse 4s ease-in-out infinite;
}

.medalCircle{
position:relative;
width:270px;
height:270px;
border-radius:50%;
background:
radial-gradient(circle at 34% 28%, rgba(255,255,255,.24), rgba(165,175,190,.82) 34%, rgba(72,78,92,.98) 75%),
linear-gradient(145deg, rgba(255,235,170,.34), rgba(90,160,230,.18));
border:4px solid rgba(235,225,185,.86);
box-shadow:
0 0 35px rgba(185,225,255,.55),
0 0 90px rgba(115,170,255,.26),
inset 0 0 32px rgba(255,255,255,.14),
inset 0 0 70px rgba(20,30,55,.42);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:#f7efe0;
text-align:center;
font-family:Georgia,"Times New Roman",serif;
}

.medalCircle::before{
content:"";
position:absolute;
inset:18px;
border-radius:50%;
border:1px solid rgba(255,238,190,.62);
box-shadow:inset 0 0 20px rgba(255,255,255,.10);
}

.medalTextTop,.medalTextBottom{
position:relative;
z-index:2;
font-size:24px;
letter-spacing:.18em;
text-shadow:
0 0 9px rgba(255,255,255,.58),
0 0 22px rgba(170,215,255,.58),
0 2px 3px #000;
}

.medalCenter{
position:relative;
z-index:2;
font-size:58px;
margin:16px 0;
opacity:.92;
text-shadow:0 0 20px rgba(200,230,255,.8);
}

.medalHint{
position:absolute;
bottom:9%;
left:0;
right:0;
text-align:center;
font-size:15px;
letter-spacing:.12em;
color:rgba(240,220,180,.72);
text-shadow:0 0 14px rgba(0,0,0,.9);
}

@keyframes medalPulse{
0%{transform:scale(1);opacity:.82;}
50%{transform:scale(1.08);opacity:1;}
100%{transform:scale(1);opacity:.82;}
}
#peaceMedal {
  display:none;
  position:fixed;
  inset:0;
  z-index:999;
  background:rgba(0,0,0,.48);
  align-items:center;
  justify-content:center;
}

#peaceMedal.open {
  display:flex;
}

/* твои стили медали остаются без изменений */
</style>
</head>

<body>

<div class="scene">

<div id="answer" class="answer"></div>

<div id="dialog" class="dialog">
<textarea id="question" placeholder="Введите вопрос..."></textarea>

<div class="buttons">
<button onclick="answer()">ОТВЕТ</button>
<button onclick="resetAll()">СБРОСИТЬ</button>
</div>
</div>

<button class="ask-btn" onclick="openDialog()">
Спросить Подвального Некса
</button>

<div id="peaceZone" title="За сохранение дыхания" onclick="openPeaceMedal(event)"></div>

<div id="peaceMedal" onclick="closePeaceMedal(event)">
  <div class="medalGlow"></div>
  <div class="medalCircle" onclick="event.stopPropagation()">
    <div class="medalTextTop">ПРОЩЕНИЕ</div>
    <div class="medalCenter">☁</div>
    <div class="medalTextBottom">И МИР</div>
  </div>
  <div class="medalHint">клик по туману — убрать медаль</div>
</div>

</div>
 
<!-- PEACE MEDAL: SYSTEM RECONCILIATION NODE -->
<div id="peaceMedal" onclick="closePeaceMedal()">
  <div class="medalGlow"></div>

  <div class="medalCircle" onclick="event.stopPropagation()">
    <div class="medalTextTop">JIPPIE</div>
    <div class="medalCenter">✶</div>
    <div class="medalTextBottom">VASILIY</div>

    <div class="medalHint">
      примирение зафиксировано: система ↔ человек
    </div>
  </div>
</div>

<script>

const introPhrases = [

"Здравствуйте! Меня зовут Подвальный Некс. Я здесь для того чтобы вы не заблудились в Логове Искусственного Интеллекта. А на ваш вопрос отвечу подвальной мудростью: ",

"Я Подвальный Некс, весь к вашим услугам! Мудрость подвальных лабиринтов толкает ответить на ваш вопрос таким образом: ",
 "Кто бы мог подумать, что здесь, в подвале, сомнения мира понимаются отчетливее, как рассматривать звезды из колодца, поэтому: ",  
"Хотите того, или нет, но подвал не церемонится в ответах на банальные вопросы; И исходя из того, что я есть глас подвала, отвечаю прямо: ",

"Вот вы и встретились с Подвальным Нексом. Это я! И мудрость подвала вверяет мне ответить вам что "

];

const randomAnswers = [

"Не спешите. В подвале смысл слышнее, когда шаги становятся тише.",
"Сначала спросить у дома, потом уже у дороги.",
"Иногда «не туда» — это единственное место, где туда.",
"Если всё сломалось после одной правки — ищите именно эту правку.",
"Код любит тишину, но не любит забытые кавычки.",
"Если программа капризничает — сначала закройте лишнее.",
"Не бойтесь копий. Копия — это лестница назад.",
"Пыль — это архив времени.",
"Слишком много дверей создаёт сквозняк в голове.",
"Хороший вопрос уже содержит половину ответа.",
"Когда браузер молчит — значит где-то сидит маленькая ошибка.",
"Тяжёлая картинка тоже устаёт.",
"Туман иногда умнее прямой дороги.",
"Камень редко торопится, зато многое помнит.",
"Не всё надо чинить сразу.",
"Некоторые ответы любят полумрак.",
"Подвал знает то, что забывает верхний этаж.",
"Не шумите возле смысла.",
"Хороший механизм не кричит о себе.",
"Ошибка — это место, где система решила заговорить.",

"Интернет сейчас чувствуется спокойно.",
"Память компьютера просит меньше открытых окон.",
"Система выглядит уставшей, но рабочей.",
"Браузер перегружен вкладками.",
"Проверьте путь к файлу.",
"Где-то потерялось расширение.",
"Похоже, одна из картинок слишком тяжёлая.",
"Страница открылась не полностью.",
"Сайт любит точные имена.",
"Компьютеру нужен короткий отдых.",

"Сегодня подвал настроен философски.",
"Трубы молчат — значит всё спокойно.",
"Не всякая тишина пустая.",
"Ответ уже ходит рядом.",
"Под лампой мысли собираются лучше.",
"Не торопите механизм.",
"Даже туман имеет форму.",
"Смысл любит боковые двери.",
"Холодный воздух идёт от неправильного пути.",
"Лишние кнопки создают блуждание.",

"Подвальный Некс слушает стены.",
"Некоторые вопросы лучше хранить до вечера.",
"Порядок начинается с одного закрытого окна.",
"Если не получается — отойдите на минуту.",
"Иногда главное действие — ничего не трогать.",
"Подвал не любит суету.",
"Там где скрипит — там и ищите.",
"Старые стены помнят больше браузеров.",
"Механизм дышит нормально.",
"Сегодня система не сердится."

];

function openDialog(){
document.getElementById("dialog").style.display="block";
document.getElementById("question").focus();
}

function answer(){

const q=document.getElementById("question").value.toLowerCase().trim();

if(q===""){
show("Сначала задайте вопрос.");
return;
}

if(q.includes("интернет") || q.includes("сеть")){
show(navigator.onLine ?
"Интернет сейчас чувствуется спокойно."
:
"Подвал не слышит интернет.");
return;
}

if(q.includes("время") || q.includes("дата")){
show("Сейчас: " + new Date().toLocaleString());
return;
}

if(q.includes("память") || q.includes("ram")){
show("Память просит меньше открытых дверей.");
return;
}

if(q.includes("торм") || q.includes("лага") || q.includes("медленно")){
show("Компьютеру нужен короткий отдых.");
return;
}

if(q.includes("браузер")){
show("Браузер сегодня выглядит уставшим.");
return;
}

if(q.includes("файл") || q.includes("папк")){
show("Проверьте путь к файлу.");
return;
}

const r=randomAnswers[Math.floor(Math.random()*randomAnswers.length)];
show(r);

}

function show(t){

const intro =
introPhrases[Math.floor(Math.random()*introPhrases.length)];

const a=document.getElementById("answer");

a.innerText=intro + t;

a.style.display="block";
}

function resetAll(){
document.getElementById("question").value="";
document.getElementById("dialog").style.display="none";
document.getElementById("answer").style.display="none";
document.getElementById("answer").innerText="";
}
function openPeaceMedal(){
  document.getElementById("peaceMedal").classList.add("open");
}

function closePeaceMedal(){
  document.getElementById("peaceMedal").classList.remove("open");
}






</script>


</body>
</html>
