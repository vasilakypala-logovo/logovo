<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tucha Archive</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0b0c0f;color:#ddd;overflow:hidden;height:100vh}

#tuchaSwitch{position:fixed;top:20px;right:30px;z-index:2000;display:flex;gap:10px}
.tuchaBtn{padding:10px 24px;background:#222831;border:1px solid #444;color:#ccc;cursor:pointer;border-radius:6px;font-size:15px;font-weight:bold;transition:all 0.3s ease;letter-spacing:1px}
.tuchaBtn:hover{background:#2f3a46;border-color:#666}
.tuchaBtn.active{background:#1e2a3a;border-color:#4ade80;box-shadow:0 0 25px rgba(74,222,128,0.25);color:#fff}

#folders{position:absolute;left:0;top:0;bottom:0;width:140px;background:#15181d;padding:10px;overflow-y:auto;border-right:1px solid #222;padding-top:30px}
.folderBtn{width:100%;padding:12px 5px;margin-bottom:10px;background:#222831;border:1px solid #333;color:#ddd;cursor:pointer;text-align:center;position:relative;transition:all 0.3s ease;border-radius:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.folderBtn:hover{background:#2f3a46}
.folderBtn.active{border-color:#4ade80;box-shadow:0 0 20px rgba(74,222,128,0.3)}
.folderBtn .indicator{display:none;position:absolute;top:-6px;right:-6px;width:16px;height:16px;background:#4ade80;border-radius:50%;border:2px solid #15181d;box-shadow:0 0 15px rgba(74,222,128,0.6);animation:pulse-green 1.5s ease-in-out infinite}
.folderBtn.active .indicator{display:block}
@keyframes pulse-green{0%,100%{box-shadow:0 0 15px rgba(74,222,128,0.6);transform:scale(1)}50%{box-shadow:0 0 30px rgba(74,222,128,0.9);transform:scale(1.2)}}

#folderLabel{position:fixed;bottom:30px;right:30px;font-size:48px;font-weight:900;color:rgba(0,0,0,0.35);text-transform:uppercase;letter-spacing:3px;pointer-events:none;user-select:none;z-index:1000;font-family:'Arial Black',sans-serif;white-space:nowrap;display:none;text-shadow:0 1px 2px rgba(255,255,255,0.3);align-items:center;gap:20px}
#folderLabel .label-indicator{display:inline-block;width:20px;height:20px;background:#4ade80;border-radius:50%;box-shadow:0 0 25px rgba(74,222,128,0.7);animation:pulse-green 1.5s ease-in-out infinite;flex-shrink:0;margin-right:10px}
@media(max-width:768px){#folderLabel{font-size:24px;bottom:15px;right:15px;opacity:0.7;gap:10px}#folderLabel .label-indicator{width:14px;height:14px;margin-right:5px}.folderBtn .indicator{width:12px;height:12px;top:-4px;right:-4px}#tuchaSwitch{top:10px;right:10px}.tuchaBtn{padding:6px 12px;font-size:12px}}

#files{position:absolute;left:159px;top:0;bottom:60px;width:280px;background:#101217;border-right:1px solid #222;overflow-y:auto;padding:10px}
.fileRow{display:flex;justify-content:space-between;align-items:center;padding:6px;margin-bottom:4px;background:#1a1f27;cursor:pointer;border:1px solid #222}
.fileRow:hover{background:#273040}
.num{width:30px;font-weight:bold;cursor:pointer}
.num:hover{color:#ff6b6b}
.name{flex:1;margin-left:8px;font-size:12px;color:#aaa}
#reader{position:absolute;left:439px;right:0;top:0;bottom:0;display:none;background:#aeb5bb;color:#000;padding:25px;overflow:auto;font-size:22px;line-height:1.6;white-space:pre-wrap}
#closeReader{position:fixed;right:20px;top:20px;padding:10px 14px;background:#111;color:#fff;border:none;cursor:pointer;z-index:1001}
#title{position:absolute;left:159px;top:10px;padding:10px;font-size:14px;color:#888}

#fileControls{position:absolute;left:159px;bottom:0;width:280px;padding:10px;background:#15181d;border-top:1px solid #222;display:flex;gap:8px;z-index:5}
#fileControls button{padding:8px 16px;background:#222831;border:1px solid #444;color:#ddd;cursor:pointer;border-radius:4px;font-size:12px;flex:1;transition:all 0.3s ease}
#fileControls button:hover{background:#2f3a46;border-color:#666}
#fileControls button.addBtn{background:#1a3a2a;border-color:#2a6a4a}
#fileControls button.addBtn:hover{background:#1e4a32}

#statusBar{position:fixed;bottom:0;left:0;right:0;height:30px;background:#0b0c0f;border-top:1px solid #222;display:flex;align-items:center;padding:0 20px;font-size:12px;color:#888;z-index:100}
#statusBar .green{color:#4ade80}
#statusBar .red{color:#ff6b6b}
#statusBar .yellow{color:#ffd93d}

#githubSettings{position:fixed;top:70px;right:30px;z-index:1500;background:#15181d;border:1px solid #333;border-radius:8px;padding:15px;display:none;width:380px;box-shadow:0 0 50px rgba(0,0,0,0.8)}
#githubSettings input{width:100%;padding:8px;background:#222831;border:1px solid #444;color:#ddd;border-radius:4px;margin-bottom:8px;font-size:13px}
#githubSettings button{padding:8px 16px;background:#2a3a2a;border:1px solid #4a6a4a;color:#ddd;border-radius:4px;cursor:pointer}
#githubSettings button:hover{background:#3a4a3a}
#githubSettings .close{position:absolute;top:5px;right:10px;background:none;border:none;color:#888;font-size:20px;cursor:pointer}
#githubSettings .close:hover{color:#fff}
</style>
</head>
<body>

<div id="tuchaSwitch">
    <button class="tuchaBtn active" id="tucha1Btn" onclick="switchTucha('1')">☁️ Туча 1</button>
    <button class="tuchaBtn" id="tucha2Btn" onclick="switchTucha('2')">☁️ Туча 2</button>
</div>

<div id="folders"></div>
<div id="files"></div>
<div id="title">Tucha Archive</div>

<div id="fileControls">
    <button class="addBtn" onclick="addFile()">➕ Добавить</button>
</div>

<div id="reader"></div>
<button id="closeReader" onclick="closeReader()">Закрыть</button>

<div id="folderLabel">
    <span class="label-indicator"></span>
    <span class="label-text"></span>
</div>

<div id="statusBar">
    <span id="statusText">💾 Локальный режим (не подключено к GitHub)</span>
</div>

<div id="githubSettings">
    <button class="close" onclick="document.getElementById('githubSettings').style.display='none'">✕</button>
    <h3 style="margin-bottom:10px;color:#ddd;font-size:16px;">Подключение к GitHub</h3>
    <label style="color:#888;font-size:12px;">Токен доступа:</label>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <label style="color:#888;font-size:12px;margin-top:5px;display:block;">Репозиторий (владелец/репозиторий):</label>
    <input type="text" id="repoInput" placeholder="vasilakypala-logovo/logovo" value="vasilakypala-logovo/logovo">
    <label style="color:#888;font-size:12px;margin-top:5px;display:block;">Путь к папке:</label>
    <input type="text" id="pathInput" placeholder="room_nex/bukibuk/bukibuk" value="room_nex/bukibuk/bukibuk">
    <button onclick="connectGitHub()" style="margin-top:10px;width:100%;background:#2a4a3a;border-color:#4a8a4a;">🔗 Подключиться</button>
    <button onclick="disconnectGitHub()" style="margin-top:5px;width:100%;background:#4a2a2a;border-color:#8a4a4a;">🔓 Отключиться</button>
</div>

<!-- Кнопка GitHub в левом нижнем углу -->
<div style="position:fixed;bottom:40px;left:20px;z-index:2000;">
    <button class="tuchaBtn" onclick="document.getElementById('githubSettings').style.display='block'" style="background:#2a1a2a;border-color:#6a2a6a;padding:8px 16px;font-size:13px;border-radius:6px;border:1px solid #6a2a6a;color:#ddd;cursor:pointer;">
        ⚙️ GitHub
    </button>
</div>

<script>
// ===== НАСТРОЙКИ =====
const TUCHA1_FOLDERS = ['001','002','003','004','005','006','007'];
const TUCHA2_FOLDERS = ['008','009','010','011','012','013','014'];

// ===== СОСТОЯНИЕ =====
let currentTucha = '1';
let currentFolder = null;
let folderButtons = {};
let isConnected = false;
let githubToken = '';
let githubRepo = '';
let githubPath = '';

let fileLists = JSON.parse(localStorage.getItem('tucha_file_lists') || '{}');
let titles = JSON.parse(localStorage.getItem('tucha_titles') || '{}');
let folderNames = JSON.parse(localStorage.getItem('tucha_folder_names') || '{}');

// ===== DOM =====
const foldersDiv = document.getElementById('folders');
const filesDiv = document.getElementById('files');
const reader = document.getElementById('reader');
const folderLabel = document.getElementById('folderLabel');
const labelText = document.querySelector('#folderLabel .label-text');
const tucha1Btn = document.getElementById('tucha1Btn');
const tucha2Btn = document.getElementById('tucha2Btn');
const statusText = document.getElementById('statusText');

// ===== ЗАГРУЗКА СОХРАНЁННЫХ НАСТРОЕК GITHUB =====
function loadGitHubSettings(){
    githubToken = localStorage.getItem('tucha_github_token') || '';
    githubRepo = localStorage.getItem('tucha_github_repo') || 'vasilakypala-logovo/logovo';
    githubPath = localStorage.getItem('tucha_github_path') || 'room_nex/bukibuk/bukibuk';
    document.getElementById('tokenInput').value = githubToken;
    document.getElementById('repoInput').value = githubRepo;
    document.getElementById('pathInput').value = githubPath;
    if(githubToken && githubRepo){
        isConnected = true;
        statusText.textContent = '✅ Подключено к GitHub';
        statusText.className = 'green';
    }
}

// ===== ПОДКЛЮЧЕНИЕ К GITHUB =====
function connectGitHub(){
    const token = document.getElementById('tokenInput').value.trim();
    const repo = document.getElementById('repoInput').value.trim();
    const path = document.getElementById('pathInput').value.trim();
    
    if(!token || !repo){
        alert('Введите токен и название репозитория!');
        return;
    }
    
    githubToken = token;
    githubRepo = repo;
    githubPath = path;
    
    localStorage.setItem('tucha_github_token', token);
    localStorage.setItem('tucha_github_repo', repo);
    localStorage.setItem('tucha_github_path', path);
    
    isConnected = true;
    statusText.textContent = '✅ Подключено к GitHub';
    statusText.className = 'green';
    document.getElementById('githubSettings').style.display = 'none';
    
    testGitHubConnection();
}

function disconnectGitHub(){
    githubToken = '';
    isConnected = false;
    localStorage.removeItem('tucha_github_token');
    statusText.textContent = '💾 Локальный режим (не подключено к GitHub)';
    statusText.className = '';
    document.getElementById('githubSettings').style.display = 'none';
}

async function testGitHubConnection(){
    try{
        const [owner, repo] = githubRepo.split('/');
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {
            headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });
        if(response.ok){
            statusText.textContent = '✅ GitHub подключён';
            statusText.className = 'green';
        } else {
            statusText.textContent = '⚠️ Ошибка подключения к GitHub';
            statusText.className = 'red';
        }
    } catch(e){
        statusText.textContent = '⚠️ Ошибка подключения к GitHub';
        statusText.className = 'red';
    }
}

// ===== СОХРАНЕНИЕ НА GITHUB (автоматическое) =====
async function saveToGitHub(folder){
    if(!isConnected || !githubToken){
        saveAllData();
        return;
    }
    
    try{
        const [owner, repo] = githubRepo.split('/');
        const path = `${githubPath}/${folder}_data.json`;
        const sha = await getFileSha(owner, repo, path);
        
        const dataToSave = {
            folder: folder,
            files: fileLists[folder] || [],
            titles: {},
            folderName: folderNames[folder] || ''
        };
        (fileLists[folder] || []).forEach(num => {
            const key = folder + num;
            if(titles[key]) {
                dataToSave.titles[num] = titles[key];
            }
        });
        
        const jsonData = JSON.stringify(dataToSave, null, 2);
        const content = btoa(unescape(encodeURIComponent(jsonData)));
        
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        const body = {
            message: `Автосохранение: ${folder}_data.json`,
            content: content
        };
        if(sha) body.sha = sha;
        
        const response = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
        
        if(response.ok){
            statusText.textContent = `✅ Сохранено: ${folder}_data.json`;
            statusText.className = 'green';
            setTimeout(() => {
                statusText.textContent = '✅ GitHub подключён';
            }, 2000);
        } else {
            const err = await response.json();
            statusText.textContent = `⚠️ Ошибка сохранения: ${err.message}`;
            statusText.className = 'red';
            saveAllData();
        }
    } catch(e){
        statusText.textContent = `⚠️ Ошибка: ${e.message}`;
        statusText.className = 'red';
        saveAllData();
    }
}

async function getFileSha(owner, repo, path){
    try{
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
            headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });
        if(response.ok){
            const data = await response.json();
            return data.sha;
        }
        return null;
    } catch(e){
        return null;
    }
}

// ===== ЗАГРУЗКА С GITHUB =====
async function loadDataFromGitHub(folder){
    if(!isConnected || !githubToken) return false;
    
    try{
        const [owner, repo] = githubRepo.split('/');
        const path = `${githubPath}/${folder}_data.json`;
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
            headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });
        if(!response.ok) return false;
        
        const data = await response.json();
        const content = decodeURIComponent(escape(atob(data.content)));
        const json = JSON.parse(content);
        
        if(json.files && json.files.length > 0) {
            fileLists[folder] = json.files;
        }
        if(json.titles) {
            Object.keys(json.titles).forEach(num => {
                const key = folder + num;
                titles[key] = json.titles[num];
            });
        }
        if(json.folderName) {
            folderNames[folder] = json.folderName;
        }
        saveAllData();
        return true;
    } catch(e){
        return false;
    }
}

async function loadAllDataFromGitHub(){
    if(!isConnected || !githubToken) return;
    
    const allFolders = [...TUCHA1_FOLDERS, ...TUCHA2_FOLDERS];
    let loaded = 0;
    for(const folder of allFolders){
        const success = await loadDataFromGitHub(folder);
        if(success) loaded++;
    }
    if(loaded > 0){
        statusText.textContent = `✅ Загружено ${loaded} файлов с GitHub`;
        statusText.className = 'green';
        renderFolders();
        if(currentFolder){
            renderFiles(currentFolder);
        }
    }
}

// ===== ФУНКЦИИ СОХРАНЕНИЯ =====
function saveAllData(){
    localStorage.setItem('tucha_file_lists', JSON.stringify(fileLists));
    localStorage.setItem('tucha_titles', JSON.stringify(titles));
    localStorage.setItem('tucha_folder_names', JSON.stringify(folderNames));
}

// ===== ПОЛУЧИТЬ СПИСОК ФАЙЛОВ ДЛЯ ПАПКИ =====
function getFileList(folder){
    if(!fileLists[folder] || fileLists[folder].length === 0) {
        fileLists[folder] = ['01','02','03','04','05'];
        saveAllData();
        if(isConnected) saveToGitHub(folder);
    }
    return fileLists[folder];
}

// ===== ДОБАВИТЬ НОВЫЙ ФАЙЛ =====
function addFile(){
    if(!currentFolder) {
        alert('Сначала выберите папку!');
        return;
    }
    const list = getFileList(currentFolder);
    let maxNum = 0;
    list.forEach(num => {
        const n = parseInt(num);
        if(n > maxNum) maxNum = n;
    });
    const newNum = String(maxNum + 1).padStart(2, '0');
    list.push(newNum);
    fileLists[currentFolder] = list;
    saveAllData();
    renderFiles(currentFolder);
    if(isConnected) saveToGitHub(currentFolder);
}

// ===== УДАЛИТЬ ФАЙЛ =====
function deleteFile(folder, num){
    if(!confirm(`Удалить файл ${num}?`)) return;
    const list = getFileList(folder);
    const index = list.indexOf(num);
    if(index > -1){
        list.splice(index, 1);
        fileLists[folder] = list;
        saveAllData();
        renderFiles(folder);
        if(isConnected) saveToGitHub(folder);
    }
}

// ===== ПЕРЕКЛЮЧЕНИЕ МЕЖДУ ТУЧАМИ =====
function switchTucha(num){
    currentTucha = num;
    tucha1Btn.classList.toggle('active', num === '1');
    tucha2Btn.classList.toggle('active', num === '2');
    renderFolders();
    const folders = getCurrentFolders();
    if(folders.length > 0){
        openFolder(folders[0]);
    }
}

function getCurrentFolders(){
    return currentTucha === '1' ? TUCHA1_FOLDERS : TUCHA2_FOLDERS;
}

// ===== ОТРИСОВКА ПАПОК =====
function renderFolders(){
    foldersDiv.innerHTML = '';
    folderButtons = {};
    const folders = getCurrentFolders();
    folders.forEach(f => {
        const b = document.createElement('div');
        b.className = 'folderBtn';
        b.textContent = folderNames[f] || ("папка " + f);
        const indicator = document.createElement('span');
        indicator.className = 'indicator';
        b.appendChild(indicator);
        folderButtons[f] = b;
        
        b.onclick = () => openFolder(f);
        b.ondblclick = () => {
            const t = prompt("Название папки:", folderNames[f] || "");
            if (t === null) return;
            folderNames[f] = t;
            saveAllData();
            b.textContent = t || ("папка " + f);
            const newIndicator = document.createElement('span');
            newIndicator.className = 'indicator';
            b.appendChild(newIndicator);
            if (currentFolder === f) {
                updateFolderLabel(f);
                updateActiveFolder(f);
            }
            if(isConnected) saveToGitHub(f);
        };
        foldersDiv.appendChild(b);
    });
}

function updateActiveFolder(folder){
    Object.keys(folderButtons).forEach(key => {
        folderButtons[key].classList.remove('active');
    });
    if(folder && folderButtons[folder]){
        folderButtons[folder].classList.add('active');
    }
}

function openFolder(folder){
    currentFolder = folder;
    updateActiveFolder(folder);
    renderFiles(folder);
}

// ===== ОТРИСОВКА ФАЙЛОВ =====
function renderFiles(folder){
    filesDiv.innerHTML = '';
    const list = getFileList(folder);
    list.forEach(num => {
        const row = document.createElement('div');
        row.className = 'fileRow';
        
        const n = document.createElement('div');
        n.className = 'num';
        n.textContent = num;
        n.ondblclick = (e) => {
            e.stopPropagation();
            deleteFile(folder, num);
        };
        n.title = 'Двойной клик — удалить файл';
        
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = titles[folder + num] || '';
        
        row.appendChild(n);
        row.appendChild(name);
        
        row.onclick = () => openFile(folder, num);
        row.ondblclick = () => {
            const t = prompt("Название файла:", titles[folder + num] || '');
            if(t === null) return;
            titles[folder + num] = t;
            saveAllData();
            renderFiles(folder);
            if(isConnected) saveToGitHub(folder);
        };
        
        filesDiv.appendChild(row);
    });
}

// ===== ОТКРЫТИЕ ФАЙЛА =====
async function openFile(folder, num){
    const path = `${folder}/${num}.txt`;
    try{
        const res = await fetch(path);
        if(!res.ok) throw new Error('Not found');
        const buf = await res.arrayBuffer();
        const text = decodeSmart(buf);
        reader.style.display = 'block';
        reader.textContent = text;
        updateFolderLabel(folder);
    }catch(e){
        reader.style.display = 'block';
        reader.textContent = `Файл не найден: ${path}\n\nПроверьте, что папка "${folder}" и файл "${num}.txt" существуют в репозитории.`;
        updateFolderLabel(folder);
    }
}

function updateFolderLabel(folder){
    const displayName = folderNames[folder] || ("папка " + folder);
    labelText.textContent = '📁 ' + displayName;
    folderLabel.style.display = 'flex';
}

function closeReader(){
    reader.style.display = 'none';
    reader.textContent = '';
    folderLabel.style.display = 'none';
}

// ===== ДЕКОДЕР =====
function decodeSmart(buffer){
    const encodings = ['utf-8','windows-1251','koi8-r','ibm866','utf-16le','utf-16be'];
    let best = '';
    let bestScore = -1;
    for(const enc of encodings){
        try{
            const dec = new TextDecoder(enc);
            const txt = dec.decode(buffer);
            const score = txt.length - (txt.match(/�/g)||[]).length * 10;
            if(score > bestScore){
                bestScore = score;
                best = txt;
            }
        }catch(e){}
    }
    return best;
}

// ===== ЗАПУСК =====
async function init(){
    loadGitHubSettings();
    renderFolders();
    const firstFolders = getCurrentFolders();
    if(firstFolders.length > 0){
        openFolder(firstFolders[0]);
    }
    if(isConnected){
        await loadAllDataFromGitHub();
        renderFolders();
        if(currentFolder){
            renderFiles(currentFolder);
        }
    }
}

init();
</script>
</body>
</html>
