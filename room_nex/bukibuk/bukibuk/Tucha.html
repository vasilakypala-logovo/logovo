<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tucha Archive</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b0c0f;
    color:#ddd;
    overflow:hidden;
}

/* верхняя панель папок */
#folders{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:140px;
    background:#15181d;
    padding:10px;
    overflow-y:auto;
    border-right:1px solid #222;
    padding-top: 30px;
}

.folderBtn{
    width:100%;
    padding:12px 5px;
    margin-bottom:10px;
    background:#222831;
    border:1px solid #333;
    color:#ddd;
    cursor:pointer;
    text-align:center;
    position:relative;
    transition: all 0.3s ease;
    border-radius:4px;
    font-size:12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-sizing: border-box;
}
.folderBtn:hover{
    background:#2f3a46;
}

/* ===== ИНДИКАТОР ОТКРЫТОЙ ПАПКИ (ЛАМПОЧКА) ===== */
.folderBtn.active {
    border-color: #4ade80;
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
}

.folderBtn .indicator {
    display: none;
    position: absolute;
    top: -6px;
    right: -6px;
    width: 16px;
    height: 16px;
    background: #4ade80;
    border-radius: 50%;
    border: 2px solid #15181d;
    box-shadow: 0 0 15px rgba(74, 222, 128, 0.6);
    animation: pulse-green 1.5s ease-in-out infinite;
}

.folderBtn.active .indicator {
    display: block;
}

@keyframes pulse-green {
    0%, 100% {
        box-shadow: 0 0 15px rgba(74, 222, 128, 0.6);
        transform: scale(1);
    }
    50% {
        box-shadow: 0 0 30px rgba(74, 222, 128, 0.9);
        transform: scale(1.2);
    }
}

/* ===== НАЗВАНИЕ ПАПКИ В ПРАВОМ НИЖНЕМ УГЛУ С ЛАМПОЧКОЙ ===== */
#folderLabel{
    position:fixed;
    bottom:30px;
    right:30px;
    font-size:48px;
    font-weight:900;
    color:rgba(0,0,0,0.35);
    text-transform:uppercase;
    letter-spacing:3px;
    pointer-events:none;
    user-select:none;
    z-index:1000;
    font-family:'Arial Black',sans-serif;
    white-space:nowrap;
    display:none;
    text-shadow: 0 1px 2px rgba(255,255,255,0.3);
    align-items:center;
    gap:20px;
}

#folderLabel .label-text {
    display:inline-block;
}

/* Лампочка рядом с названием в читалке */
#folderLabel .label-indicator {
    display:inline-block;
    width:20px;
    height:20px;
    background:#4ade80;
    border-radius:50%;
    box-shadow: 0 0 25px rgba(74, 222, 128, 0.7);
    animation: pulse-green 1.5s ease-in-out infinite;
    flex-shrink:0;
    margin-right:10px;
}

/* Для мобильных устройств */
@media (max-width:768px){
    #folderLabel{
        font-size:24px;
        bottom:15px;
        right:15px;
        opacity:0.7;
        gap:10px;
    }
    #folderLabel .label-indicator {
        width:14px;
        height:14px;
        margin-right:5px;
    }
    .folderBtn .indicator {
        width:12px;
        height:12px;
        top:-4px;
        right:-4px;
    }
}

/* список файлов - СДВИНУТ ВПРАВО НА 5 ММ */
#files{
    position:absolute;
    left:159px; /* Было 140px, стало 159px (+19px ≈ 5 мм) */
    top:0;
    bottom:0;
    width:280px;
    background:#101217;
    border-right:1px solid #222;
    overflow-y:auto;
    padding:10px;
}

.fileRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px;
    margin-bottom:4px;
    background:#1a1f27;
    cursor:pointer;
    border:1px solid #222;
}
.fileRow:hover{
    background:#273040;
}

.num{
    width:30px;
    font-weight:bold;
}

.name{
    flex:1;
    margin-left:8px;
    font-size:12px;
    color:#aaa;
}

/* окно текста - СДВИНУТО ВПРАВО */
#reader{
    position:absolute;
    left:439px; /* Было 420px, стало 439px (159+280) */
    right:0;
    top:0;
    bottom:0;
    display:none;
    background:#aeb5bb;
    color:#000;
    padding:25px;
    overflow:auto;
    font-size:22px;
    line-height:1.6;
    white-space:pre-wrap;
}

#closeReader{
    position:fixed;
    right:20px;
    top:20px;
    padding:10px 14px;
    background:#111;
    color:#fff;
    border:none;
    cursor:pointer;
    z-index:1001;
}

/* заголовок - СДВИНУТ ВПРАВО */
#title{
    position:absolute;
    left:159px; /* Было 140px, стало 159px */
    top:0;
    padding:10px;
    font-size:14px;
    color:#888;
}
</style>
</head>

<body>

<div id="folders"></div>
<div id="files"></div>
<div id="title">Tucha Archive</div>

<div id="reader"></div>
<button id="closeReader" onclick="closeReader()">Закрыть</button>

<!-- НАЗВАНИЕ ПАПКИ С ЛАМПОЧКОЙ -->
<div id="folderLabel">
    <span class="label-indicator"></span>
    <span class="label-text"></span>
</div>

<script>
const FOLDERS = Array.from({length:14}, (_,i)=>String(i+1).padStart(3,'0'));
const FILES = Array.from({length:99}, (_,i)=>String(i+1).padStart(2,'0'));

const foldersDiv = document.getElementById('folders');
const filesDiv = document.getElementById('files');
const reader = document.getElementById('reader');
const folderLabel = document.getElementById('folderLabel');
const labelText = document.querySelector('#folderLabel .label-text');

let currentFolder = null;
let titles = JSON.parse(localStorage.getItem('tucha_titles') || '{}');
let folderNames = JSON.parse(localStorage.getItem('tucha_folder_names') || '{}');

// Храним все кнопки папок для обновления индикаторов
let folderButtons = {};

function saveTitles(){
    localStorage.setItem('tucha_titles', JSON.stringify(titles));
}
function saveFolderNames(){
    localStorage.setItem('tucha_folder_names', JSON.stringify(folderNames));
}

/* ====== FOLDERS ====== */
FOLDERS.forEach(f=>{
    const b = document.createElement('div');
    b.className='folderBtn';
    b.textContent = folderNames[f] || ("папка " + f);
    
    // Добавляем индикатор (лампочку)
    const indicator = document.createElement('span');
    indicator.className = 'indicator';
    b.appendChild(indicator);
    
    // Сохраняем кнопку
    folderButtons[f] = b;
    
    b.onclick=()=>openFolder(f);
    b.ondblclick = () => {
        const t = prompt("Название папки:", folderNames[f] || "");
        if (t === null) return;
        folderNames[f] = t;
        saveFolderNames();
        b.textContent = t || ("папка " + f);
        // Возвращаем индикатор обратно (он был удален при замене текста)
        const newIndicator = document.createElement('span');
        newIndicator.className = 'indicator';
        b.appendChild(newIndicator);
        // Обновляем состояние
        if (currentFolder === f) {
            updateFolderLabel(f);
            updateActiveFolder(f);
        }
    };
    
    foldersDiv.appendChild(b);
});

/* ====== ФУНКЦИЯ ОБНОВЛЕНИЯ АКТИВНОЙ ПАПКИ ====== */
function updateActiveFolder(folder) {
    // Убираем класс active у всех папок
    Object.keys(folderButtons).forEach(key => {
        folderButtons[key].classList.remove('active');
    });
    
    // Добавляем класс active текущей папке
    if (folder && folderButtons[folder]) {
        folderButtons[folder].classList.add('active');
    }
}

function openFolder(folder){
    currentFolder = folder;
    updateActiveFolder(folder);
    renderFiles(folder);
}

/* ====== FILE LIST ====== */
function renderFiles(folder){
    filesDiv.innerHTML='';

    FILES.forEach(num=>{
        const row = document.createElement('div');
        row.className='fileRow';

        const n = document.createElement('div');
        n.className='num';
        n.textContent=num;

        const name = document.createElement('div');
        name.className='name';
        name.textContent = titles[folder+num] || '';

        row.appendChild(n);
        row.appendChild(name);

        row.onclick=()=>openFile(folder,num);

        row.ondblclick=()=>{
            const t = prompt("Название файла:", titles[folder+num] || '');
            if(t===null) return;
            titles[folder+num]=t;
            saveTitles();
            renderFiles(folder);
        };

        filesDiv.appendChild(row);
    });
}

/* ====== FILE OPEN ====== */
async function openFile(folder,num){
    const path = `${folder}/${num}.txt`;

    try{
        const res = await fetch(path);
        const buf = await res.arrayBuffer();

        const text = decodeSmart(buf);

        reader.style.display='block';
        reader.textContent = text;
        
        updateFolderLabel(folder);

    }catch(e){
        reader.style.display='block';
        reader.textContent = "Файл не найден: " + path;
        
        updateFolderLabel(folder);
    }
}

/* ====== ОБНОВЛЕНИЕ НАЗВАНИЯ ПАПКИ С ЛАМПОЧКОЙ ====== */
function updateFolderLabel(folder){
    const displayName = folderNames[folder] || ("папка " + folder);
    labelText.textContent = '📁 ' + displayName;
    folderLabel.style.display = 'flex';
}

/* ====== ENCODING DETECTOR ====== */
function decodeSmart(buffer){
    const encodings = [
        'utf-8',
        'windows-1251',
        'koi8-r',
        'ibm866',
        'utf-16le',
        'utf-16be'
    ];

    let best = '';
    let bestScore = -1;

    for(const enc of encodings){
        try{
            const dec = new TextDecoder(enc);
            const txt = dec.decode(buffer);

            const score = qualityScore(txt);

            if(score > bestScore){
                bestScore = score;
                best = txt;
            }
        }catch(e){}
    }

    return best;
}

function qualityScore(txt){
    let bad = (txt.match(/�/g)||[]).length;
    return txt.length - bad*10;
}

/* ====== CLOSE ====== */
function closeReader(){
    reader.style.display='none';
    reader.textContent='';
    folderLabel.style.display = 'none';
}

/* init */
openFolder(FOLDERS[0]);
</script>

</body>
</html>
