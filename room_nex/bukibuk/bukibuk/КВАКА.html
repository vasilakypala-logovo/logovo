<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>КВАКА и КУВАКА</title> <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet"> <style> *{ box-sizing:border-box; } body{ margin:0; background:#dff7ff; font-family:'Comic Neue',sans-serif; color:#444; } .screen{ display:none; min-height:100vh; padding:20px; } .screen.active{ display:block; } .card{ max-width:520px; margin:auto; background:white; border-radius:30px; padding:20px; box-shadow:0 8px 20px rgba(0,0,0,0.15); } h1{ text-align:center; font-size:42px; margin-top:0; } .layout{ display:flex; gap:15px; } .icons{ display:flex; flex-direction:column; gap:12px; } .icon-btn{ width:64px; height:64px; border:none; border-radius:20px; background:#f7f7f7; font-size:32px; cursor:pointer; box-shadow:0 4px 8px rgba(0,0,0,0.15); } .icon-btn.selected{ background:#fff6a8; } .main{ flex:1; } .preview{ font-size:80px; text-align:center; margin-bottom:15px; } textarea{ width:100%; height:180px; border:3px solid #ddd; border-radius:20px; padding:15px; font-size:24px; font-family:'Comic Neue',sans-serif; resize:none; } .big{ width:100%; margin-top:15px; padding:16px; border:none; border-radius:20px; font-size:28px; font-family:'Comic Neue',sans-serif; cursor:pointer; box-shadow:0 4px 8px rgba(0,0,0,0.15); } .green{ background:#aef0a6; } .orange{ background:#ffd18b; } .blue{ background:#b8e8ff; } .tv{ background:#666; border-radius:30px; padding:20px; margin:20px 0; box-shadow:inset 0 0 10px rgba(0,0,0,0.4); } .tv-label{ color:white; text-align:center; font-size:24px; margin-bottom:12px; } .tv-screen{ background:#dfffdc; border-radius:15px; min-height:180px; padding:20px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:28px; word-break:break-word; } @media(max-width:500px){ h1{ font-size:36px; } .layout{ flex-direction:column; } .icons{ flex-direction:row; flex-wrap:wrap; justify-content:center; } textarea{ font-size:22px; } .preview{ font-size:72px; } } </style> </head> <body> <!-- КВАКА --> <div class="screen active" id="kvakaScreen"> <div class="card"> <h1>🐸 КВАКА</h1> <div class="layout"> <div class="icons"> <button class="icon-btn selected" onclick="selectSymbol('🐸', this)"> 🐸 </button> <button class="icon-btn" onclick="selectSymbol('🌼', this)"> 🌼 </button> <button class="icon-btn" onclick="selectSymbol('⭐', this)"> ⭐ </button> <button class="icon-btn" onclick="selectSymbol('🎲', this)"> 🎲 </button> <button class="icon-btn" onclick="selectSymbol('🐱', this)"> 🐱 </button> </div> <div class="main"> <div class="preview" id="kvakaPreview"> 🐸 </div> <textarea id="kvakaText" placeholder="Напиши историю..."></textarea> </div> </div> <button class="big green" onclick="kvaknut()"> КВАКНУТЬ </button> <button class="big blue" onclick="goToKuvaka()"> 🚪 В гости к КУВАКЕ </button> </div> </div> <!-- КУВАКА --> <div class="screen" id="kuvakaScreen"> <div class="card"> <h1>📺 КУВАКА</h1> <div class="preview" id="kuvakaImage"> ❓ </div> <div class="tv"> <div class="tv-label"> Телевизор КУВАКИ </div> <div class="tv-screen" id="tvScreen"> ... </div> </div> <button class="big orange" onclick="kuvaknut()"> КУВАКНУТЬ </button> <button class="big blue" onclick="goToKvaka()"> 🚪 К КВАКЕ </button> </div> </div> <script> let selectedSymbol = "🐸"; function selectSymbol(symbol, button){ selectedSymbol = symbol; document.getElementById("kvakaPreview").textContent = symbol; document.querySelectorAll(".icon-btn") .forEach(btn => btn.classList.remove("selected")); button.classList.add("selected"); } function kvaknut(){ const text = document.getElementById("kvakaText") .value .trim(); if(text === ""){ alert("Напиши историю для КВАКИ."); return; } localStorage.setItem( "kvakaSymbol", selectedSymbol ); localStorage.setItem( "kvakaMessage", text ); alert("КВАКА спрятала историю!"); } function goToKuvaka(){ document.getElementById("kvakaScreen") .classList.remove("active"); document.getElementById("kuvakaScreen") .classList.add("active"); const symbol = localStorage.getItem("kvakaSymbol"); document.getElementById("kuvakaImage") .textContent = symbol ? symbol : "❓"; document.getElementById("tvScreen") .textContent = "..."; } function goToKvaka(){ document.getElementById("kuvakaScreen") .classList.remove("active"); document.getElementById("kvakaScreen") .classList.add("active"); } function kuvaknut(){ const text = localStorage.getItem("kvakaMessage"); if(!text){ document.getElementById("tvScreen") .textContent = "Телевизор молчит."; return; } document.getElementById("tvScreen") .textContent = text; } </script> </body> </html>
