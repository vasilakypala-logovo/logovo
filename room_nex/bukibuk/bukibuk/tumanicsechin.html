<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tucha Archive</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b0c0f;
    color:#ddd;
    overflow:hidden;
    height:100vh;
}

#folders{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:70px;
    background:#15181d;
    padding:10px 20px;
    border-bottom:1px solid #222;
    display:flex;
    gap:10px;
    overflow-x:auto;
    align-items:center;
    z-index:10;
}

.folderBtn{
    padding:12px 30px;
    background:#222831;
    border:1px solid #333;
    color:#ddd;
    cursor:pointer;
    text-align:center;
    white-space:nowrap;
    font-size:14px;
    border-radius:4px;
    flex-shrink:0;
    position:relative;
    transition: all 0.3s ease;
}
.folderBtn:hover{
    background:#2f3a46;
}

/* ===== ИНДИКАТОР ОТКРЫТОЙ ПАПКИ (ЛАМПОЧКА) ===== */
.folderBtn.active {
    border-color: #4ade80;
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
}

.folderBtn .indicator {
    display: none;
    position: absolute;
    top: -6px;
    right: -6px;
    width: 16px;
    height: 16px;
    background: #4ade80;
    border-radius: 50%;
    border: 2px solid #15181d;
    box-shadow: 0 0 15px rgba(74, 222, 128, 0.6);
    animation: pulse-green 1.5s ease-in-out infinite;
}

.folderBtn.active .indicator {
    display: block;
}

@keyframes pulse-green {
    0%, 100% {
        box-shadow: 0 0 15px rgba(74, 222, 128, 0.6);
        transform: scale(1);
    }
    50% {
        box-shadow: 0 0 30px rgba(74, 222, 128, 0.9);
        transform: scale(1.2);
    }
}

/* ===== НАЗВАНИЕ ПАПКИ В ПРАВОМ НИЖНЕМ УГЛУ С ЛАМПОЧКОЙ ===== */
#folderLabel{
    position:fixed;
    bottom:30px;
    right:30px;
    font-size:48px;
    font-weight:900;
    color:rgba(0,0,0,0.35);
    text-transform:uppercase;
    letter-spacing:3px;
    pointer-events:none;
    user-select:none;
    z-index:1000;
    font-family:'Arial Black',sans-serif;
    white-space:nowrap;
    display:none;
    text-shadow: 0 1px 2px rgba(255,255,255,0.3);
    display:none;
    align-items:center;
    gap:20px;
}

#folderLabel .label-text {
    display:inline-block;
}

/* Лампочка рядом с названием в читалке */
#folderLabel .label-indicator {
    display:inline-block;
    width:20px;
    height:20px;
    background:#4ade80;
    border-radius:50%;
    box-shadow: 0 0 25px rgba(74, 222, 128, 0.7);
    animation: pulse-green 1.5s ease-in-out infinite;
    flex-shrink:0;
    margin-right:10px;
}

/* Для мобильных устройств */
@media (max-width:768px){
    #folderLabel{
        font-size:24px;
        bottom:15px;
        right:15px;
        opacity:0.7;
        gap:10px;
    }
    #folderLabel .label-indicator {
        width:14px;
        height:14px;
        margin-right:5px;
    }
    .folderBtn .indicator {
        width:12px;
        height:12px;
        top:-4px;
        right:-4px;
    }
}

#files{
    position:absolute;
    left:0;
    top:70px;
    bottom:0;
    width:280px;
    background:#101217;
    border-right:1px solid #222;
    overflow-y:auto;
    padding:10px;
}

.fileRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px;
    margin-bottom:4px;
    background:#1a1f27;
    cursor:pointer;
    border:1px solid #222;
}
.fileRow:hover{
    background:#273040;
}

.num{
    width:30px;
    font-weight:bold;
}

.name{
    flex:1;
    margin-left:8px;
    font-size:12px;
    color:#aaa;
}

#reader{
    position:absolute;
    left:280px;
    top:70px;
    right:0;
    bottom:0;
    display:none;
    background:#aeb5bb;
    color:#000;
    padding:25px;
    overflow:auto;
    font-size:22px;
    line-height:1.6;
    white-space:pre-wrap;
}

#closeReader{
    position:fixed;
    right:20px;
    top:90px;
    padding:10px 14px;
    background:#111;
    color:#fff;
    border:none;
    cursor:pointer;
    z-index:20;
}
</style>
</head>

<body>

<div id="folders"></div>
<div id="files"></div>

<div id="reader"></div>
<button id="closeReader" onclick="closeReader()">Закрыть</button>

<!-- НАЗВАНИЕ ПАПКИ С ЛАМПОЧКОЙ -->
<div id="folderLabel">
    <span class="label-indicator"></span>
    <span class="label-text"></span>
</div>

<script>
console.log('=== СКРИПТ ЗАПУЩЕН ===');

// ВАЖНО: укажите ТОЧНЫЕ имена ваших папок
const PHYSICAL_FOLDERS = ['stih1', 'stih2', 'stih3', 'stih4', 'stih5', 'stih6', 'stih7'];
console.log('Папки:', PHYSICAL_FOLDERS);

const FILES = Array.from({length:99}, (_,i)=>String(i+1).padStart(2,'0'));
console.log('Файлов:', FILES.length);

const foldersDiv = document.getElementById('folders');
const filesDiv = document.getElementById('files');
const reader = document.getElementById('reader');
const folderLabel = document.getElementById('folderLabel');
const labelText = document.querySelector('#folderLabel .label-text');

console.log('Элементы найдены:', {
    foldersDiv: !!foldersDiv,
    filesDiv: !!filesDiv,
    reader: !!reader,
    folderLabel: !!folderLabel
});

let currentFolder = null;
let titles = JSON.parse(localStorage.getItem('tucha_titles') || '{}');
let folderNames = JSON.parse(localStorage.getItem('tucha_folder_names') || '{}');

// Храним все кнопки папок для обновления индикаторов
let folderButtons = {};

function saveTitles(){
    localStorage.setItem('tucha_titles', JSON.stringify(titles));
}
function saveFolderNames(){
    localStorage.setItem('tucha_folder_names', JSON.stringify(folderNames));
}

/* ====== FOLDERS ====== */
console.log('Создаю кнопки папок...');
PHYSICAL_FOLDERS.forEach((physical, index)=>{
    console.log(`Создаю папку ${index+1}:`, physical);
    const b = document.createElement('div');
    b.className = 'folderBtn';
    b.textContent = folderNames[physical] || physical;
    
    // Добавляем индикатор (лампочку)
    const indicator = document.createElement('span');
    indicator.className = 'indicator';
    b.appendChild(indicator);
    
    // Сохраняем кнопку
    folderButtons[physical] = b;
    
    b.onclick=()=>{
        console.log('Клик по папке:', physical);
        openFolder(physical);
    };
    b.ondblclick = () => {
        const t = prompt("Название папки:", folderNames[physical] || physical);
        if (t === null) return;
        folderNames[physical] = t;
        saveFolderNames();
        b.textContent = t || physical;
        // Возвращаем индикатор обратно (он был удален при замене текста)
        const newIndicator = document.createElement('span');
        newIndicator.className = 'indicator';
        b.appendChild(newIndicator);
        // Обновляем состояние
        if (currentFolder === physical) {
            updateFolderLabel(physical);
            updateActiveFolder(physical);
        }
    };
    foldersDiv.appendChild(b);
    console.log('Кнопка добавлена');
});

console.log('Все кнопки созданы');

/* ====== ФУНКЦИЯ ОБНОВЛЕНИЯ АКТИВНОЙ ПАПКИ ====== */
function updateActiveFolder(folder) {
    // Убираем класс active у всех папок
    Object.keys(folderButtons).forEach(key => {
        folderButtons[key].classList.remove('active');
    });
    
    // Добавляем класс active текущей папке
    if (folder && folderButtons[folder]) {
        folderButtons[folder].classList.add('active');
    }
}

function openFolder(folder){
    console.log('=== openFolder вызвана с:', folder);
    currentFolder = folder;
    updateActiveFolder(folder);
    renderFiles(folder);
}

/* ====== FILE LIST ====== */
function renderFiles(folder){
    console.log('=== renderFiles вызвана с:', folder);
    filesDiv.innerHTML='';
    console.log('Очистил список файлов');

    FILES.forEach((num, index)=>{
        if (index < 5 || index > 90) {
            console.log(`Создаю файл ${index+1}:`, num);
        }
        
        const row = document.createElement('div');
        row.className='fileRow';

        const n = document.createElement('div');
        n.className='num';
        n.textContent=num;

        const name = document.createElement('div');
        name.className='name';
        const fileName = titles[folder+num];
        name.textContent = fileName || '';

        row.appendChild(n);
        row.appendChild(name);

        row.onclick=()=>{
            console.log('=== КЛИК ПО ФАЙЛУ ===');
            console.log('Папка:', folder);
            console.log('Номер файла:', num);
            console.log('Путь:', `${folder}/${num}.txt`);
            openFile(folder,num);
        };

        row.ondblclick=()=>{
            const t = prompt("Название файла:", titles[folder+num] || '');
            if(t===null) return;
            titles[folder+num]=t;
            saveTitles();
            renderFiles(folder);
        };

        filesDiv.appendChild(row);
    });
    
    console.log('Все файлы отрисованы');
}

/* ====== FILE OPEN ====== */
async function openFile(folder,num){
    console.log('=== openFile ВЫЗВАНА ===');
    console.log('Папка:', folder);
    console.log('Номер:', num);
    
    const path = `${folder}/${num}.txt`;
    console.log('Полный путь:', path);
    console.log('Текущий URL:', window.location.href);

    try{
        console.log('Начинаю fetch...');
        const res = await fetch(path);
        console.log('Ответ получен, статус:', res.status);
        console.log('OK?', res.ok);
        
        if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        
        console.log('Читаю данные...');
        const buf = await res.arrayBuffer();
        console.log('Данные прочитаны, размер:', buf.byteLength);
        
        const text = decodeSmart(buf);
        console.log('Текст декодирован, длина:', text.length);

        reader.style.display='block';
        reader.textContent = text;
        console.log('Текст отображён');
        
        // ===== ПОКАЗЫВАЕМ НАЗВАНИЕ ПАПКИ С ЛАМПОЧКОЙ =====
        updateFolderLabel(folder);

    }catch(e){
        console.error('=== ОШИБКА ===');
        console.error('Тип ошибки:', e.name);
        console.error('Сообщение:', e.message);
        console.error('Полный объект:', e);
        
        reader.style.display='block';
        reader.textContent = `ОШИБКА: ${e.message}\n\nПуть: ${path}\n\nПроверьте:\n1. Существует ли папка "${folder}"\n2. Существует ли файл "${num}.txt"\n3. Правильно ли написаны имена (регистр важен!)\n4. Открываете ли вы через сервер (не file://)`;
        
        // ===== ПОКАЗЫВАЕМ НАЗВАНИЕ ПАПКИ С ЛАМПОЧКОЙ даже при ошибке =====
        updateFolderLabel(folder);
    }
}

/* ====== ОБНОВЛЕНИЕ НАЗВАНИЯ ПАПКИ С ЛАМПОЧКОЙ ====== */
function updateFolderLabel(folder){
    const displayName = folderNames[folder] || folder;
    labelText.textContent = '📁 ' + displayName;
    folderLabel.style.display = 'flex';
}

/* ====== ENCODING DETECTOR ====== */
function decodeSmart(buffer){
    console.log('Декодирую буфер, размер:', buffer.byteLength);
    const encodings = [
        'utf-8',
        'windows-1251',
        'koi8-r',
        'ibm866',
        'utf-16le',
        'utf-16be'
    ];

    let best = '';
    let bestScore = -1;

    for(const enc of encodings){
        try{
            const dec = new TextDecoder(enc);
            const txt = dec.decode(buffer);
            const score = qualityScore(txt);
            if(score > bestScore){
                bestScore = score;
                best = txt;
            }
        }catch(e){}
    }

    console.log('Декодировано, выбрана кодировка');
    return best;
}

function qualityScore(txt){
    let bad = (txt.match(/�/g)||[]).length;
    return txt.length - bad*10;
}

/* ====== CLOSE ====== */
function closeReader(){
    console.log('Закрываю читалку');
    reader.style.display='none';
    reader.textContent='';
    // ===== СКРЫВАЕМ НАЗВАНИЕ ПАПКИ =====
    folderLabel.style.display = 'none';
}

/* init */
console.log('=== ИНИЦИАЛИЗАЦИЯ ===');
console.log('Открываю первую папку:', PHYSICAL_FOLDERS[0]);
openFolder(PHYSICAL_FOLDERS[0]);
console.log('=== ГОТОВО ===');
</script>

</body>
</html>
