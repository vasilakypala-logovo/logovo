<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БАРДАЧОК НЕКСА</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:#07090d;
  color:rgba(245,238,220,.94);
  font-family:Georgia,"Times New Roman",serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 18%, rgba(180,210,255,.10), transparent 34%),
    radial-gradient(circle at 12% 88%, rgba(170,120,80,.08), transparent 30%),
    linear-gradient(180deg,#080b12 0%,#101017 46%,#050608 100%);
}

.nex-box{
  width:min(920px,96vw);
  min-height:560px;
  border-radius:26px;
  border:1px solid rgba(210,190,150,.28);
  background:
    linear-gradient(180deg, rgba(24,26,34,.92), rgba(9,10,15,.96));
  box-shadow:
    0 28px 80px rgba(0,0,0,.62),
    inset 0 0 36px rgba(255,235,190,.035);
  padding:22px;
}

.header{
  text-align:center;
  padding:10px 10px 20px;
  border-bottom:1px solid rgba(255,235,190,.14);
}

.header h1{
  font-size:24px;
  letter-spacing:.18em;
  font-weight:normal;
  color:rgba(255,245,220,.95);
  text-shadow:0 0 18px rgba(230,210,170,.28);
}

.header p{
  margin-top:8px;
  font-size:13px;
  letter-spacing:.08em;
  color:rgba(230,220,200,.58);
}

.panel{
  display:grid;
  grid-template-columns:1fr 260px;
  gap:18px;
  margin-top:20px;
}

.file-list{
  min-height:360px;
  max-height:440px;
  overflow:auto;
  border-radius:18px;
  border:1px solid rgba(255,235,190,.13);
  background:rgba(0,0,0,.24);
  padding:12px;
}

.file-row{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
  padding:9px 10px;
  border-radius:12px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);
}

.file-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
  color:rgba(255,248,230,.92);
}

.file-size{
  font-size:12px;
  color:rgba(255,248,230,.50);
  margin-top:3px;
}

.side{
  border-radius:18px;
  border:1px solid rgba(255,235,190,.13);
  background:rgba(0,0,0,.22);
  padding:14px;
}

.side-title{
  text-align:center;
  font-size:13px;
  letter-spacing:.14em;
  color:rgba(255,242,210,.72);
  margin-bottom:14px;
}

button,.file-button{
  width:100%;
  border-radius:12px;
  border:1px solid rgba(220,205,170,.22);
  background:
    linear-gradient(180deg, rgba(120,120,130,.20), rgba(50,52,60,.18));
  color:rgba(255,246,224,.92);
  font-family:Georgia,"Times New Roman",serif;
  font-size:14px;
  padding:10px 12px;
  cursor:pointer;
  transition:.18s;
}

button:hover,.file-button:hover{
  background:
    linear-gradient(180deg, rgba(170,160,135,.25), rgba(70,72,82,.22));
  box-shadow:0 0 16px rgba(230,210,170,.11);
}

.small-btn{
  width:auto;
  min-width:86px;
  padding:7px 10px;
  font-size:12px;
}

.delete-btn{
  color:rgba(255,205,190,.92);
  border-color:rgba(255,150,130,.22);
}

input[type="file"]{
  display:none;
}

.chosen{
  min-height:46px;
  margin:12px 0;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.035);
  border:1px dashed rgba(255,235,190,.16);
  color:rgba(255,248,230,.66);
  font-size:13px;
  line-height:1.35;
}

.status{
  margin-top:14px;
  min-height:42px;
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.20);
  color:rgba(230,220,200,.66);
  font-size:13px;
  line-height:1.35;
}

.footer-note{
  margin-top:16px;
  text-align:center;
  color:rgba(255,248,230,.38);
  font-size:12px;
}

@media(max-width:760px){
  body{padding:10px;}
  .panel{grid-template-columns:1fr;}
  .nex-box{padding:16px;}
  .header h1{font-size:20px;}
}
</style>
</head>

<body>
<div class="nex-box">
  <div class="header">
    <h1>БАРДАЧОК НЕКСА</h1>
    <p>Временное хранилище файлов в Обители</p>
  </div>

  <div class="panel">
    <div>
      <div class="file-list" id="fileList">
        Загрузка списка...
      </div>
      <div class="footer-note">bucket: kyrilka</div>
    </div>

    <div class="side">
      <div class="side-title">ПОЛОЖИТЬ ФАЙЛ</div>

      <label class="file-button">
        ВЫБРАТЬ ФАЙЛ
        <input id="fileInput" type="file">
      </label>

      <div class="chosen" id="chosenFile">Файл ещё не выбран.</div>

      <button onclick="uploadFile()">ПОЛОЖИТЬ В БАРДАЧОК</button>
      <br><br>
      <button onclick="loadFiles()">ОБНОВИТЬ СПИСОК</button>

      <div class="status" id="status">Готов к работе.</div>
    </div>
  </div>
</div>

<script>
/*
  ВАЖНО:
  Вставьте сюда свои данные Supabase проекта OBITEL NEX.
  Bucket уже указан: kyrilka.
*/

const SUPABASE_URL = "https://qekemclxegswolddmqxa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_arQvVM0huxdB5jbiLPpSPA_7tksXK-Y";
const BUCKET = "kyrilka";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const fileInput = document.getElementById("fileInput");
const chosenFile = document.getElementById("chosenFile");
const statusBox = document.getElementById("status");
const fileList = document.getElementById("fileList");

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if(!file){
    chosenFile.textContent = "Файл ещё не выбран.";
    return;
  }
  chosenFile.textContent = file.name + " — " + formatSize(file.size);
});

function setStatus(text){
  statusBox.textContent = text;
}

function formatSize(bytes){
  if(bytes < 1024) return bytes + " б";
  if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " КБ";
  return (bytes / 1024 / 1024).toFixed(1) + " МБ";
}

async function loadFiles(){
  setStatus("Смотрю, что лежит в бардачке...");

  const { data, error } = await client.storage
    .from(BUCKET)
    .list("", {
      limit: 100,
      offset: 0,
      sortBy: { column: "created_at", order: "desc" }
    });

  if(error){
    fileList.innerHTML = "Не удалось получить список файлов.";
    setStatus("Ошибка списка: " + error.message);
    return;
  }

  if(!data || !data.length){
    fileList.innerHTML = "Бардачок пуст.";
    setStatus("Пока файлов нет.");
    return;
  }

  fileList.innerHTML = "";

  data.forEach(item => {
    if(item.name === ".emptyFolderPlaceholder") return;

    const row = document.createElement("div");
    row.className = "file-row";

    const nameBox = document.createElement("div");

    const name = document.createElement("div");
    name.className = "file-name";
    name.textContent = item.name;

    const size = document.createElement("div");
    size.className = "file-size";
    size.textContent = item.metadata && item.metadata.size ? formatSize(item.metadata.size) : "";

    nameBox.appendChild(name);
    nameBox.appendChild(size);

    const openBtn = document.createElement("button");
    openBtn.className = "small-btn";
    openBtn.textContent = "ЗАБРАТЬ";
    openBtn.onclick = () => openFile(item.name);

    const delBtn = document.createElement("button");
    delBtn.className = "small-btn delete-btn";
    delBtn.textContent = "УБРАТЬ";
    delBtn.onclick = () => deleteFile(item.name);

    row.appendChild(nameBox);
    row.appendChild(openBtn);
    row.appendChild(delBtn);

    fileList.appendChild(row);
  });

  setStatus("Список обновлён.");
}

async function uploadFile(){
  const file = fileInput.files[0];

  if(!file){
    setStatus("Сначала выберите файл.");
    return;
  }

  setStatus("Кладу файл в бардачок...");

  const ext = file.name.includes(".")
    ? "." + file.name.split(".").pop().replace(/[^a-zA-Z0-9]/g, "").toLowerCase()
    : "";

  const base = file.name.replace(/\.[^/.]+$/, "");

  const translitMap = {
    "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"zh","з":"z","и":"i","й":"y",
    "к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f",
    "х":"h","ц":"c","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"
  };

  let safeBase = base
    .toLowerCase()
    .split("")
    .map(ch => translitMap[ch] || ch)
    .join("")
    .replace(/[^a-zA-Z0-9_\- ]/g, "_")
    .replace(/\s+/g, "_")
    .replace(/_+/g, "_")
    .replace(/^_+|_+$/g, "");

  if(!safeBase){
    safeBase = "file";
  }

  const cleanName = safeBase + "_" + Date.now() + ext;
  const path = cleanName;

  const { error } = await client.storage
    .from(BUCKET)
    .upload(path, file, {
      cacheControl: "3600",
      upsert: true
    });

  if(error){
    setStatus("Ошибка загрузки: " + error.message);
    return;
  }

  fileInput.value = "";
  chosenFile.textContent = "Файл положен: " + cleanName;
  setStatus("Файл в бардачке.");
  loadFiles();
}

function openFile(name){
  const { data } = client.storage
    .from(BUCKET)
    .getPublicUrl(name);

  if(data && data.publicUrl){
    window.open(data.publicUrl, "_blank");
    setStatus("Открываю: " + name);
  }else{
    setStatus("Не удалось получить ссылку.");
  }
}

async function deleteFile(name){
  const ok = confirm("Убрать из бардачка файл?\n\n" + name);
  if(!ok) return;

  setStatus("Убираю файл...");

  const { error } = await client.storage
    .from(BUCKET)
    .remove([name]);

  if(error){
    setStatus("Ошибка удаления: " + error.message);
    return;
  }

  setStatus("Файл убран.");
  loadFiles();
}

loadFiles();
</script>
</body>
</html>
