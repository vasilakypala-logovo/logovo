ю), - бог с ним! я человек простой\".\n\nГородничий. Хорошо, хорошо, и дело ты говоришь. Там я тебе дал на чай, так\nвот еще сверх того на баранки.\n\nОсип. За что жалуете, ваше высокоблагородие? (Прячет деньги.) Разве уж\nвыпью за ваше здоровье.\n\nАнна Андреевна. Приходи, Осип, ко мне, тоже получишь.\n\nМарья Антоновна. Осип, душенька, поцелуй своего барина!\n\n\nСлышен из другой комнаты небольшой кашель Хлестакова.\n\nГородничий. Чш! (Поднимается на цыпочки; вся сцена вполголоса). Боже вас\nсохрани шуметь! Идите себе! полно уж вам...\n\nАнна Андреевна. Пойдем, Машенька! я тебе скажу, что я заметила у гостя\nтакое, что нам вдвоем только можно сказать.\n\nГородничий. О, уж там наговорят! Я думаю, поди только да послушай - и уши\nпотом заткнешь. (Обращаясь к Осипу.) Ну, друг...\n\n\nЯвление X\n\n\nТе же, Держиморда и Свистунов.\n\n\nГородничий. Чш! экие косолапые медведи - стучат сапогами! Так и валится,\nкак будто сорок пуд сбрасывает кто-нибудь с телеги! Где вас черт таскает?\n\nДержиморда. Был по приказанию...\n\nГородничий. Чш! (Закрывает ему рот.) Эк как каркнула ворона! (Дразнит его.)\nБыл по приказанию! Как из бочки, так рычит. (К Осипу.) Ну, друг, ты ступай\nприготовляй там, что нужно для барина. Все, что ни есть в доме, требуй.\n\n\nОсип уходит.\n\nГородничий. А вы - стоять на крыльце, и ни с места! И никого не пускать в\nдом стороннего, особенно купцов! Если хоть одного из них впустите, то...\nТолько увидите, что идет кто-нибудь с просьбою, а хоть и не с просьбою, да\nпохож на такого человека, что хочет подать на меня просьбу, взашей так\nпрямо и толкайте! так его! хорошенько! (Показывает ногою.) Слышите? Чш...\nчш... (Уходит на цыпочках вслед за квартальными.)"}, {"title": "Действие четвертое", "source": "gorewizor.txt.htm", "text": "* ДЕЙСТВИЕ ЧЕТВЕРТОЕ * \n\n\n                   Та же комната в доме городничего\n\n\nЯвление I\n\n\n Входят осторожно, почти на цыпочках: Аммос Федорович, Артемий Филиппович,\nпочтмейстер, Лука Лукич, Добчинский и Бобчинский, в полном параде и\nмундирах. Вся сцена происходит вполголоса.\n\n\nАммос Федорович (строит всех полукружием). Ради бога, господа, скорее в\nкружок, да побольше порядку! Бог с ним: и во дворец ездит, и\nгосударственный совет распекает! Стройтесь на военную ногу, непременно на\nвоенную ногу! Вы, Петр Иванович, забегите с этой стороны, а вы, Петр\nИванович, станьте вот тут.\n\n\nОба Петра Ивановича забегают на цыпочках.\n\nАртемий Филиппович. Воля ваша, Аммос Федорович, нам нужно бы кое-что\nпредпринять.\n\nАммос Федорович. А что именно?\n\nАртемий Филиппович. Ну, известно что.\n\nАммос Федорович. Подсунуть?\n\nАртемий Филиппович. Ну да, хоть и подсунуть.\n\nАммос Федорович. Опасно, черт возьми! раскричится: государственный человек.\nА разве в виде приношенья со стороны дворянства на какой-нибудь памятник?\n\nПочтмейстер. Или же: \"вот, мол, пришли по почте деньги, неизвестно кому\nпринадлежащие\".\n\nАртемий Филиппович. Смотрите, чтобы он вас по почте не отправил куды-нибудь\nподальше. Слушайте: эти дела так не делаются в благоустроенном государстве.\nЗачем нас здесь целый эскадрон? Представиться нужно поодиночке, да между\nчетырех глаз и того... как там следует - чтобы и уши не слыхали. Вот как в\nобществе благоустроенном делается! Ну, вот вы, Аммос Федорович, первый и\nначните.\n\nАммос Федорович. Так лучше ж вы: в вашем заведении высокий посетитель\nвкусил хлеба.\n\nАртемий Филиппович. Так уж лучше Луке Лукичу, как просветителю юношества.\n\nЛука Лукич. Не могу, не могу, господа. Я, признаюсь, так воспитан, что,\nзаговори со мною одним чином кто-нибудь повыше, у меня просто и души нет и\nязык как в грязь завязнул. Нет, господа, увольте, право увольте!\n\nАртемий Филиппович. Да, Аммос Федорович, кроме вас, некому. У вас что ни\nслово, то Цицерон с языка слетел.\n\nАммос Федорович. Что вы! что вы: Цицерон! Смотрите, что выдумали! Что иной\nраз увлечешься, говоря о домашней своре или гончей ищейке...\n\nВсе (пристают к нему.) Нет, вы не только о собаках, вы и о\nстолпотворении... Нет, Аммос Федорович, не оставляйте нас, будьте отцом\nнашим!.. Нет, Аммос Федорович!\n\nАммос Федорович. Отвяжитесь, господа!\n\n\nВ это время слышны шаги и откашливание в комнате Хлестакова. Все спешат\nнаперерыв к дверям, толпятся и стараются выйти, что происходит не без того,\nчтобы не притиснули кое-кого. Раздаются вполголоса восклицания:\n\nГолос Бобчинского. Ой, Петр Иванович, Петр Иванович! наступили на ногу!\n\nГолос Земляники. Отпустите, господа, хоть душу на покаяние - совсем\nприжали!\n\n\nВыхватываются несколько восклицаний: \"Ай! ай!\" - наконец все выпираются, и\nкомната остается пуста.\n\n\nЯвление II\n\n\n               Хлестаков один, выходит с заспанными глазами.\n\n\nЯ, кажется, всхрапнул порядком. Откуда они набрали таких тюфяков и перин?\nдаже вспотел. Кажется, они вчера мне подсунули чего-то за завтраком: в\nголове до сих пор стучит. Здесь, как я вижу, можно с приятностию проводить\nвремя. Я люблю радушие, и мне, признаюсь, больше нравится, если мне\nугождают от чистого сердца, а не то чтобы из интереса. А дочка городничего\nочень недурна, да и матушка такая, что еще можно бы... Нет, я не знаю, а\nмне, право, нравится, такая жизнь.\n\n\nЯвление III\n\n\n                       Хлестаков и Аммос Федорович.\n\n\nАммос Федорович (входя и останавливаясь, про себя.) Боже, боже! вынеси\nблагополучно; так вот коленки и ломает. (Вслух, вытянувшись и придерживая\nрукой шпагу.) Имею честь представиться: судья здешнего уездного суда,\nколлежский асессор Ляпкин-Тяпкин.\n\nХлестаков. Прошу садиться. Так вы здесь судья?\n\nАммос Федорович. С восемьсот шестнадцатого был избран на трехлетие по воле\nдворянства и продолжал должность до сего времени.\n\nХлестаков. А выгодно, однако же, быть судьею?\n\nАммос Федорович. За три трехлетия представлен к Владимиру четвертой степени\nс одобрения со стороны начальства. (В сторону.) А деньги в кулаке, да\nкулак-то весь в огне.\n\nХлестаков. А мне нравится Владимир. Вот Анна третьей степени уже не так.\n\nАммос Федорович (высовывая понемногу вперед сжатый кулак. В сторону.)\nГосподи боже! не знаю, где сижу. Точно горячие угли под тобою.\n\nХлестаков. Что это у вас в руке?\n\nАммос Федорович (потерявшись и роняя на пол ассигнации.) Ничего-с.\n\nХлестаков. Как ничего? Я вижу, деньги упали.\n\nАммос Федорович (дрожа всем телом.) Никак нет-с. (В сторону.) О боже, вот я\nуже и под судом! и тележку подвезли схватить меня!\n\nХлестаков (подымая.) Да, это деньги.\n\nАммос Федорович (в сторону.) Ну, все кончено - пропал! пропал!\n\nХлестаков. Знаете ли что? дайте их мне взаймы.\n\nАммос Федорович (поспешно.) Как же-с, как же-с... с большим удовольствием.\n(В сторону.) Ну, смелее, смелее! Вывози, пресвятая матерь!\n\nХлестаков. Я, знаете, в дороге издержался: то да се... Впрочем, я вам из\nдеревни сейчас их пришлю.\n\nАммос Федорович. Помилуйте, как можно! и без этого такая честь... Конечно,\nслабыми моими силами, рвением и усердием к начальству... постараюсь\nзаслужить... (Приподымается со стула, вытянувшись и руки по швам.) Не смею\nболее беспокоить своим присутствием. Не будет ли какого приказанья?\n\nХлестаков. Какого приказанья?\n\nАммос Федорович. Я разумею, не дадите ли какого приказанья здешнему\nуездному суду?\n\nХлестаков. Зачем же? Ведь мне никакой нет теперь в нем надобности.\n\nАммос Федорович (раскланиваясь и уходя, в сторону.) Ну, город наш!\n\nХлестаков (по уходе его.) Судья - хороший человек.\n\n\nЯвление IV\n\n\nХлестаков и почтмейстер, входит вытянувшись, в мундире, придерживая шпагу.\n\nПочтмейстер. Имею честь представиться: почтмейстер, надворный советник\nШпекин.\n\nХлестаков. А, милости просим. Я очень люблю приятное общество. Садитесь. Вы\nведь здесь всегда живете?\n\nПочтмейстер. Так точно-с.\n\nХлестаков. А мне нравится здешний городок. Конечно, не так многолюдно - ну\nчто ж? Ведь это не столица. Не правда ли, ведь это не столица?\n\nПочтмейстер. Совершенная правда.\n\nХлестаков. Ведь это только в столице бонтон и нет провинциальных гусей. Как\nваше мнение, не так ли?\n\nПочтмейстер. Так точно-с. (В сторону.) А он, однако ж, ничуть не горд; обо\nвсем расспрашивает.\n\nХлестаков. А ведь, однако ж, признайтесь, ведь и в маленьком городке можно\nпрожить счастливо?\n\nПочтмейстер. Так точно-с.\n\nХлестаков. По моему мнению, что нужно? Нужно только, чтобы тебя уважали,\nлюбили искренне, - не так ли?\n\nПочтмейстер. Совершенно справедливо.\n\nХлестаков. Я, признаюсь, рад, что вы одного мнения со мною. Меня, конечно,\nназовут странным, но уж у меня такой характер. (Глядя в глаза ему, говорит\nпро себя.) А попрошу-ка я у этого почтмейстера взаймы! (Вслух.) Какой\nстранный со мною случай: в дороге совершенно поиздержался. Не можете ли вы\nмне дать триста рублей взаймы?\n\nПочтмейстер. Почему же? почту за величайшее счастие. Вот-с, извольте. От\nдуши готов служить.\n\nХлестаков. Очень благодарен. А я, признаться, смерть не люблю отказывать\nсебе в дороге, да и к чему? Не так ли?\n\nПочтмейстер. Так точно-с. (Встает, вытягивается и придерживает шпагу.) Не\nсмея долее беспокоить своим присутствием... Не будет ли какого замечания по\nчасти почтового управления?\n\nХлестаков. Нет, ничего.\n\n\nПочтмейстер раскланивается и уходит.\n\n(Раскуривая сигарку.) Почтмейстер, мне кажется, тоже очень хороший человек.\nПо крайней мере, услужлив. Я люблю таких людей.\n\n\nЯвление V\n\n\n          Хлестаков и Лука Лукич, который почти выталкивается из дверей.\n        Сзади его слышен голос почти вслух: \"Чего робеешь?\"\n\n\nЛука Лукич (вытягиваясь не без трепета.) Имею честь представиться:\nсмотритель училищ, титулярный советник Хлопов.\n\nХлестаков. А, милости просим! Садитесь, садитесь. Не хотите ли сигарку?\n(Подает ему сигару.)\n\nЛука Лукич (про себя, в нерешимости.) Вот тебе раз! Уж этого никак не\nпредполагал. Брать или не брать?\n\nХлестаков. Возьмите, возьмите; это порядочная сигарка. Конечно, не то, что\nв Петербурге. Там, батюшка, я куривал сигарочки по двадцати пяти рублей\nсотенка, просто ручки потом себе поцелуешь, как выкуришь. Вот огонь,\nзакурите. (Подает ему свечу.)\n\n\nЛука Лукич пробует закурить и весь дрожит.\n\nДа не с того конца!\n\nЛука Лукич (от испуга выронил сигару, плюнул и, махнув рукою, про себя.)\nЧерт побери все! сгубила проклятая робость!\n\nХлестаков. Вы, как я вижу, не охотник до сигарок. А я признаюсь: это моя\nслабость. Вот еще насчет женского полу, никак не могу быть равнодушен. Как\nвы? Какие вам больше нравятся - брюнетки или блондинки?\n\n\nЛука Лукич находится в совершенном недоумении, что сказать.\n\nНет, скажите откровенно: брюнетки или блондинки?\n\nЛука Лукич. Не смею знать.\n\nХлестаков. Нет, нет, не отговаривайтесь! Мне хочется узнать непременно ваш\nвкус.\n\nЛука Лукич. Осмелюсь доложить... (В сторону.) Ну, и сам не знаю, что\nговорю.\n\nХлестаков. А! а! не хотите сказать. Верно, уж какая-нибудь брюнетка сделала\nвам маленькую загвоздочку. Признайтесь, сделала?\n\n\nЛука Лукич молчит.\n\nА! а! покраснели! Видите! видите! Отчего ж вы не говорите?\n\nЛука Лукич. Оробел, ваше бла... преос... сият... (В сторону.) Продал\nпроклятый язык, продал!\n\nХлестаков. Оробели? А в моих глазах точно есть что-то такое, что внушает\nробость. По крайней мере, я знаю, что ни одна женщина не может их\nвыдержать, не так ли?\n\nЛука Лукич. Так точно-с.\n\nХлестаков. Вот со мной престранный случай: в дороге совсем издержался. Не\nможете ли вы мне дать триста рублей взаймы?\n\nЛука Лукич (хватаясь за карманы, про себя). Вот те штука, если нет! Есть,\nесть! (Вынимает и, подает, дрожа, ассигнации.)\n\nХлестаков. Покорнейше благодарю.\n\nЛука Лукич (вытягиваясь и придерживая шпагу.) Не смею долее беспокоить\nприсутствием.\n\nХлестаков. Прощайте.\n\nЛука Лукич (летит вон почти бегом и говорит в сторону.) Ну, слава богу!\nавось не заглянет в классы!\n\n\nЯвление VI\n\n\nХлестаков и Артемий Филиппович, вытянувшись и придерживая шпагу.\n\nАртемий Филиппович. Имею честь представиться: попечитель богоугодных\nзаведений, надворный советник Земляника.\n\nХлестаков. Здравствуйте, прошу покорно садиться.\n\nАртемий Филиппович. Имел честь сопровождать вас и принимать лично во\nвверенных моему смотрению богоугодных заведениях.\n\nХлестаков. А, да! помню. Вы очень хорошо угостили завтраком.\n\nАртемий Филиппович. Рад стараться на службу отечеству.\n\nХлестаков. Я - признаюсь, это моя слабость, - люблю хорошую кухню. Скажите,\nпожалуйста, мне кажется, как будто бы вчера вы были немножко ниже ростом,\nне правда ли?\n\nАртемий Филиппович. Очень может быть. (Помолчав.) Могу сказать, что не\nжалею ничего и ревностно исполняю службу. (Придвигается ближе с своим\nстулом и говорит вполголоса.) Вот здешний почтмейстер совершенно ничего не\nделает: все дела в большом запущении, посылки задерживаются... извольте\nсами нарочно разыскать. Судья тоже, который только что был перед моим\nприходом, ездит только за зайцами, в присутственных местах держит собак и\nповедения, если признаться пред вами, - конечно, для пользы отечества я\nдолжен это сделать, хотя он мне родня и приятель, - поведения самого\nпредосудительного. Здесь есть один помещик, Добчинский, которого вы\nизволили видеть; и как только этот Добчинский куда-нибудь выйдет из дому,\nто он там уж и сидит у жены его, я присягнуть готов... И нарочно посмотрите\nна детей: ни одно из них не похоже на Добчинского, но все, даже девочка\nмаленькая, как вылитый судья.\n\nХлестаков. Скажите пожалуйста! а я никак этого не думал.\n\nАртемий Филиппович. Вот и смотритель здешнего училища... Я не знаю, как\nмогло начальство поверить ему такую должность: он хуже, чем якобинец, и\nтакие внушает юношеству неблагонамеренные правила, что даже выразить\nтрудно. Не прикажете ли, я все это изложу лучше на бумаге?\n\nХлестаков. Хорошо, хоть на бумаге. Мне очень будет приятно. Я, знаете, этак\nлюблю в скучное время прочесть что-нибудь забавное... Как ваша фамилия? я\nвсе позабываю.\n\nАртемий Филиппович. Земляника.\n\nХлестаков. А, да! Земляника. И что ж, скажите, пожалуйста, есть ли у вас\nдетки?\n\nАртемий Филиппович. Как же-с, пятеро; двое уже взрослых.\n\nХлестаков. Скажите, взрослых! А как они... как они того?..\n\nАртемий Филиппович. То есть не изволите ли вы спрашивать, как их зовут?\n\nХлестаков. Да, как их зовут?\n\nАртемий Филиппович. Николай, Иван, Елизавета, Марья и Перепетуя.\n\nХлестаков. Это хорошо.\n\nАртемий Филиппович. Не смея беспокоить своим присутствием, отнимать время,\nопределенного на священные обязанности... (Раскланивается с тем, чтобы\nуйти.)\n\nХлестаков (провожая.) Нет, ничего. Это все очень смешно, что вы говорили.\nПожалуйста, и в другое тоже время... Я это очень люблю. (Возвращается и,\nотворивши дверь, кричит вслед ему.) Эй, вы! как вас? я все позабываю, как\nваше имя и отчество.\n\nАртемий Филиппович. Артемий Филиппович.\n\nХлестаков. Сделайте милость, Артемий Филиппович, со мной странный случай: в\nдороге совершенно поиздержался. Нет ли у вас взаймы денег - рублей\nчетыреста?\n\nАртемий Филиппович. Есть.\n\nХлестаков. Скажите, как кстати. Покорнейше вас благодарю.\n\n\nЯвление VII\n\n\n                    Хлестаков, Бобчинский и Добчинский.\n\n\nБобчинский. Имею честь представиться: житель здешнего города, Петр Иванов\nсын Бобчинский.\n\nДобчинский. Помещик Петр Иванов сын Добчинский.\n\nХлестаков. А, да я уж вас видел. Вы, кажется, тогда упали? Что, как ваш\nнос?\n\nБобчинский. Слава богу! не извольте беспокоиться: присох, теперь совсем\nприсох.\n\nХлестаков. Хорошо, что присох. Я рад... (Вдруг и отрывисто.) Денег нет у\nвас?\n\nБобчинский. Денег? как денег?\n\nХлестаков (громко и скоро). Взаймы рублей тысячу.\n\nБобчинский. Такой суммы, ей-богу, нет. А нет ли у вас, Петр Иванович?\n\nДобчинский. При мне-с не имеется, потому что деньги мои, если изволите\nзнать, положены в приказ общественного призрения.\n\nХлестаков. Да, ну если тысячи нет, так рублей сто.\n\nБобчинский (шаря в карманах). У вас, Петр Иванович, нет ста рублей? У меня\nвсего сорок ассигнациями.\n\nДобчинский. (смотря в бумажник.) Двадцать пять рублей всего.\n\nБобчинский. Да вы поищите-то получше, Петр Иванович! У вас там, я знаю, в\nкармане-то с правой стороны прореха, так в прореху-то, верно, как-нибудь\nзапали.\n\nДобчинский. Нет, право, и в прорехе нет.\n\nХлестаков. Ну, все равно. Я ведь только так. Хорошо, пусть будет шестьдесят\nпять рублей. Это все равно. (Принимает деньги.)\n\nДобчинский. Я осмеливаюсь попросить вас относительно одного очень тонкого\nобстоятельства.\n\nХлестаков. А что это?\n\nДобчинский. Дело очень тонкого свойства-с: старший-то сын мой, изволите\nвидеть, рожден мною еще до брака.\n\nХлестаков. Да?\n\nДобчинский. То есть оно только так говорится, а он рожден мною так\nсовершенно, как бы и в браке, и все это, как следует, я завершил потом\nзаконными-с узами супружества-с. Так я, изволите видеть, хочу, чтоб он\nтеперь уже был совсем, то есть, законным моим сыном-с и назывался бы так,\nкак я: Добчинский-с.\n\nХлестаков. Хорошо, пусть называется! Это можно.\n\nДобчинский. Я бы и не беспокоил вас, да жаль насчет способностей.\nМальчишка-то этакой... большие надежды подает: наизусть стихи расскажет и,\nесли где попадется ножик, сейчас сделает маленькие дрожечки так искусно,\nкак фокусник-с. Вот и Петр Иванович знает.\n\nБобчинский. Да, большие способности имеет.\n\nХлестаков. Хорошо, хорошо! Я об этом постараюсь, я буду говорить... я\nнадеюсь... все это будет сделано, да, да... (Обращаясь к Бобчинскому.) Не\nимеете ли и вы чего-нибудь сказать мне?\n\nБобчинский. Как же, имею очень нижайшую просьбу.\n\nХлестаков. А что, о чем?\n\nБобчинский. Я прошу вас покорнейше, как поедете в Петербург, скажите всем\nтам вельможам разным: сенаторам и адмиралам, что вот, ваше сиятельство,\nживет в таком-то городе Петр Иванович Бобчинский. Так и скажите: живет Петр\nИванович Бобчинский.\n\nХлестаков. Очень хорошо.\n\nБобчинский. Да если этак и государю придется, то скажите и государю, что\nвот, мол, ваше императорское величество, в таком-то городе живет Петр\nИванович Бобчинский.\n\nХлестаков. Очень хорошо.\n\nДобчинский. Извините, что так утрудили вас своим присутствием.\n\nБобчинский. Извините, что так утрудили вас своим присутствием.\n\nХлестаков. Ничего, ничего! Мне очень приятно. (Выпроваживает их.)\n\n\nЯвление VIII\n\n\n                              Хлестаков один.\n\n\nЗдесь много чиновников. Мне кажется, однако ж, что они меня принимаю за\nгосударственного человека. Верно, я вчера им подпустил пыли. Экое дурачье!\nНапишу-ку я обо всем в Петербург к Тряпичкину: он пописывает статейки -\nпусть-ка он их общелкает хорошенько. Эй, Осип, подай мне бумагу и чернила!\n\n\nОсип выглянул из дверей, произнесши: \"Сейчас\".\n\nА уж Тряпичкину, точно, если кто попадет на зубок, - берегись: отца родного\nне пощадит для словца, и деньгу тоже любит. Впрочем, чиновники эти добрые\nлюди; это с их стороны хорошая черта, что они мне дали взаймы. Пересмотрю\nнарочно, сколько у меня денег. Это от судьи триста; это от почтмейстера\nтриста, шестьсот, семьсот, восемьсот... Какая замасленная бумажка!\nВосемьсот, девятьсот... Ого! За тысячу перевалило... Ну-ка, теперь,\nкапитан, ну-ка, попадись-ка ты мне теперь! Посмотрим, кто кого!\n\n\nЯвление IX\n\n\n                  Хлестаков и Осип с чернилами и бумагою.\n\n\nХлестаков. Ну что, видишь, дурак, как меня угощают и принимают? (Начинает\nписать.)\n\nОсип. Да, слава богу! Только знаете что, Иван Александрович?\n\nХлестаков (пишет). А что?\n\nОсип. Уезжайте отсюда. Ей-богу, уже пора.\n\nХлестаков (пишет). Вот вздор! Зачем?\n\nОсип. Да так. Бог с ними со всеми! Погуляли здесь два денька - ну и\nдовольно. Что с ними долго связываться? Плюньте на них! не ровен час,\nкакой-нибудь другой наедет... ей-богу, Иван Александрович! А лошади тут\nславные - так бы закатили!..\n\nХлестаков (пишет). Нет, мне еще хочется пожить здесь. Пусть завтра.\n\nОсип. Да что завтра! Ей-богу, поедем, Иван Александрович! Оно хоть и\nбольшая честь вам, да все, знаете, лучше уехать скорее: ведь вас, право, за\nкого-то другого приняли... И батюшка будет гневаться, что так замешкались.\nТак бы, право, закатили славно! А лошадей бы важных здесь дали.\n\nХлестаков (пишет). Ну, хорошо. Отнеси только наперед это письмо; пожалуй,\nвместе и подорожную возьми. Да зато, смотри, чтоб лошади хорошие были!\nЯмщикам скажи, что я буду давать по целковому; чтобы так, как фельдъегеря,\nкатили и песни бы пели!.. (Продолжает писать.) Воображаю, Тряпичкин умрет\nсо смеху...\n\nОсип. Я, сударь, отправлю его с человеком здешним, а сам лучше буду\nукладываться, чтоб не прошло понапрасну время.\n\nХлестаков (пишет). Хорошо. Принеси только свечу.\n\nОсип (выходит и говорит за сценой.) Эй, послушай, брат! Отнесешь письмо на\nпочту, и скажи почтмейстеру, чтоб он принял без денег; да скажи, чтоб\nсейчас привели к барину самую лучшую тройку, курьерскую; а прогону, скажи,\nбарин не плотит: прогон, мол, скажи, казенный. Да чтоб все живее, а не то,\nмол, барин сердится. Стой, еще письмо не готово.\n\nХлестаков (продолжает писать). Любопытно знать, где он теперь живет - в\nПочтамтской или Гороховой? Он ведь тоже любит часто переезжать с квартиры\nна квартиру и недоплачивать. Напишу наудалую в Почтамтскую. (Свертывает и\nнадписывает.)\n\n\nОсип приносит свечу. Хлестаков печатает. В это время слышен голос\nДержиморды: \"Куда лезешь, борода? Говорят тебе, никого не велено пускать\".\n\n(Дает Осипу письмо.) На, отнеси.\n\nГолоса купцов. Допустите, батюшка! Вы не можете не допустить: мы за делом\nпришли.\n\nГолос Держиморды. Пошел, пошел! Не принимает, спит.\n\nШум увеличивается.\n\nЧто там такое, Осип? Посмотри, что за шум.\n\nОсип (глядя в окно.) Купцы какие-то хотят войти, да не допускает\nквартальный. Машут бумагами: верно, вас хотят видеть.\n\nХлестаков (подходя к окну.) А что вы, любезные?\n\nГолоса купцов. К твоей милости, прибегаем. Прикажи, государь, просьбу\nпринять.\n\nХлестаков. Впустите их, впустите! пусть идут. Осип, скажи им: пусть идут.\n\n\nОсип уходит.\n\n(Принимает из окна просьбы, развертывает одну из них и читает:) \"Его\nвысокоблагородному светлости господину финансову от купца Абдулина...\" Черт\nзнает что: и чина такого нет!\n\n\nЯвление X\n\n\n          Хлестаков и купцы с кузовом вина и сахарными головами.\n\n\nХлестаков. А что вы, любезные?\n\nКупцы. Челом бьем вашей милости!\n\nХлестаков. А что вам угодно?\n\nКупцы. Не погуби, государь! Обижательство терпим совсем понапрасну.\n\nХлестаков. От кого?\n\nОдин из купцов. Да все от городничего здешнего. Такого городничего никогда\nеще, государь, не было. Такие обиды чинит, что описать нельзя. Постоем\nсовсем заморил, хоть в петлю полезай. Не по поступкам поступает. Схватит за\nбороду, говорит: \"Ах ты, татарин!\" Ей-богу! Если бы, то есть, чем-нибудь не\nуважили его, а то мы уж порядок всегда исполняем: что следует на платья\nсупружнице его и дочке - мы против этого не стоим. Нет, вишь ты, ему всего\nэтого мало - ей-ей! Придет в лавку и, что ни попадет, все берет. Сукна\nувидит штуку, говорит: \"Э, милый, это хорошее суконце: снеси-ка его ко\nмне\". Ну и несешь, а в штуке-то будет без мала аршин пятьдесят.\n\nХлестаков. Неужели? Ах, какой же он мошенник!\n\nКупцы. Ей-богу! такого никто не запомнит городничего. Так все и\nприпрятываешь в лавке, когда его завидишь. То есть, не то уж говоря, чтоб\nкакую деликатность, всякую дрянь берет: чернослив такой, что лет уже по\nсеми лежит в бочке, что у меня сиделец не будет есть, а он целую горсть\nтуда запустит. Именины его бывают на Антона, и уж, кажись, всего нанесешь,\nни в чем не нуждается; нет, ему еще подавай: говорит, и на Онуфрия его\nименины.\n\nХлестаков. Да это просто разбойник!\n\nКупцы. Ей-ей! А попробуй прекословить, наведет к тебе в дом целый полк на\nпостой. А если что, велит запереть двери. \"Я тебя, говорит, не буду,\nговорит, подвергать телесному наказанию или пыткой пытать - это, говорит,\nзапрещено законом, а вот ты у меня, любезный, поешь селедки!\"\n\nХлестаков. Ах, какой мошенник! Да за это просто в Сибирь.\n\nКупцы. Да уж куда милость твоя не запровадит его, все будет хорошо, лишь\nбы, то есть, от нас подальше. Не побрезгай, отец наш, хлебом и солью:\nкланяемся тебе сахарком и кузовком вина.\n\nХлестаков. Нет, вы этого не думайте: я не беру совсем никаких взяток. Вот\nесли бы вы, например, предложили мне взаймы рублей триста - ну, тогда\nсовсем дело другое: взаймы я могу взять.\n\nКупцы. Изволь, отец наш! (Вынимают деньги.) Да что триста! Уж лучше пятьсот\nвозьми, помоги только.\n\nХлестаков. Извольте: взаймы - я ни слова, я возьму.\n\nКупцы (подносят ему на серебряном подносе деньги.) Уж, пожалуйста, и\nподносит вместе возьмите.\n\nХлестаков. Ну, и подносик можно.\n\nКупцы (кланяясь). Так уж возьмите за одним разом и сахарцу.\n\nХлестаков. О нет, я взяток никаких...\n\nОсип. Ваше высокоблагородие! зачем вы не берете? Возьмите! в дороге все\nпригодится. Давай сюда головы и кулек! Подавай все! все пойдет впрок. Что\nтам? веревочка? Давай и веревочку, - и веревочка в дороге пригодится:\nтележка обломается или что другое, подвязать можно.\n\nКупцы. Так уж сделайте такую милость, ваше сиятельство. Если уже вы, то\nесть, не поможете в нашей просьбе, то уж не знаем, как и быть: просто хоть\nв петлю полезай.\n\nХлестаков. Непременно, непременно! Я постараюсь.\n\n\nКупцы уходят. Слышен голос женщины: \"Нет, ты не смеешь не допустить меня! Я\nна тебя нажалуюсь ему самому. Ты не толкайся так больно!\"\n\nКто там? (Подходит к окну.) А, что ты, матушка?\n\nГолоса двух женщин. Милости твоей, отец, прошу! Повели, государь,\nвыслушать!\n\nХлестаков (в окно). Пропустить ее.\n\n\nЯвление XI\n\n\n                   Хлестаков, слесарша и унтер-офицерша.\n\n\nСлесарша (кланяясь в ноги). Милости прошу...\n\nУнтер-офицерша. Милости прошу...\n\nХлестаков. Да что вы за женщины?\n\nУнтер-офицерша. Унтер-офицерская жена Иванова.\n\nСлесарша. Слесарша, здешняя мещанка, Февронья Петрова Пошлепкина, отец\nмой...\n\nХлестаков. Стой, говори прежде одна. Что тебе нужно?\n\nСлесарша. Милости прошу: на городничего челом бью! Пошли ему бог всякое\nзло! Что ни детям его, ни ему, мошеннику, ни дядьям, ни теткам его ни в чем\nникакого прибытку не было!\n\nХлестаков. А что?\n\nСлесарша. Да мужу-то моему приказал забрить лоб в солдаты, и очередь-то на\nнас не припадала, мошенник такой! да и по закону нельзя: он женатый.\n\nХлестаков. Как же он мог это сделать?\n\nСлесарша. Сделал мошенник, сделал - побей бог его на том и на этом свете!\nЧтобы ему, если и тетка есть, то и тетке всякая пакость, и отец если жив у\nнего, то чтоб и он, каналья, околел или поперхнулся навеки, мошенник такой!\nСледовало взять сына портного, он же и пьянюшка был, да родители богатый\nподарок дали, так он и присыкнулся к сыну купчихи Пантелеевой, а Пантелеева\nтоже подослала к супруге полотна три штуки; так он ко мне. \"На что,\nговорит, тебе муж? он уж тебе не годится\". Да я-то знаю - годится или не\nгодится; это мое дело, мошенник такой! \"Он, говорит, вор; хоть он теперь и\nне украл, да все равно, говорит, он украдет, его и без того на следующий\nгод возьмут в рекруты\". Да мне-то каково без мужа, мошенник такой! Я слабый\nчеловек, подлец ты такой! Чтоб всей родне твоей не довелось видеть света\nбожьего! А если есть теща, то чтоб и теще...\n\nХлестаков. Хорошо, хорошо. Ну, а ты? (Выпровожает старуху.)\n\nСлесарша (уходя.) Не позабудь, отец наш! будь милостив!\n\nУнтер-офицерша. На городничего, батюшка, пришла...\n\nХлестаков. Ну, да что, зачем? говори в коротких словах.\n\nУнтер-офицерша. Высек, батюшка!\n\nХлестаков. Как?\n\nУнтер-офицерша. По ошибке, отец мой! Бабы-то наши задрались на рынке, а\nполиция не подоспела да схвати меня. Да так отрапортовали: два дни сидеть\nне могла.\n\nХлестаков. Так что ж теперь делать?\n\nУнтер-офицерша. Да делать-то, конечно, нечего. А за ошибку-то повели ему\nзаплатить штрафт. Мне от своего счастья неча отказываться, а деньги бы мне\nтеперь очень пригодились.\n\nХлестаков. Хорошо, хорошо. Ступайте, ступайте! я распоряжусь.\n\n\nВ окно высовываются руки с просьбами.\n\nДа кто там еще? (Подходит к окну.) Не хочу, не хочу! Не нужно, не нужно!\n(Отходя.) Надоели, черт возьми! Не впускай, Осип!\n\nОсип (кричит в окно). Пошли, пошли! Не время, завтра приходите!\n\n\nДверь отворяется, и выставляется какая-то фигура во фризовой шинели, с\nнебритою бородою, раздутою губою и перевязанной щекою; за нею в перспективе\nпоказывается несколько других.\n\nПошел, пошел! чего лезешь? (Упирается первому руками в брюхо и выпирается\nвместе с ним в прихожую, захлопнув за собою дверь.)\n\n\nЯвление XII\n\n\n                       Хлестаков и Марья Антоновна.\n\n\nМарья Антоновна. Ах!\n\nХлестаков. Отчего вы так испугались, сударыня?\n\nМарья Антоновна. Нет, я не испугалась.\n\nХлестаков (рисуется.) Помилуйте, сударыня, мне очень приятно, что вы меня\nприняли за такого человека, который... Осмелюсь ли спросить вас: куда вы\nнамерены были идти?\n\nМарья Антоновна. Право, я никуда не шла.\n\nХлестаков. Отчего же, например, вы никуда не шли?\n\nМарья Антоновна. Я думала, не здесь ли маменька...\n\nХлестаков. Нет, мне хотелось бы знать, отчего вы никуда не шли?\n\nМарья Антоновна. Я вам помешала. Вы занимались важными делами.\n\nХлестаков (рисуется.) А ваши глаза лучше, нежели важные дела... Вы никак не\nможете мне помешать, никаким образом не можете; напротив того, вы можете\nпринести удовольствие.\n\nМарья Антоновна. Вы говорите по-столичному.\n\nХлестаков. Для такой прекрасной особы, как вы. Осмелюсь ли быть так\nсчастлив, чтобы предложить вам стул? но нет, вам должно не стул, а трон.\n\nМарья Антоновна. Право, я не знаю... мне так нужно было идти. (Села.)\n\nХлестаков. Какой у вас прекрасный платочек!\n\nМарья Антоновна. Вы насмешники, лишь бы только посмеяться над\nпровинциальными.\n\nХлестаков. Как бы я желал, сударыня, быть вашим платочком, чтобы обнимать\nвашу лилейную шейку.\n\nМарья Антоновна. Я совсем не понимаю, о чем вы говорите: какой-то\nплаточек... Сегодня какая странная погода!\n\nХлестаков. А ваши губки, сударыня, лучше, нежели всякая погода.\n\nМарья Антоновна. Вы все эдакое говорите... Я бы вас попросила, чтоб вы мне\nнаписали лучше на память какие-нибудь стишки в альбом. Вы, верно, их знаете\nмного.\n\nХлестаков. Для вас, сударыня, все что хотите. Требуйте, какие стихи вам?\n\nМарья Антоновна. Какие-нибудь эдакие - хорошие, новые.\n\nХлестаков. Да что стихи! я много их знаю.\n\nМарья Антоновна. Ну, скажите же, какие же вы мне напишете?\n\nХлестаков. Да к чему же говорить? я и без того их знаю.\n\nМарья Антоновна. Я очень люблю их...\n\nХлестаков. Да у меня много их всяких. Ну, пожалуй, я вам хоть это: \"О ты,\nчто в горести напрасно на бога ропщешь, человек!..\" Ну и другие... теперь\nне могу припомнить; впрочем, это все ничего. Я вам лучше вместо этого\nпредставлю мою любовь, которая от вашего взгляда... (Придвигая стул.)\n\nМарья Антоновна. Любовь! Я не понимаю любовь... я никогда и не знала, что\nза любовь... (Отодвигая стул.)\n\nХлестаков (придвигая стул). Отчего ж вы отдвигаете свой стул? Нам лучше\nбудет сидеть близко друг к другу.\n\nМарья Антоновна (отдвигаясь). Для чего ж близко? все равно и далеко.\n\nХлестаков (придвигаясь). Отчего ж далеко? все равно и близко\n\nМарья Антоновна (отдвигается). Да к чему ж это?\n\nХлестаков (придвигаясь). Да ведь вам только кажется, что близко; а вы\nвообразите себе, что далеко. Как бы я был счастлив, сударыня, если б мог\nприжать вас в свои объятия.\n\nМарья Антоновна (смотрит в окно). Что это там как будто бы полетело? Сорока\nили какая другая птица?\n\nХлестаков (целует ее в плечо и смотрит в окно.) Это сорока.\n\nМарья Антоновна (встает в негодовании.) Нет, это уж слишком... Наглость\nтакая!..\n\nХлестаков (удерживая ее). Простите, сударыня, я это сделал от любви, точно\nот любви.\n\nМарья Антоновна. Вы почитаете меня за такую провинциалку... (Силится уйти.)\n\nХлестаков (продолжая удерживать ее.) Из любви, право, из любви. Я так\nтолько, пошутил, Марья Антоновна, не сердитесь! Я готов на коленках просить\nу вас прощения. (Падает на колени.) Простите же, простите! Вы видите, я на\nколенях.\n\n\nЯвление XIII\n\n\n                          Те же и Анна Андреевна.\n\n\nАнна Андреевна (увидев Хлестакова на коленях). Ах, какой пассаж!\n\nХлестаков (вставая) А, черт возьми!\n\nАнна Андреевна (дочери). Это что значит, сударыня! Это что за поступки\nтакие?\n\nМарья Антоновна. Я, маменька...\n\nАнна Андреевна. Поди прочь отсюда! слышишь: прочь, прочь! И не смей\nпоказываться на глаза.\n\n\nМарья Антоновна уходит в слезах.\n\nАнна Андреевна. Извините, я, признаюсь, приведена в такое изумление...\n\nХлестаков (в сторону). А она тоже очень аппетитна, очень недурна.\n(Бросается на колени.) Сударыня, вы видите, я сгораю от любви.\n\nАнна Андреевна. Как, вы на коленях? Ах, встаньте, встаньте! здесь пол\nсовсем нечист.\n\nХлестаков Нет, на коленях, непременно на коленях! Я хочу знать, что такое\nмне суждено: жизнь или смерть.\n\nАнна Андреевна. Но позвольте, я еще не понимаю вполне значения слов. Если\nне ошибаюсь, вы делаете декларацию насчет моей дочери?\n\nХлестаков Нет, я влюблен в вас. Жизнь моя на волоске. Если вы не увенчаете\nпостоянную любовь мою, то я недостоин земного существования. С пламенем в\nгруди прошу руки вашей.\n\nАнна Андреевна. Но позвольте заметить: я в некотором роде... я замужем.\n\nХлестаков Это ничего! Для любви нет различия; и Карамзин сказал: \"Законы\nосуждают\". Мы удалимся под сень струй... Руки вашей, руки прошу!\n\n\nЯвление XIV\n\n\n                  Те же и Марья Антоновна, вдруг вбегает.\n\n\nМарья Антоновна. Маменька, папенька сказал, чтобы вы... (Увидя Хлестакова\nна коленях, вскрикивает.) Ах, какой пассаж!\n\nАнна Андреевна. Ну что ты? к чему? зачем? Что за ветреность такая! Вдруг\nвбежала, как угорелая кошка. Ну что ты нашла такого удивительного? Ну что\nтебе вздумалось? Право, как дитя какое-нибудь трехлетнее. Не похоже, не\nпохоже, совершенно не похоже на то, чтобы ей было восемнадцать лет. Я не\nзнаю, когда ты будешь благоразумнее, когда ты будешь вести себя, как\nприлично благовоспитанной девице; когда ты будешь знать, что такое хорошие\nправила и солидность в поступках.\n\nМарья Антоновна (сквозь слезы). Я, право, маменька, не знала...\n\nАнна Андреевна. У тебя вечно какой-то сквозной ветер разгуливает в голове;\nты берешь пример с дочерей Ляпкина-Тяпкина. Что тебе глядеть на них? не\nнужно тебе глядеть на них. Тебе есть примеры другие - перед тобою мать\nтвоя. Вот каким примерам ты должна следовать.\n\nХлестаков (схватывая за руку дочь). Анна Андреевна, не противьтесь нашему\nблагополучию, благословите постоянную любовь!\n\nАнна Андреевна (с изумлением). Так вы в нее?..\n\nХлестаков. Решите: жизнь или смерть?\n\nАнна Андреевна. Ну вот видишь, дура, ну вот видишь: из-за тебя, этакой\nдряни, гость изволил стоять на коленях; а ты вдруг вбежала как сумасшедшая.\nНу вот, право, стоит, чтобы я нарочно отказала: ты недостойна такого\nсчастия.\n\nМарья Антоновна. Не буду, маменька. Право, вперед не буду.\n\n\nЯвление XV\n\n\n                       Те же и городничий впопыхах.\n\n\nГородничий. Ваше превосходительство! не погубите! не погубите!\n\nХлестаков. Что с вами?\n\nГородничий. Там купцы жаловались вашему превосходительству. Честью уверяю,\nи наполовину нет того, что они говорят. Они сами обманывают и обмеривают\nнарод. Унтер-офицерша налгала вам, будто бы я ее высек; она врет, ей-богу,\nврет. Она сама себя высекла.\n\nХлестаков. Провались унтер-офицерша - мне не до нее!\n\nГородничий. Не верьте, не верьте! Это такие лгуны... им вот эдакой ребенок\nне поверит. Они уж и всему городу известны за лгунов. А насчет\nмошенничества, осмелюсь доложить: это такие мошенники, каких свет не\nпроизводил.\n\nАнна Андреевна. Знаешь ли ты, какой чести удостоивает нас Иван\nАлександрович? Он просит руки нашей дочери.\n\nГородничий. Куда! куда!.. Рехнулась, матушка! Не извольте гневаться, ваше\nпревосходительство: она немного с придурью, такова же была и мать ее.\n\nХлестаков. Да, я точно прошу руки. Я влюблен.\n\nГородничий. Не могу верить, ваше превосходительство!\n\nАнна Андреевна. Да когда говорят тебе?\n\nХлестаков. Я не шутя вам говорю... Я могу от любви свихнуть с ума.\n\nГородничий. Не смею верить, не достоин такой чести.\n\nХлестаков. Да, если вы не согласитесь отдать руки Марьи Антоновны, то я\nчерт знает что готов...\n\nГородничий. Не могу верить: изволите шутить, ваше превосходительство!\n\nАнна Андреевна. Ах, какой чурбан в самом деле! Ну, когда тебе толкуют?\n\nГородничий. Не могу верить.\n\nХлестаков. Отдайте, отдайте! Я отчаянный человек, я решусь на все: когда\nзастрелюсь, вас под суд отдадут.\n\nГородничий. Ах, боже мой! Я, ей-ей, не виноват ни душою, ни телом. Не\nизвольте гневаться! Извольте поступать так, как вашей милости угодно! У\nменя, право, в голове теперь... я и сам не знаю, что делается. Такой дурак\nтеперь сделался, каким еще никогда не бывал.\n\nАнна Андреевна. Ну, благословляй!\n\n\nХлестаков подходит с Марьей Антоновной.\n\nГородничий. Да благословит вас бог, а я не виноват.\n\n\nХлестаков целуется с Марьей Антоновной. Городничий смотрит на них.\n\nЧто за черт! в самом деле! (Протирает глаза.) Целуются! Ах, батюшки,\nцелуются! Точный жених! (Вскрикивает, подпрыгивая от радости.) Ай, Антон!\nАй, Антон! Ай,городничий! Вона, как дело-то пошло!\n\n\nЯвление XVI\n\n\n                               Те же и Осип.\n\n\nОсип.Лошади готовы.\n\nХлестаков. А, хорошо... я сейчас.\n\nГородничий. Как-с? Изволите ехать?\n\nХлестаков. Да, еду.\n\nГородничий. А когда же, то есть... вы изволили сами намекнуть насчет,\nкажется, свадьбы?\n\nХлестаков. А это... На одну минуту только... на один день к дяде - богатый\nстарик; а завтра же и назад.\n\nГородничий. Не смеем никак удерживать, в надежде благополучного\nвозвращения.\n\nХлестаков. Как же, как же, я вдруг. Прощайте, любовь моя... нет, просто не\nмогу выразить! Прощайте, душенька! (Целует ее ручку.)\n\nГородничий. Да не нужно ли вам в дорогу чего-нибудь? Вы изволили, кажется,\nнуждаться в деньгах?\n\nХлестаков. О нет, к чему это? (Немного подумав.) А впрочем, пожалуй.\n\nГородничий. Сколько угодно вам?\n\nХлестаков. Да вот тогда вы дали двести, то есть не двести, а четыреста, - я\nне хочу воспользоваться вашею ошибкою, - так, пожалуй, и теперь столько же,\nчтобы уже ровно было восемьсот.\n\nГородничий. Сейчас! (Вынимает из бумажника.) Еще, как нарочно, самыми\nновенькими бумажками.\n\nХлестаков. А, да! (Берет и рассматривает ассигнации.) Это хорошо. Ведь это,\nговорят, новое счастье, когда новенькими бумажками.\n\nГородничий. Так точно-с.\n\nХлестаков. Прощайте, Антон Антонович! Очень обязан за ваше гостеприимство.\nЯ признаюсь от всего сердца: мне нигде не было такого хорошего приема.\nПрощайте, Анна Андреевна! Прощайте, моя душенька Марья Антоновна!\n\n\nВыходят. За сценой:\n\nГолос Хлестакова. Прощайте, ангел души моей Марья Антоновна!\n\nГолос городничего. Как же это вы? прямо так на перекладной и едете?\n\nГолос Хлестакова. Да, я привык уж так. У меня голова болит от рессор.\n\nГолос ямщика. Тпр...\n\nГолос городничего. Так, по крайней мере, чем-нибудь застлать, хотя бы\nковриком. Не прикажете ли, я велю подать коврик?\n\nГолос Хлестакова. Нет, зачем? это пустое; а впрочем, пожалуй, пусть дают\nковрик.\n\nГолос городничего. Эй, Авдотья! ступай в кладовую, вынь ковер самый лучший\n- что по голубому полю, персидский. Скорей!\n\nГолос ямщика. Тпр...\n\nГолос городничего. Когда же прикажете ожидать вас?\n\nГолос Хлестакова. Завтра или послезавтра.\n\nГолоса Осипа. А, это ковер? давай его сюда, клади вот так! Теперь давай-ка\nс этой стороны сена.\n\nГолос ямщика. Тпр...\n\nГолоса Осипа. Вот с этой стороны! сюда! еще! хорошо. Славно будет. (Бьет\nрукою по ковру.) Теперь садитесь, ваше благородие!\n\nГолос Хлестакова. Прощайте, Антон Антонович!\n\nГолос городничего. Прощайте, ваше превосходительство!\n\nЖенские голоса. Прощайте, Иван Александрович!\n\nГолос Хлестакова. Прощайте, маменька!\n\nГолос ямщика. Эй вы, залетные!\n\n\nКолокольчик звенит. Занавес опускается."}, {"title": "Действие пятое", "source": "gorewizor.txt.htm", "text": "* ДЕЙСТВИЕ ПЯТОЕ * \n\n\n                               Та же комната\n\n\nЯвление I\n\n\n               Городничий,Анна Андреевна и Марья Антоновна.\n\n\nГородничий. Что, Анна Андреевна? а? Думала ли ты что-нибудь об этом? Этой\nбогатый приз, канальство! Ну, признайся откровенно: тебе и во сне не\nвиделось - просто из какой-нибудь городничихи и вдруг... фу ты,\nканальство!..с каким дьяволом породнилась!\n\nАнна Андреевна. Совсем нет; я давно это знала. Это тебе в диковинку, потому\nчто ты простой человек, никогда не видел порядочных людей.\n\nГородничий. Я сам, матушка, порядочный человек. Однако ж, право, как\nподумаешь, Анна Андреевна, какие мы с тобой теперь птицы сделались! а, Анна\nАндреевна? Высокого полета, черт побери! Постой же, теперь я задам перцу\nвсе этим охотникам подавать просьбы и доносы. Эй, кто там?\n\n\nВходит квартальный.\n\nА, это ты, Иван Карпович! Призови-ка сюда, брат, купцов! Вот я их, каналий!\nТак жаловаться на меня? Вишь ты, проклятый иудейский народ! Постойте ж,\nголубчики! Прежде я вас кормил до усов только, а теперь накормлю до бороды.\nЗапиши всех, кто только ходил бить челом на меня, и вот этих больше всего\nписак, писак, которые закручивали им просьбы. Да объяви всем, чтоб знали:\nчто вот, дискать, какую честь бог послал городничему, - что выдает дочь\nсвою не то чтобы за какого-нибудь простого человека, а за такого, что и на\nсвете еще не было, что может все сделать, все, все, все! Всем объяви, чтобы\nвсе знали. Кричи во весь народ, валяй в колокола, черт возьми! Уж когда\nторжество, так торжество!\n\n\nКвартальный уходит.\n\nТак вот как, Анна Андреевна, а? Как же мы теперь, где будем жить? здесь или\nв Питере?\n\nАнна Андреевна. Натурально, в Петербурге. Как можно здесь оставаться!\n\nГородничий. Ну, в Питере так в Питере; а оно хорошо бы и здесь. Что, ведь,\nя думаю, уже городничество тогда к черту, а, Анна Андреевна?\n\nАнна Андреевна. Натурально, что за городничество!\n\nГородничий. Ведь оно, как ты думаешь, Анна Андреевна, теперь можно большой\nчин зашибить, потому что он запанибрата со всеми министрами и во дворец\nездит, так поэтому может такое производство сделать, что со временем и в\nгенералы влезешь. Как ты думаешь, Анна Андреевна: можно влезть в генералы?\n\nАнна Андреевна. Еще бы! конечно, можно.\n\nГородничий. А, черт возьми, славно быть генералом! Кавалерию повесят тебе\nчерез плечо. А какую кавалерию лучше, Анна Андреевна: красную или голубую?\n\nАнна Андреевна. Уж конечно, голубую лучше.\n\nГородничий. Э? вишь, чего захотела! хорошо и красную. Ведь почему хочется\nбыть генералом? - потому что, случится, поедешь куда-нибудь - фельдъегеря и\nадъютанты поскачут везде вперед: \"Лошадей!\" И там на станциях никому не\nдадут, все дожидается: все эти титулярные, капитаны, городничие, а ты себе\nи в ус не дуешь. Обедаешь где-нибудь у губернатора, а там - стой,\nгородничий! Хе, хе, хе! (Заливается и помирает со смеху.) Вот что,\nканальство, заманчиво!\n\nАнна Андреевна. Тебе все такое грубое нравится. Ты должен помнить, что\nжизнь нужно совсем переменить, что твои знакомые будут не то что\nкакой-нибудь судья-собачник, с которым ты ездишь травить зайцев, или\nЗемляника; напротив, знакомые твои будут с самым тонким обращением: графы и\nвсе светские... Только я, право, боюсь за тебя: ты иногда вымолвишь такое\nсловцо, какого в хорошем обществе никогда не услышишь.\n\nГородничий. Что ж? ведь слово не вредит.\n\nАнна Андреевна. Да хорошо, когда ты был городничим. А там ведь жизнь совсем\nдругая.\n\nГородничий. Да, там, говорят есть две рыбицы: ряпушка и корюшка, такие, что\nтолько слюнка потечет, как начнешь есть.\n\nАнна Андреевна. Ему все бы только рыбки! Я не иначе хочу, чтоб наш дом был\nпервый в столице и чтоб у меня в комнате такое было амбре, чтоб нельзя было\nвойти и нужно было только этак зажмурить глаза. (Зажмуривает глаза и\nнюхает.) Ах, как хорошо!\n\n\nЯвление II\n\n\n                              Те же и купцы.\n\n\nГородничий. А! Здорово, соколики!\n\nКупцы (кланяясь). Здравия желаем, батюшка!\n\nГородничий. Что, голубчики, как поживаете? как товар идет ваш? Что,\nсамоварники, аршинники, жаловаться? Архиплуты, протобестии, надувалы\nмирские! жаловаться? Что, много взяли? Вот, думают, так в тюрьму его и\nзасадят!.. Знаете ли вы, семь чертей и одна ведьма вам в зубы, что...\n\nАнна Андреевна. Ах, боже мой, какие ты, Антоша, слова отпускаешь!\n\nГородничий (с неудовольствием). А, не до слов теперь! Знаете ли, что тот\nсамый чиновник, которому вы жаловались, теперь женится на моей дочери? Что?\nа? что теперь скажете? Теперь я вас... у!.. обманываете народ... Сделаешь\nподряд с казною, на сто тысяч надуешь ее, поставивши гнилого сукна, да\nпотом пожертвуешь двадцать аршин, да и давай тебе еще награду за это? Да\nесли б знали, так бы тебе... И брюхо сует вперед: он купец, его не тронь.\n\"Мы, говорит, и дворянам не уступим\". Да дворянин... ах ты, рожа! -\nдворянин учится наукам: его хоть и секут в школе, да за дело, чтоб он знал\nполезное. А ты что? - начинаешь плутнями, тебя хозяин бьет за то, что не\nумеешь обманывать. Еще мальчишка, \"Отче наша\" не знаешь, а уж обмериваешь;\nа как разопрет тебе брюхо да набьешь себе карман, так и заважничал! Фу ты,\nкакая невидаль! Оттого, что ты шестнадцать самоваров выдуешь в день, так\nоттого и важничаешь? Да я плевать на твою голову и на твою важность!\n\nКупцы (кланяясь). Виноваты, Антон Антонович!\n\nГородничий. Жаловаться? А кто тебе помог сплутовать, когда ты строил мост и\nнаписал дерева на двадцать тысяч, тогда как его и на сто рублей не было? Я\nпомог тебе, козлиная борода! Ты позабыл это? Я, показавши это на тебя, мог\nбы тебя также спровадить в Сибирь. Что скажешь? а?\n\nКупцы. Богу виноваты, Антон Антонович! Лукавый попутал. И закаемся вперед\nжаловаться. Уж какое хошь удовлетворение, не гневись только!\n\nГородничий. Не гневись! Вот ты теперь валяешься у ног моих. Отчего? -\nоттого, что мое взяло; а будь хоть немножко на твоей стороне, так ты бы\nменя, каналья, втоптал по самую грязь, еще бы и бревном сверху навалил.\n\nКупцы (кланяются в ноги). Не погуби, Антон Антонович!\n\nГородничий. Не погуби! Теперь: не погуби! а прежде что? Я бы вас... (Махнув\nрукой.) Ну, да бог простит! полно! Я не памятозлобен; только теперь смотри\nдержи ухо востро! Я выдаю дочку не за какого-нибудь простого дворянина:\nчтоб поздравление было... понимаешь? не то чтоб отбояриться каким-нибудь\nбалычком или головою сахару... Ну, ступай с богом!\n\n\nКупцы уходят.\n\n\nЯвление III\n\n\n      Те же, Аммос Федорович, Артемий Филиппович, потом Растаковский.\n\n\nАммос Федорович (еще в дверях.) Верить ли слухам, Антон Антонович? к вам\nпривалило необыкновенное счастие?\n\nАртемий Филиппович. Имею честь поздравить с необыкновенным счастием. Я\nдушевно обрадовался, когда услышал. (Подходит к ручке Анны Андреевны.) Анна\nАндреевна! (Подходя к ручке Марьи Антоновны.) Марья Антоновна!\n\nРастаковский(входит). Антона Антоновича поздравляю. Да продлит бог жизнь\nвашу и новой четы и даст вам потомство многочисленное внучат и правнучат!\nАнна Андреевна! (Подходит к ручке Анны Андреевны.) Марья Антоновна!\n(Подходит к ручке Марьи Антоновны.)\n\n\nЯвление IV\n\n\n                     Те же, Коробкин с женою, Люлюков.\n\n\nКоробкин. Имею честь поздравить Антона Антоновича! Анна Андреевна!\n(Подходит к ручке Анны Андреевны.) Марья Антоновна! (Подходит к ее ручке.)\n\nЖена Коробкина. Душевно поздравляю вас, Анна Андреевна, с новым счастием.\n\nЛюлюков. Имею честь поздравить, Анна Андреевна! (Подходит к ручке и потом,\nобратившись к зрителям, щелкает языком с видом удальства.) Марья Антоновна!\nИмею честь поздравить. (Подходит к ее ручке и обращается к зрителям с тем\nже удальством.)\n\n\nЯвление V\n\n\nМножество гостей в сюртуках и фраках подходят сначала к ручке Анны\nАндреевны, говоря: \"Анна Андреевна!\" - потом к Марье Антоновне, говоря:\n\"Марья Антоновна!\". Бобчинский и Добчинский проталкиваются.\n\nБобчинский. Имею честь поздравить!\n\nДобчинский. Антон Антонович! имею честь поздравить!\n\nБобчинский. С благополучным происшествием!\n\nДобчинский. Анна Андреевна!\n\nБобчинский. Анна Андреевна!\n\n\nОба подходят в одно и то же время и сталкиваются лбами.\n\nДобчинский. Марья Антоновна! (Подходит к ручке.) Честь имею поздравить. Вы\nбудете в большом, большом счастии, в золотом платье и ходить и деликатные\nразные супы кушать; очень забавно будете проводить время.\n\nБобчинский (перебивая). Марья Антоновна, имею честь поздравить! Да бог вам\nвсякого богатства, червонцев и сынка-с этакого маленького, вон энтакого-с\n(показывает рукою), что можно было на ладонку посадить, да-с! Все будет\nмальчишка кричать: уа! уа! уа!..\n\n\nЯвление VI\n\n\n      Еще несколько гостей, подходящих к ручкам. Лука Лукич с женою.\n\nЛука Лукич. Имею честь...\n\nЖена Луки Лукича (бежит вперед). Поздравляю вас, Анна Андреевна!\n\n\nЦелуются.\n\nА я так, право, обрадовалась. Говорят мне: \"Анна Андреевна выдает дочку\".\n\"Ах, боже мой!\" - думаю себе, и так обрадовалась, что говорю мужу:\n\"Послушай, Луканчик, вот так счастие Анне Андреевне!\" \"Ну, - думаю себе, -\nслава богу!\" И говорю ему: \"Я так восхищена, что сгораю нетерпением\nизъявить лично Анне Андреевне...\" \"Ах, боже мой! - думаю себе, - Анна\nАндреевна именно ожидала хорошей партии для своей дочери, а вот теперь\nтакая судьба: именно так сделалось, как она хотела\", - и так, право,\nобрадовалась, что не могла говорить. Плачу, плачу, просто рыдаю. Уже Лука\nЛукич говорит: \"отчего ты, Настенька, рыдаешь?\" - \"Луканчик, говорю, я и\nсама не знаю, слезы так вот рекой и льются\".\n\nГородничий. Покорнейше прошу садиться, господа! Эй, Мишка, принеси сюда\nпобольше стульев.\n\n\nГости садятся.\n\n\nЯвление VII\n\n\n                   Те же, частный пристав и квартальные.\n\n\nЧастный пристав. Имею честь поздравить вас, ваше высокоблагородие и\nподелать вам благоденствия на многие лета!\n\nГородничий. Спасибо, спасибо! Прошу садиться, господа!\n\n\nГости усаживаются.\n\nАммос Федорович. Но скажите, пожалуйста, Антон Антонович, каким образом все\nэто началось, постепенный ход всего, то есть, дела.\n\nГородничий. Ход дела чрезвычайный: изволил собственнолично сделать\nпредложение.\n\nАнна Андреевна. Очень почтительным и самым тонким образом. Все чрезвычайно\nхорошо говорил. Говорит: \"Я, Анна Андреевна, из одного только уважения к\nвашим достоинствам...\" И такой прекрасный, воспитанный человек, самых\nблагороднейших правил! \"Мне, верите ли, Анна Андреевна, мне жизнь -\nкопейка; я только потому, что уважаю ваши редкие качества\".\n\nМарья Антоновна. Ах, маменька! ведь это он мне говорил.\n\nАнна Андреевна. Перестань, ты ничего не знаешь и не в свое дело не мешайся!\n\"Я, Анна Андреевна, изумляюсь...\" В таких лестных рассыпался словах... И\nкогда я хотела сказать: \"Мы никак не смеем надеяться на такую честь\", - он\nвдруг упал на колени и таким самым благороднейшим образом: \"Анна Андреевна,\nне сделайте меня несчастнейшим! согласитесь отвечать моим чувствам, не то я\nсмертью окончу жизнь свою\".\n\nМарья Антоновна. Право, маменька, он обо мне это говорил.\n\nАнна Андреевна. Да, конечно... и об тебе было, я ничего этого не отвергаю.\n\nГородничий. И так даже напугал: говорил, что застрелится. \"Застрелюсь,\nзастрелюсь!\" - говорит.\n\nМногие из гостей. Скажите пожалуйста!\n\nАммос Федорович. Экая штука!\n\nЛука Лукич. Вот подлинно, судьба уж так вела.\n\nАртемий Филиппович. Не судьба, батюшка, судьба - индейка: заслуги привели к\nтому. (В сторону.) Этакой свинье лезет в рот всегда счастье!\n\nАммос Федорович. Я, пожалуй, Антон Антонович, продам вам того кобелька,\nкоторого торговали.\n\nГородничий. Нет, мне теперь не до кобельков.\n\nАммос Федорович. Ну, не хотите, на другой собаке сойдемся.\n\nЖена Коробкина. Ах, как, Анна Андреевна, я рада вашему счастью! вы не\nможете себе представить.\n\nКоробкин. Где ж теперь, позвольте узнать, находится именитый гость? Я\nслышал, что он уехал зачем-то.\n\nГородничий. Да, он отправился на один день по весьма важному делу.\n\nАнна Андреевна. К своему дяде, чтобы испросить благословения.\n\nГородничий. Испросить благословения; но завтра же... (Чихает.)\n\n\nПоздравления сливаются в один гул.\n\nМного благодарен! Но завтра же и назад... (Чихает.)\n\n\nПоздравительный гул; слышнее других голоса:\n\nЧастного пристава. Здравия желаем, ваше высокоблагородие!\n\nГолос Бобчинского. Сто лет и куль червонцев!\n\nГолос Добчинского. Продли бог на сорок сороков!\n\nАртемия Филипповича. Чтоб ты пропал!\n\nЖены Коробкина. Черт тебя побери!\n\nГородничий. Покорнейше благодарю! И вам того ж желаю.\n\nАнна Андреевна. Мы теперь в Петербурге намерены жить. А здесь, признаюсь,\nтакой воздух... деревенский уж слишком!.. признаюсь, большая\nнеприятность... Вот и муж мой... он там получит генеральский чин.\n\nГородничий. Да, признаюсь, господа, я, черт возьми, очень хочу быть\nгенералом.\n\nЛука Лукич. И дай бог получить!\n\nРастаковский. От человека невозможно, а от бога все возможно.\n\nАммос Федорович. Большому кораблю - большое плаванье.\n\nАртемий Филиппович. По заслугам и честь.\n\nАммос Федорович (в сторону). Вот выкинет штуку, когда в самом деле\nсделается генералом! Вот уж кому пристало генеральство, как корове седло!\nНу, брат, до этого еще далека песня. Тут и почище тебя есть, а до сих пор\nеще не генералы.\n\nАртемий Филиппович (в сторону). Эка черт возьми, уж и в генералы лезет!\nЧего доброго, может, и будет генералом. Ведь у него важности, лукавый не\nвзял бы его, довольно. (Обращаясь к нему.) Тогда, Антон Антонович, и нас не\nпозабудьте.\n\nАммос Федорович. И если что случится, например какая-нибудь надобность по\nделам, не оставьте покровительством!\n\nКоробкин. В следующем году повезу сынка в столицу на пользу государства,\nтак сделайте милость, окажите ему вашу протекцию, место отца заступите\nсиротке.\n\nГородничий. Я готов со своей стороны, готов стараться.\n\nАнна Андреевна. Ты, Антоша, всегда готов обещать. Во-первых, тебе не будет\nвремени думать об этом. И как можно и с какой стати себя обременять этакими\nобещаниями?\n\nГородничий. Почему ж, душа моя? иногда можно.\n\nАнна Андреевна. Можно, конечно, да ведь не всякой же мелюзге оказывать\nпокровительство.\n\nЖена Коробкина. Вы слышали, как она трактует нас?\n\nГостья. Да, она такова всегда была; я ее знаю: посади ее за стол, она и\nноги свои...\n\n\nЯвление VIII\n\n\n       Те же и почтмейстер впопыхах, с распечатанным письмом в руке.\n\nПочтмейстер. Удивительное дело, господа! Чиновник, которого мы приняли за\nревизора, был не ревизор.\n\nВсе. Как не ревизор?\n\nПочтмейстер. Совсем не ревизор, - я узнал это из письма...\n\nГородничий. Что вы? что вы? из какого письма?\n\nПочтмейстер. Да из собственного его письма. Приносят ко мне на почту\nписьмо. Взглянул на адрес - вижу: \"в Почтамтскую улицу\". Я так и обомлел.\n\"Ну, - думаю себе, - верно, нашел беспорядки по почтовой част и уведомляет\nначальство\". Взял да и распечатал.\n\nГородничий. Как же вы?..\n\nПочтмейстер. Сам не знаю, неестественная сила побудила. Призвал было уже\nкурьера, с тем чтобы отправить его с эштафетой, - но любопытство такое\nодолело, какого еще никогда не чувствовал. Не могу, не могу! слышу, что не\nмогу! тянет, так вот и тянет! В одном ухе так вот и слышу: \"Эй, не\nраспечатывай! пропадешь, как курица\"; а в другом словно бес какой шепчет:\n\"Распечатай, распечатай, распечатай!\" И как придавил сургуч - по жилам\nогонь, а распечатал - мороз, ей-богу мороз. И руки дрожат, и все\nпомутилось.\n\nГородничий. Да как же вы осмелились распечатать письмо такой уполномоченной\nособы?\n\nПочтмейстер. В том-то и штука, что он не уполномоченный и не особа!\n\nГородничий. Что ж он, по-вашему, такое?\n\nПочтмейстер. Ни се ни то; черт знает что такое!\n\nГородничий (запальчиво). как не се ни то? Как вы смеете назвать его ни тем\nни сем, да еще и черт знает чем? Я вас под арест...\n\nПочтмейстер. Кто? Вы?\n\nГородничий. Да, я!\n\nПочтмейстер. Коротки руки!\n\nГородничий. Знаете ли, что он женится на моей дочери, что я сам буду\nвельможа, что я в самую Сибирь законопачу?\n\nПочтмейстер. Эх, Антон Антонович! что Сибирь? далеко Сибирь. Вот лучше я\nвам прочту. Господа! позвольте прочитать письмо!\n\nВсе. Читайте, читайте!\n\nПочтмейстер (читает). \"Спешу уведомить тебя, душа моя Тряпичкин, какие со\nмной чудеса. На дороге обчистил меня кругом пехотный капитан, так что\nтрактирщик хотел уже было посадить в тюрьму; как вдруг, по моей\nпетербургской физиономии и по костюму, весь город принял меня за\nгенерал-губернатора. И я теперь живу у городничего, жуирую, волочусь\nнапропалую за его женой и дочкой; не решился только, с которой начать, -\nдумаю, прежде с матушки, потому что, кажется, готова сейчас на все услуги.\nПомнишь, как мы с тобой бедствовали, обедали нашерамыжку и как один раз\nбыло кондитер схватил меня за воротник по поводу съеденных пирожков на счет\nдоходов аглицкого короля? Теперь совсем другой оборот. Все мне дают взаймы\nсколько угодно. Оригиналы страшные. От смеху ты бы умер. Ты, я знаю, пишешь\nстатейки: помести их в свою литературу. Во-первых, городничий - глуп, как\nсивый мерин...\"\n\nГородничий. Не может быть этого! Там нет этого.\n\nПочтмейстер (показывает письмо). Читайте сами.\n\nГородничий (читает). \"Как сивый мерин\". Не может быть! вы это сами\nнаписали.\n\nПочтмейстер. Как же бы я стал писать?\n\nАртемий Филиппович. Читайте!\n\nЛука Лукич. Читайте!\n\nПочтмейстер (продолжая читать). \"Городничий - глуп, как сивый мерин...\"\n\nГородничий. О, черт возьми! нужно еще повторять! как будто оно там и без\nтого не стоит.\n\nПочтмейстер (продолжая читать). Хм... хм... хм... хм... \"сивый мерин.\nПочтмейстер тоже добрый человек...\" (Оставляя читать.) Ну, тут обо мне тоже\nон неприлично выразился.\n\nГородничий. Нет, читайте!\n\nПочтмейстер. Да к чему ж?..\n\nГородничий. Нет, черт возьми, когда уж читать, так читать! Читайте все!\n\nАртемий Филиппович. Позвольте, я прочитаю. (Надевает очки и читает.)\n\"Почтмейстер точь-в-точь наш департаментский сторож Михеев; должно быть,\nтакже, подлец пьет горькую\".\n\nПочтмейстер (к зрителям.) Ну, скверный мальчишка, которого надо высечь;\nбольше ничего!\n\nАртемий Филиппович (продолжая читать). \"Надзиратель над богоугодным\nзаведе...и...и...и... (Заикается.)\n\nКоробкин. А что ж вы остановились?\n\nАртемий Филиппович. Да нечеткое перо... впрочем, видно, что негодяй.\n\nКоробкин. Дайте мне! Вот у меня, я думаю, получше глаза. (Берет письмо.)\n\nАртемий Филиппович (не давая письмо). Нет, это место можно пропустить, а\nтам дальше разборчиво.\n\nКоробкин. Да позвольте, уж я знаю.\n\nАртемий Филиппович. Прочитать я и сам прочитаю; далее, право, все\nразборчиво.\n\nПочтмейстер. Нет, все читайте! ведь прежде все читано.\n\nВсе. Отдайте, Артемий Филиппович, отдайте письмо! (Коробкину.) Читайте!\n\nАртемий Филиппович. Сейчас. (Отдает письмо.) Вот, позвольте... (Закрывает\nпальцем.) Вот отсюда читайте.\n\n\nВсе приступают к нему.\n\nПочтмейстер. Читайте, читайте! вздор, все читайте!\n\nКоробкин (читая). \"Надзиратель над богоугодным заведением Земляника -\nсовершенная свинья в ермолке\".\n\nАртемий Филиппович (к зрителям). И неостроумно! Свинья в ермолке! где ж\nсвинья бывает в ермолке?\n\nКоробкин (продолжая читать). \"Смотритель училищ протухнул насквозь луком\".\n\nЛука Лукич (к зрителям). Ей-богу, и в рот никогда не брал луку.\n\nАммос Федорович (в сторону). Слава богу, хоть, по крайней мере, обо мне\nнет!\n\nКоробкин (читает). \"Судья...\"\n\nАммос Федорович. Вот тебе на! (Вслух.) Господа, я думаю, что письмо длинно.\nДа и черт ли в нем: дрянь этакую читать.\n\nЛука Лукич. Нет!\n\nПочтмейстер. Нет, читайте!\n\nАртемий Филиппович. Нет уж, читайте!\n\nКоробкин (продолжает). \"Судья Ляпкин-Тяпкин в сильнейшей степени\nмоветон...\" (Останавливается.) Должно быть, французское слово.\n\nАммос Федорович. А черт его знает, что оно значит! Еще хорошо, если только\nмошенник, а может быть, и того еще хуже.\n\nКоробкин (продолжая читать). \"А впрочем, народ гостеприимный и добродушный.\nПрощай, душа Тряпичкин. Я сам, по примеру твоему, хочу заняться\nлитературой. Скучно, брат, так жить; хочешь, наконец, пищи для души. Вижу:\nточно нужно чем-нибудь высоким заняться. Пиши ко мне в Саратовскую\nгубернию, а оттуда в деревню Подкатиловку. (Переворачивает письмо и читает\nадрес.) Его благородию, милостивому государю, Ивану Васильевичу Тряпичкину,\nв Почтамтскую улицу, в доме под нумером девяносто седьмым, поворотя на\nдвор, в третьем этаже направо\".\n\nОдна из дам. Какой репримант неожиданный!\n\nГородничий. Вот когда зарезал, так зарезал! Убит, убит, совсем убит! Ничего\nне вижу. Вижу какие-то свиные рыла вместо лиц, а больше ничего... Воротить,\nворотить его! (Машет рукою.)\n\nКуды воротить! Я, как нарочно, приказал смотрителю дать самую лучшую\nтройку; черт угораздил дать и вперед предписание.\n\nЖена Коробкина. Вот уж точно, беспримерная конфузия!\n\nАммос Федорович. Однако ж, черт возьми, господа! он у меня взял триста\nрублей взаймы.\n\nАртемий Филиппович. У меня тоже триста рублей.\n\nПочтмейстер (вздыхает). Ох! и у меня триста рублей.\n\nБобчинский. У нас с Петром Ивановичем шестьдесят пять-с на ассигнации-с,\nда-с.\n\nАммос Федорович (в недоумении расставляет руки). Как же это, господа? Как\nэто, в самом деле, мы так оплошали?\n\nГородничий (бьет себя по лбу). Как я - нет, как я, старый дурак? Выжил,\nглупый баран, из ума!.. Тридцать лет живу на службе; ни один купец, ни\nподрядчик не мог провести; мошенников над мошенниками обманывал, пройдох и\nплутов таких, что весь свет готовы обворовать, поддевал на уду! Трех\nгубернаторов обманул!.. Что губернаторов! (махнул рукой) нечего и говорить\nпро губернаторов...\n\nАнна Андреевна. Но этого не может быть, Антоша: он обручился с Машенькой...\n\nГородничий (в сердцах). Обручился! Кукиш с маслом - вот тебе обручился!\nЛезет мне в глаза с обрученьем!.. (В исступлении.) Вот смотрите, смотрите,\nвесь мир, все христианство, все смотрите, как одурачен городничий! Дурака\nему, дурака, старому подлецу! (Грозит самому себе кулаком.) Эх ты,\nтолстоносый! Сосульку, тряпку принял за важного человека! Вон он теперь по\nвсей дороге заливает колокольчиком! Разнесет по всему свету историю. Мало\nтого что пойдешь в посмешище - найдется щелкопер, бумагомарака, в комедию\nтебя вставит. Вот что' обидно! Чина,звания не пощадит, и будут все скалить\nзубы и бить в ладоши. Чему смеетесь? - Над собою смеетесь!.. Эх вы!..\n(Стучит со злости ногами об пол.) Я бы всех этих бумагомарак! У, щелкоперы,\nлибералы проклятые! чертово семя! Узлом бы вас всех завязал, в муку бы стер\nвас всех да черту в подкладку! в шапку туды ему!.. (Сует кулаком и бьет\nкаблуком в пол. После некоторого молчания.) До сих пор не могу прийти в\nсебя. Вот, подлинно, если бог хочет наказать, то отнимет прежде разум. Ну\nчто было в этом вертопрахе похожего на ревизора? Ничего не было! Вот просто\nна полмизинца не было похожего - и вдруг все: ревизор! ревизор! Ну кто\nпервый выпустил, что он ревизор? Отвечайте!\n\nАртемий Филиппович (расставляя руки). Уж как это случилось, хоть убей, не\nмогу объяснить. Точно туман какой-то ошеломил, черт попутал.\n\nАммос Федорович. Да кто выпустил - вот кто выпустил: эти молодцы!\n(Показывает на Добчинского и Бобчинского.)\n\nБобчинский. Ей-ей, не я! и не думал...\n\nДобчинский. Я ничего, совсем ничего...\n\nАртемий Филиппович. Конечно, вы.\n\nЛука Лукич. Разумеется. Прибежали как сумасшедшие из трактира: \"Приехал,\nприехал и денег не плотит...\" Нашли важную птицу!\n\nГородничий. Натурально, вы! сплетники городские, лгуны проклятые!\n\nАртемий Филиппович. Чтоб вас черт побрал с вашим ревизором и рассказами!\n\nГородничий. Только рыскает по городу и смущаете всех, трещотки проклятые!\nСплетни сеете, сороки короткохвостые!\n\nАммос Федорович. Пачкуны проклятые!\n\nЛука Лукич. Колпаки!\n\nАртемий Филиппович. Сморчки короткобрюхие!\n\n\nВсе обступают их.\n\nБобчинский. Ей-богу, это не я, это Петр Иванович.\n\nДобчинский. Э, нет, Петр Иванович, вы ведь первые того...\n\nБобчинский. А вот и нет; первые то были вы.\n\n\nЯвление последнее\n\n\n                             Те же и жандарм.\n\n\nЖандарм. Приехавший по именному повелению из Петербурга чиновник требует\nвас сей же час к себе. Он остановился в гостинице.\n\n\nПроизнесенные слова поражают как громом всех. Звук изумления единодушно\nвзлетает из дамских уст; вся группа, вдруг переменивши положение, остается\nв окаменении.\n\n\nНемая сцена\n\n\nГородничий посередине в виде столба, с распростертыми руками и запрокинутой\nназад головою. По правую руку его жена и дочь с устремившимся к нему\nдвиженьем всего тела; за ними почтмейстер, превратившийся в вопросительный\nзнак, обращенный к зрителям; за ним Лука Лукич, потерявшийся самым невинным\nобразом; за ним, у самого края сцены, три дамы, гостьи, прислонившиеся одна\nк другой с самым сатирическим выражением лица, относящимся прямо к\nсемейству городничего. По левую сторону городничего: Земляника, наклонивший\nголову несколько набок, как будто к чему-то прислушивающийся; за ним судья\nс растопыренными руками, присевший почти до земли и сделавший движенье\nгубами, как бы хотел посвистать или произнесть: \"Вот тебе, бабушка, и Юрьев\nдень!\" За ним Коробкин, обратившийся ко зрителям с прищуренным глазом и\nедким намеком на городничего; за ним, у самого края сцены, Бобчинский и\nДобчинский с устремившимися движеньями рук друг к другу, разинутыми ртами и\nвыпученными друг на друга глазами. Прочие гости остаются просто столбами.\nПочти полторы минуты окаменевшая группа сохраняет такое положение. Занавес\nопускается.\n\n\n  Права на этот электронный текст принадлежат Публичной электронной\nбиблиотеке (Евгению Пескину), 1994-1996 год. Разрешено свободное\nраспространение при условии сохранения целостности текста (включая данную\nинформацию). Разрешено свободное использование для некоммерческих целей при\nусловии ссылки на источник.\n\n  Публичная Электронная Библиотека - товарный знак и знак обслуживания,\nпринадлежащие Евгению Пескину.\n\nE-mail: eugene@eugene.msk.su\n\nCopyright 1996 Евгений Пескин, электронный текст\n\nLast-modified: Wed,  8-Apr-98 08:36:46 GMT"}];let current=Number(localStorage.getItem(BOOK_KEY+'_chapter')||0);const toc=document.getElementById('toc'),scroll=document.getElementById('scroll'),pos=document.getElementById('pos'),planet=document.getElementById('planet');function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}function renderToc(){toc.innerHTML=CHAPTERS.map((c,i)=>`<button class="tocBtn" data-i="${i}">${String(i+1).padStart(2,'0')}. ${esc(c.title)}</button>`).join('');toc.querySelectorAll('button').forEach(b=>b.onclick=()=>show(Number(b.dataset.i),true));}function show(i,top=true){current=Math.max(0,Math.min(CHAPTERS.length-1,i));localStorage.setItem(BOOK_KEY+'_chapter',current);const c=CHAPTERS[current];scroll.innerHTML=`<article class="chapter active"><h2>${esc(c.title)}</h2><div class="source">${esc(c.source)}</div><pre>${esc(c.text)}</pre></article>`;document.querySelectorAll('.tocBtn').forEach((b,n)=>b.classList.toggle('active',n===current));pos.textContent=(current+1)+' / '+CHAPTERS.length+' — '+c.title;if(top)window.scrollTo({top:0,behavior:'smooth'});updatePlanet();}function savePlace(){localStorage.setItem(BOOK_KEY+'_chapter',current);localStorage.setItem(BOOK_KEY+'_scroll',String(window.scrollY));updatePlanet();}function restorePlace(){const ch=Number(localStorage.getItem(BOOK_KEY+'_chapter')||0);const sy=Number(localStorage.getItem(BOOK_KEY+'_scroll')||0);show(ch,false);setTimeout(()=>window.scrollTo({top:sy,behavior:'smooth'}),80);}function updatePlanet(){const sy=Number(localStorage.getItem(BOOK_KEY+'_scroll')||0);const max=Math.max(1,document.body.scrollHeight-window.innerHeight);const pct=Math.min(.88,Math.max(.12,sy/max));planet.style.top=(pct*100)+'vh';}window.addEventListener('scroll',()=>{clearTimeout(window.__nexMarkTimer);window.__nexMarkTimer=setTimeout(savePlace,260);});document.getElementById('prevBtn').onclick=()=>show(current-1,true);document.getElementById('nextBtn').onclick=()=>show(current+1,true);document.getElementById('saveMark').onclick=savePlace;planet.onclick=restorePlace;window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1,true);if(e.key==='ArrowLeft')show(current-1,true);});renderToc();restorePlace();
</script></body></html>
