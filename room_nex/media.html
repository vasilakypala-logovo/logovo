<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OTKRIVALKA_ALL</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
  font-family:Arial,sans-serif;
}

#screen{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  font-size:28px;
  letter-spacing:0.15em;

  cursor:pointer;

  background:
    radial-gradient(circle at center,
    rgba(255,255,255,0.08),
    rgba(0,0,0,0.96));
}

#screen:hover{
  background:
    radial-gradient(circle at center,
    rgba(255,255,255,0.14),
    rgba(0,0,0,0.96));
}
</style>
</head>

<body>

<div id="screen">
  ОТКРЫТЬ
</div>

<script>

/* ЧТО ОТКРЫВАТЬ */

const OPEN_FILE = 'myfile.exe';


/* ОТКРЫТИЕ */

document.getElementById('screen').addEventListener('click',()=>{

  window.open(OPEN_FILE,'_blank');

});

</script>

</body>
</html>
