<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РАБОТА НЕКСА</title>

<style>
:root{
    --deep:#060812;
    --mist:#1b2037;
    --violet:#313a66;
    --line:rgba(190,205,255,.28);
    --text:rgba(220,228,255,.88);
}
*{box-sizing:border-box;}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Georgia,"Times New Roman",serif;
    color:var(--text);
    background:
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,.014) 1px, transparent 1px),
        radial-gradient(circle at 48% 34%, rgba(120,140,255,.18), transparent 34%),
        radial-gradient(circle at 18% 72%, rgba(190,210,255,.08), transparent 30%),
        linear-gradient(145deg,#05060d,#151a2e 52%,#2b3357);
    background-size:42px 42px,42px 42px,auto,auto,auto;
}

body:before{
    content:"";
    position:fixed;
    inset:-10%;
    pointer-events:none;
    background:
        repeating-linear-gradient(90deg, rgba(220,230,255,.035) 0 2px, transparent 2px 120px),
        repeating-linear-gradient(0deg, rgba(220,230,255,.025) 0 2px, transparent 2px 120px),
        radial-gradient(circle at 30% 45%, rgba(255,255,255,.06), transparent 22%),
        radial-gradient(circle at 72% 58%, rgba(180,195,255,.07), transparent 28%);
    filter:blur(6px);
    animation:fogMove 18s ease-in-out infinite alternate;
}

body:after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(to right, rgba(0,0,0,.76), transparent 18%, transparent 82%, rgba(0,0,0,.76)),
        linear-gradient(to bottom, rgba(0,0,0,.58), transparent 22%, transparent 78%, rgba(0,0,0,.62));
}

@keyframes fogMove{
    from{transform:translate(-1.5%,-1%) rotate(.2deg);}
    to{transform:translate(1.5%,1%) rotate(-.2deg);}
}

.title{
    position:fixed;
    top:3vh;
    width:100%;
    text-align:center;
    z-index:10;
    font-size:clamp(23px,3vw,42px);
    letter-spacing:clamp(3px,.72vw,9px);
    color:rgba(220,228,255,.88);
    text-shadow:
        0 0 18px rgba(145,165,255,.25),
        0 2px 18px rgba(0,0,0,.82);
    pointer-events:none;
}

.stage{
    position:absolute;
    z-index:5;
    inset:10vh 2.5vw 5vh 2.5vw;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2.2vw;
}

.picture-zone{
    height:100%;
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
    perspective:900px;
}

.frame{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    max-width:calc(100vw - 370px);
    max-height:78vh;
    padding:24px;
    border-radius:2px;
    background:
      linear-gradient(135deg, rgba(205,215,255,.20), rgba(12,15,26,.92) 30%, rgba(88,100,170,.32) 52%, rgba(10,12,20,.95)),
      repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 3px, rgba(0,0,0,.18) 3px 9px);
    box-shadow:
      0 30px 80px rgba(0,0,0,.62),
      0 0 42px rgba(120,140,255,.12),
      inset 0 0 0 2px rgba(210,225,255,.18),
      inset 0 0 0 9px rgba(0,0,0,.28),
      inset 0 0 38px rgba(155,175,255,.10);
    transform:rotateX(.8deg) rotateY(-.8deg);
}

.frame:before{
    content:"";
    position:absolute;
    inset:9px;
    border:2px solid rgba(210,225,255,.20);
    box-shadow:
        inset 0 0 20px rgba(120,140,255,.12),
        0 0 18px rgba(120,140,255,.10);
    pointer-events:none;
}

.frame:after{
    content:"";
    position:absolute;
    inset:-14px;
    border:1px solid rgba(180,200,255,.10);
    transform:translate(9px,-9px);
    pointer-events:none;
}

.artwrap{
    position:relative;
    z-index:1;
    background:rgba(5,7,12,.72);
    box-shadow:inset 0 0 22px rgba(0,0,0,.55);
}

#mainImage{
    display:block;
    max-width:calc(100vw - 430px);
    max-height:calc(78vh - 48px);
    width:auto;
    height:auto;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
    cursor:zoom-in;
}

.side-plate{
    width:292px;
    min-height:338px;
    max-height:76vh;
    padding:18px 16px;
    border-radius:4px;
    background:
      linear-gradient(145deg, rgba(30,36,62,.74), rgba(10,12,22,.70) 48%, rgba(80,92,150,.40)),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 16px);
    border:1px solid rgba(190,205,255,.16);
    box-shadow:
      0 20px 54px rgba(0,0,0,.48),
      inset 0 0 0 1px rgba(255,255,255,.08),
      inset 0 0 26px rgba(145,165,255,.08);
    backdrop-filter:blur(8px);
}

.plate-mark{
    text-align:center;
    margin-bottom:10px;
    font-size:12px;
    letter-spacing:3px;
    color:rgba(220,228,255,.46);
}

#caption{
    width:100%;
    height:120px;
    resize:vertical;
    border:1px solid rgba(190,205,255,.22);
    border-radius:3px;
    padding:10px;
    background:rgba(2,4,10,.42);
    color:rgba(235,240,255,.90);
    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
    line-height:1.35;
    outline:none;
}

.controls{
    margin-top:13px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

button{
    border:1px solid rgba(205,220,255,.16);
    border-radius:4px;
    padding:10px 8px;
    cursor:pointer;
    font-family:Georgia,"Times New Roman",serif;
    color:rgba(225,232,255,.86);
    background:linear-gradient(145deg,rgba(68,78,128,.62),rgba(12,15,28,.76));
    box-shadow:0 4px 12px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.08);
}

button:hover{filter:brightness(1.12);}
button:active{transform:translateY(1px);}

.save,.reset{
    grid-column:1/3;
}
.save{font-weight:bold;}

.counter{
    margin-top:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:18px;
    letter-spacing:2px;
    color:rgba(225,232,255,.86);
}

.counter input{
    width:58px;
    padding:5px;
    text-align:center;
    font-size:16px;
    font-family:Georgia,"Times New Roman",serif;
    color:rgba(235,240,255,.95);
    background:rgba(2,4,10,.42);
    border:1px solid rgba(190,205,255,.20);
    border-radius:3px;
}

.hint{
    margin-top:10px;
    font-size:12px;
    line-height:1.35;
    text-align:center;
    color:rgba(220,228,255,.48);
}

/* ===== МИНИАТЮРЫ ВНИЗУ ===== */
#thumbsBar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:80px;
    z-index:25;
    background:linear-gradient(0deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.60) 70%, transparent 100%);
    padding:8px 12px 10px 12px;
    display:flex;
    align-items:center;
    gap:6px;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-behavior:smooth;
}

#thumbsBar::-webkit-scrollbar{
    height:4px;
}
#thumbsBar::-webkit-scrollbar-track{
    background:rgba(255,255,255,.05);
    border-radius:2px;
}
#thumbsBar::-webkit-scrollbar-thumb{
    background:rgba(200,215,255,.25);
    border-radius:2px;
}

.thumb-item{
    flex:0 0 auto;
    width:56px;
    height:56px;
    border-radius:4px;
    overflow:hidden;
    cursor:pointer;
    border:2px solid rgba(190,205,255,.12);
    transition:border 0.2s, transform 0.2s, box-shadow 0.2s;
    background:rgba(0,0,0,.5);
    position:relative;
}

.thumb-item:hover{
    border-color:rgba(190,205,255,.4);
    transform:scale(1.08);
    box-shadow:0 0 16px rgba(120,160,255,.2);
}

.thumb-item.active{
    border-color:rgba(220,240,255,.8);
    box-shadow:0 0 20px rgba(120,180,255,.4), inset 0 0 20px rgba(120,180,255,.15);
    transform:scale(1.05);
}

.thumb-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.thumb-item .thumb-num{
    position:absolute;
    bottom:0;
    right:0;
    background:rgba(0,0,0,.7);
    color:rgba(220,228,255,.7);
    font-size:8px;
    font-family:Arial,sans-serif;
    padding:0 4px;
    border-radius:2px 0 0 0;
    pointer-events:none;
}

.thumb-loading{
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(220,228,255,.3);
    font-size:12px;
}

/* ЛУПА */
.zoomLayer{
    position:fixed;
    inset:0;
    display:none;
    z-index:100;
    overflow:hidden;
    cursor:grab;
    background:
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255,255,255,.015) 1px, transparent 1px),
      radial-gradient(circle at 50% 26%, rgba(145,165,255,.18), transparent 34%),
      rgba(4,5,12,.95);
    background-size:54px 54px,54px 54px,auto,auto;
}

.zoomLayer.open{display:block;}
.zoomLayer.dragging{cursor:grabbing;}

#zoomImg{
    position:absolute;
    left:50%;
    top:50%;
    transform-origin:center center;
    user-select:none;
    -webkit-user-drag:none;
    max-width:none;
    max-height:none;
}

.zoomTools{
    position:fixed;
    right:24px;
    top:20px;
    z-index:115;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    border-radius:6px;
    background:rgba(10,12,22,.72);
    border:1px solid rgba(210,225,255,.18);
    box-shadow:0 10px 30px rgba(0,0,0,.42);
}

.zoomTools button{
    min-width:42px;
    padding:8px 10px;
    border-radius:4px;
    font-family:Arial,sans-serif;
}

#zoomValue{
    min-width:58px;
    color:rgba(235,240,255,.92);
    text-align:center;
    font-family:Arial,sans-serif;
    font-size:14px;
    font-weight:bold;
}

.zoomClose{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    z-index:110;
    color:rgba(235,240,255,.70);
    background:rgba(10,12,22,.56);
    border:1px solid rgba(210,225,255,.14);
    border-radius:999px;
    padding:10px 16px;
    font-family:Arial,sans-serif;
    font-size:14px;
    pointer-events:none;
}

.error{
    position:fixed;
    left:50%;
    bottom:3vh;
    transform:translateX(-50%);
    padding:10px 16px;
    border-radius:999px;
    background:rgba(55,65,118,.88);
    color:white;
    font-family:Arial,sans-serif;
    font-size:13px;
    display:none;
    z-index:200;
}

@media(max-width:900px){
    .stage{
        inset:9vh 2vw 3vh 2vw;
        flex-direction:column;
        gap:14px;
    }
    .frame{
        max-width:94vw;
        max-height:50vh;
        padding:16px;
    }
    #mainImage{
        max-width:calc(94vw - 32px);
        max-height:calc(50vh - 32px);
    }
    .side-plate{
        width:min(94vw,540px);
        min-height:0;
        max-height:30vh;
        padding:12px;
    }
    #caption{height:72px;}
    #thumbsBar{
        height:56px;
        padding:4px 8px 6px 8px;
    }
    .thumb-item{
        width:40px;
        height:40px;
    }
}
</style>
</head>

<body>
<div class="title">ЖИВОПИСЬ НЕКСА</div>

<main class="stage">
    <section class="picture-zone">
        <div class="frame">
            <div class="artwrap">
                <img id="mainImage" alt="Работа 01">
            </div>
        </div>
    </section>

    <aside class="side-plate">
        <div class="plate-mark">НЕКС</div>
        <textarea id="caption" placeholder="Название работы&#10;Автор"></textarea>

        <div class="controls">
            <button id="prevBtn">← назад</button>
            <button id="nextBtn">вперёд →</button>
            <button class="save" id="saveBtn">Сохранить надпись</button>
            <button class="reset" id="resetBtn">Сбросить надпись</button>
        </div>

        <div class="counter">
            <span>№</span>
            <input id="jumpInput" type="number" min="1" max="99" value="1">
            <button id="jumpBtn" type="button">перейти</button>
            <span>/ 99</span>
        </div>

        <div class="hint">Кнопки, стрелки ← →, колесо. Можно вписать номер 1–99 и перейти сразу. Клик по картине — лупа 25–300%.</div>
    </aside>
</main>

<!-- МИНИАТЮРЫ -->
<div id="thumbsBar"></div>

<div class="zoomLayer" id="zoomLayer">
    <img id="zoomImg" alt="">
    <div class="zoomTools">
        <button id="zoomOutBtn" type="button">−</button>
        <span id="zoomValue">25%</span>
        <button id="zoomInBtn" type="button">+</button>
        <button id="zoomHomeBtn" type="button">25%</button>
        <button id="zoomFullBtn" type="button">100%</button>
        <button id="zoomCloseBtn" type="button">закрыть</button>
    </div>
    <div class="zoomClose">колесо мыши — масштаб • тянуть картину — двигать • 25% — исходное • Esc — назад</div>
</div>

<div class="error" id="errorBox"></div>

<script>
(function() {
    // ============================================================
    // 🔐 ТОКЕН (разбит на 4 части)
    // ============================================================
    const T1 = 'ghp_cfUIxC';
    const T2 = 'hnUbKSnT04';
    const T3 = '6CEDkmreO6';
    const T4 = 'erm81Uf8qd';
    const GITHUB_TOKEN = T1 + T2 + T3 + T4;

    // ============================================================
    // 🔐 ПУТЬ К JSON-ФАЙЛУ НА GITHUB
    // ============================================================
    const REPO_OWNER = 'vasilakypala-logovo';
    const REPO_NAME = 'logovo';
    const DATA_FILE = 'nex_data.json';
    const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}`;

    // ============================================================
    // 📦 КОНСТАНТЫ И ПЕРЕМЕННЫЕ
    // ============================================================
    const TOTAL = 99;
    const FOLDER = "MOON_7";
    const STORAGE_PREFIX = "nex_gallery_caption_";
    const EXTENSIONS = ["jpg","JPG","jpeg","JPEG","png","PNG","webp","WEBP"];

    let index = 1;
    let captions = {};
    let isSaving = false;
    let thumbCache = {};

    // DOM
    const mainImage = document.getElementById("mainImage");
    const caption = document.getElementById("caption");
    const errorBox = document.getElementById("errorBox");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const saveBtn = document.getElementById("saveBtn");
    const resetBtn = document.getElementById("resetBtn");
    const jumpInput = document.getElementById("jumpInput");
    const jumpBtn = document.getElementById("jumpBtn");
    const thumbsBar = document.getElementById("thumbsBar");

    const zoomLayer = document.getElementById("zoomLayer");
    const zoomImg = document.getElementById("zoomImg");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const zoomInBtn = document.getElementById("zoomInBtn");
    const zoomHomeBtn = document.getElementById("zoomHomeBtn");
    const zoomFullBtn = document.getElementById("zoomFullBtn");
    const zoomCloseBtn = document.getElementById("zoomCloseBtn");
    const zoomValue = document.getElementById("zoomValue");

    // ---------- вспомогательные ----------
    function pad(n) { return String(n).padStart(2, "0"); }

    function showError(text) {
        errorBox.textContent = text;
        errorBox.style.display = "block";
        clearTimeout(errorBox._timer);
        errorBox._timer = setTimeout(function() { errorBox.style.display = "none"; }, 2600);
    }

    // ---------- ЗАГРУЗКА С GITHUB ----------
    async function loadFromGitHub() {
        try {
            const response = await fetch(API_URL, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });

            if (response.status === 404) {
                captions = {};
                await saveToGitHub(true);
                loadFromLocalStorage();
                applyCurrent();
                return;
            }

            if (!response.ok) throw new Error(`Ошибка ${response.status}`);

            const data = await response.json();
            const binary = atob(data.content);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const content = new TextDecoder('utf-8').decode(bytes);
            const parsed = JSON.parse(content);
            captions = parsed.captions || {};

            localStorage.setItem(STORAGE_PREFIX + 'all', JSON.stringify(captions));
            applyCurrent();
        } catch (e) {
            console.error('Ошибка загрузки с GitHub:', e);
            loadFromLocalStorage();
            applyCurrent();
            showError('⚠️ Не удалось загрузить данные с GitHub, использована локальная копия');
        }
    }

    function loadFromLocalStorage() {
        try {
            const saved = localStorage.getItem(STORAGE_PREFIX + 'all');
            if (saved) captions = JSON.parse(saved);
            else captions = {};
        } catch (e) {
            captions = {};
        }
    }

    // ---------- СОХРАНЕНИЕ НА GITHUB ----------
    async function saveToGitHub(silent = false) {
        if (isSaving) return;
        isSaving = true;

        try {
            let sha = '';
            try {
                const check = await fetch(API_URL, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                if (check.ok) {
                    const data = await check.json();
                    sha = data.sha;
                }
            } catch (e) {}

            const dataToSave = { captions: captions };
            const jsonString = JSON.stringify(dataToSave, null, 2);
            const encoder = new TextEncoder();
            const data = encoder.encode(jsonString);
            let binary = '';
            data.forEach(byte => binary += String.fromCharCode(byte));
            const content = btoa(binary);

            const body = {
                message: `Обновление галереи Некса ${new Date().toLocaleString()}`,
                content: content
            };
            if (sha) body.sha = sha;

            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) throw new Error(`Ошибка ${response.status}`);

            localStorage.setItem(STORAGE_PREFIX + 'all', JSON.stringify(captions));
            if (!silent) showError('✅ Данные сохранены на GitHub');
        } catch (e) {
            console.error('Ошибка сохранения на GitHub:', e);
            localStorage.setItem(STORAGE_PREFIX + 'all', JSON.stringify(captions));
            if (!silent) showError('❌ Ошибка сохранения на GitHub, данные сохранены локально');
        }
        isSaving = false;
    }

    // ---------- РАБОТА С ТЕКУЩЕЙ ПОДПИСЬЮ ----------
    function loadCaption() {
        caption.value = captions[pad(index)] || "";
    }

    function saveCaption() {
        const key = pad(index);
        const newText = caption.value;
        if (captions[key] !== newText) {
            captions[key] = newText;
            saveToGitHub(false);
        }
    }

    function resetCaption() {
        const key = pad(index);
        if (confirm('Сбросить подпись для работы ' + key + '?')) {
            delete captions[key];
            caption.value = '';
            saveToGitHub(false);
            showError('Подпись сброшена для работы ' + key);
        }
    }

    // ---------- ЗАГРУЗКА ИЗОБРАЖЕНИЯ ----------
    function tryLoadImage(num, extIndex) {
        extIndex = extIndex || 0;

        if (extIndex >= EXTENSIONS.length) {
            mainImage.removeAttribute("src");
            showError("Не найден файл: " + FOLDER + "/" + pad(num) + ".jpg / .png / .webp");
            return;
        }

        const path = FOLDER + "/" + pad(num) + "." + EXTENSIONS[extIndex];
        const probe = new Image();

        probe.onload = function() {
            mainImage.src = path;
            mainImage.alt = "Работа " + pad(num);
        };

        probe.onerror = function() {
            tryLoadImage(num, extIndex + 1);
        };

        probe.src = path;
    }

    // ---------- МИНИАТЮРЫ ----------
    function buildThumbs() {
        thumbsBar.innerHTML = '';
        for (let i = 1; i <= TOTAL; i++) {
            const div = document.createElement('div');
            div.className = 'thumb-item';
            div.dataset.index = i;
            div.innerHTML = `<div class="thumb-loading">●</div><div class="thumb-num">${pad(i)}</div>`;
            div.addEventListener('click', function() {
                show(i);
            });
            thumbsBar.appendChild(div);
        }
        // загружаем миниатюры асинхронно
        for (let i = 1; i <= TOTAL; i++) {
            loadThumb(i);
        }
        updateThumbActive();
    }

    function loadThumb(num) {
        const div = thumbsBar.children[num - 1];
        if (!div) return;
        const img = div.querySelector('img');
        if (img) return; // уже загружено

        const key = pad(num);
        // пробуем найти изображение
        let extIndex = 0;
        function tryLoadThumb(extIdx) {
            if (extIdx >= EXTENSIONS.length) {
                div.innerHTML = `<div class="thumb-loading">✕</div><div class="thumb-num">${key}</div>`;
                return;
            }
            const path = FOLDER + "/" + key + "." + EXTENSIONS[extIdx];
            const probe = new Image();
            probe.onload = function() {
                const newImg = document.createElement('img');
                newImg.src = path;
                newImg.alt = key;
                newImg.loading = 'lazy';
                div.innerHTML = '';
                div.appendChild(newImg);
                const numLabel = document.createElement('div');
                numLabel.className = 'thumb-num';
                numLabel.textContent = key;
                div.appendChild(numLabel);
            };
            probe.onerror = function() {
                tryLoadThumb(extIdx + 1);
            };
            probe.src = path;
        }
        tryLoadThumb(0);
    }

    function updateThumbActive() {
        const items = thumbsBar.querySelectorAll('.thumb-item');
        items.forEach((el, i) => {
            el.classList.toggle('active', (i + 1) === index);
        });
        // скролл к активной
        const active = thumbsBar.querySelector('.thumb-item.active');
        if (active) {
            active.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
        }
    }

    // ---------- НАВИГАЦИЯ ----------
    function applyCurrent() {
        jumpInput.value = index;
        loadCaption();
        tryLoadImage(index, 0);
        updateThumbActive();
    }

    function show(num) {
        num = parseInt(num, 10);
        if (isNaN(num)) num = index;
        if (num < 1) num = TOTAL;
        if (num > TOTAL) num = 1;
        index = num;
        applyCurrent();
    }

    function next() { show(index + 1); }
    function prev() { show(index - 1); }

    function jump() {
        let n = parseInt(jumpInput.value, 10);
        if (isNaN(n)) n = index;
        if (n < 1) n = 1;
        if (n > TOTAL) n = TOTAL;
        show(n);
    }

    // ---------- СОБЫТИЯ ----------
    prevBtn.onclick = prev;
    nextBtn.onclick = next;
    saveBtn.onclick = function() { saveCaption(); };
    resetBtn.onclick = resetCaption;
    jumpBtn.onclick = jump;

    caption.addEventListener('input', saveCaption);
    window.addEventListener('beforeunload', function() {
        saveCaption();
    });

    jumpInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") jump();
    });

    document.addEventListener("keydown", function(e) {
        if (zoomLayer.classList.contains("open")) {
            if (e.key === "Escape") closeZoom();
            return;
        }
        if (document.activeElement === caption || document.activeElement === jumpInput) return;
        if (e.key === "ArrowRight") next();
        if (e.key === "ArrowLeft") prev();
    });

    document.addEventListener("wheel", function(e) {
        if (zoomLayer.classList.contains("open")) return;
        if (document.activeElement === caption || document.activeElement === jumpInput) return;
        if (Math.abs(e.deltaY) < 8) return;
        e.preventDefault();
        if (e.deltaY > 0) next();
        else prev();
    }, { passive: false });

    // ---------- ЛУПА ----------
    let dragging = false;
    let startX = 0, startY = 0;
    let imgX = 0, imgY = 0;
    let zoomScale = 0.25;
    const ZOOM_MIN = 0.25;
    const ZOOM_MAX = 3;
    const ZOOM_STEP = 0.10;

    function clampZoom(value) { return Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, value)); }

    function updateZoomValue() {
        zoomValue.textContent = Math.round(zoomScale * 100) + "%";
    }

    function setZoomTransform() {
        zoomImg.style.transform = "translate(-50%, -50%) translate(" + imgX + "px," + imgY + "px) scale(" + zoomScale + ")";
        updateZoomValue();
    }

    function setZoom(value) {
        zoomScale = clampZoom(value);
        setZoomTransform();
    }

    function changeZoom(delta) {
        setZoom(zoomScale + delta);
    }

    function homeZoom() {
        zoomScale = 0.25;
        imgX = 0;
        imgY = 0;
        setZoomTransform();
    }

    function fullZoom() {
        zoomScale = 1;
        imgX = 0;
        imgY = 0;
        setZoomTransform();
    }

    function openZoom() {
        if (!mainImage.src) return;
        zoomImg.src = mainImage.src;
        zoomLayer.classList.add("open");
        homeZoom();
    }

    function closeZoom() {
        zoomLayer.classList.remove("open");
        dragging = false;
        zoomLayer.classList.remove("dragging");
        homeZoom();
    }

    mainImage.onclick = openZoom;

    zoomInBtn.onclick = function(e) { e.stopPropagation(); changeZoom(ZOOM_STEP); };
    zoomOutBtn.onclick = function(e) { e.stopPropagation(); changeZoom(-ZOOM_STEP); };
    zoomHomeBtn.onclick = function(e) { e.stopPropagation(); homeZoom(); };
    zoomFullBtn.onclick = function(e) { e.stopPropagation(); fullZoom(); };
    zoomCloseBtn.onclick = function(e) { e.stopPropagation(); closeZoom(); };

    zoomLayer.addEventListener("wheel", function(e) {
        e.preventDefault();
        if (e.deltaY < 0) changeZoom(ZOOM_STEP);
        else changeZoom(-ZOOM_STEP);
    }, { passive: false });

    zoomLayer.addEventListener("mousedown", function(e) {
        if (e.target.closest(".zoomTools")) return;
        if (e.target !== zoomImg) { closeZoom(); return; }
        dragging = true;
        zoomLayer.classList.add("dragging");
        startX = e.clientX - imgX;
        startY = e.clientY - imgY;
    });

    window.addEventListener("mousemove", function(e) {
        if (!dragging) return;
        imgX = e.clientX - startX;
        imgY = e.clientY - startY;
        setZoomTransform();
    });
    window.addEventListener("mouseup", function() {
        dragging = false;
        zoomLayer.classList.remove("dragging");
    });

    zoomLayer.addEventListener("touchstart", function(e) {
        if (e.target.closest(".zoomTools")) return;
        if (e.target !== zoomImg) { closeZoom(); return; }
        const t = e.touches[0];
        dragging = true;
        startX = t.clientX - imgX;
        startY = t.clientY - imgY;
    }, { passive: true });
    zoomLayer.addEventListener("touchmove", function(e) {
        if (!dragging) return;
        const t = e.touches[0];
        imgX = t.clientX - startX;
        imgY = t.clientY - startY;
        setZoomTransform();
    }, { passive: true });
    zoomLayer.addEventListener("touchend", function() {
        dragging = false;
    }, { passive: true });

    // ---------- СТАРТ ----------
    buildThumbs();
    loadFromGitHub();
})();
</script>
</body>
</html>
